[versions]
# Toolchain. The SDK levels live here too, so the convention plugins and the app read one source.
agp = "9.5.0"
kotlin = "2.4.21"
jvmToolchain = "21"
compileSdk = "37"
targetSdk = "37"
minSdk = "28"

# Libraries.
activityCompose = "1.13.0"
androidxBrowser = "1.10.0"
androidxCore = "1.19.1"
androidxTestCore = "1.7.0"
androidxTestJunit = "1.3.0"
# Item icons with a disk cache (lane F2, spec §11).
coil = "3.0.4"
composeBom = "2026.09.00"
coroutines = "1.11.0"
datastore = "1.3.0"
junit = "4.13.2"
ktor = "3.6.1"
lifecycle = "2.11.0"
robolectric = "4.17"
roborazzi = "1.77.0"
# Crash and hang reporting (lane P2): sentry-android-core, no NDK, replay or performance.
sentry = "8.61.0"
serialization = "1.12.0"
tink = "1.24.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidxBrowser" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-datastore-core = { module = "androidx.datastore:datastore-core", version.ref = "datastore" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-core" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

sentry-android-core = { module = "io.sentry:sentry-android-core", version.ref = "sentry" }

tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }

junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }

# Build logic: the convention plugins compile against these.
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }

# The repo's own convention plugins, from build-logic.
forever-android-application = { id = "forever.android.application" }
forever-android-library = { id = "forever.android.library" }
forever-android-compose = { id = "forever.android.compose" }
forever-contract-fixtures = { id = "forever.contract-fixtures" }
forever-shared-fonts = { id = "forever.shared-fonts" }
forever-app-icon = { id = "forever.app-icon" }
forever-app-version = { id = "forever.app-version" }
forever-brand-art = { id = "forever.brand-art" }
