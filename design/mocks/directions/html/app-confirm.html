<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in to the Forever Sixty app</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#67563a;color:rgba(255,255,255,.78);font:16px/1.55 'Open Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.band{background:linear-gradient(#054562 0,#054562 calc(100% - 96px),#67563a 100%);padding:0 18px 96px}
.col{max-width:560px;margin:0 auto}
.mark{display:block;padding:18px 0 0;font:400 22px/1 'Marcellus',Optima,Candara,Georgia,serif;color:#f3eee2;letter-spacing:-.015em}
h1{margin:0;padding:22px 0 0;font:400 21px/25px 'Marcellus',Optima,Candara,Georgia,serif;letter-spacing:-.015em;color:#f3eee2;text-shadow:0 1px 2px rgba(0,0,0,.45);text-wrap:balance}
main{margin-top:-76px;padding:0 18px 40px}
.panel{position:relative;background:#170e09;border:1px solid #000;box-shadow:0 0 0 1px rgba(130,112,91,.55);border-radius:10px;padding:22px 24px}
.panel::before{content:"";position:absolute;inset:6px;border:1px solid rgba(243,238,226,.42);border-radius:6px;pointer-events:none}
.panel p{margin:0}
.go{display:flex;align-items:center;justify-content:center;height:44px;margin-top:18px;padding:0 20px;border:1px solid #408076;
  border-radius:6px;background:#0f6064;color:#fff;font-weight:600;text-decoration:none}
.note{margin-top:16px!important;font-size:14px;line-height:20px;color:rgba(255,255,255,.5)}
@media(min-width:768px){.mark{padding-top:24px}h1{padding-top:28px;font-size:26px;line-height:30px}}
</style></head><body><div class="band"><div class="col"><span class="mark">Forever Sixty</span><h1>Sign in to the app</h1></div></div><main><div class="col panel"><p>Sign in on Battle.net and the app picks it up from there.</p><a class="go" href="#">Continue to Battle.net</a><p class="note">Didn&#x27;t start this sign-in from the app? Close this page.</p></div></main></body></html>
