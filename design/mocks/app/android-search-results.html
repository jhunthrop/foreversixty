<!doctype html><html lang="en"%HTML_ATTRS%><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Search</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600&family=Marcellus&family=Open+Sans:wght@400;600;700&display=swap"><style>%CHROME_CSS%</style><style>
:root{--bg:#07090d;--raised:#0d111a;--hover:#131824;--line:#262e40;--line-soft:#1c2230;--line-warm:#3a3326;
--text:#e9e4d8;--strong:#f2eee4;--muted:#9a9484;--nav:#b9b3a4;--gold:#e5b955;--gold-hover:#f5d27a;--kill:#7fd48a;--wipe:#f0736b;
--font-title:'Marcellus',Georgia,serif;--font-body:'Barlow','Helvetica Neue',Arial,sans-serif;
/* proposed layout tokens */
--page-max:1344px;--page-gutter:48px;--page-inset:18px;--section-gap:48px;--gap:24px;--measure-reading:720px;--rail-w:360px;--toc-w:200px;
--bar-h:56px;--row-h:56px}
@media(min-width:768px){:root{--page-inset:0px}}
@media(min-width:1760px){:root{--page-max:clamp(1600px,calc(100vw - 160px),1792px);--page-gutter:64px;--section-gap:64px;--gap:32px;--rail-w:400px}}
*{box-sizing:border-box}
html{font-size:16px}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body)}body{font-size:15px;line-height:24px}
a{color:var(--gold);text-decoration:none}a:hover{color:var(--gold-hover)}
h1,h2,h3,p,ul,dl,dd{margin:0}ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* type scale, decided 2026-11-05 (option 2 with class colour): Marcellus for the page title only, once per page, in the
   spec or class colour; everything else is Barlow. Item names 700 in quality colour, section heads 700 normal case,
   numbers Barlow tabular. No mono, no condensed, no all-caps headings. Nothing under 12. */
.t-title{font:400 40px/46px var(--font-title);letter-spacing:.01em;color:var(--strong)}
.t-h2{font:700 22px/28px var(--font-body);color:var(--strong)}
.t-h3{font:700 18px/24px var(--font-body);color:var(--strong)}
.t-item{font:700 18px/22px var(--font-body)}
.t-lead{font-size:17px;line-height:26px;max-width:62ch;color:var(--text)}
.t-prose{font-size:16px;line-height:26px;max-width:var(--measure-reading)}
.t-small{font-size:13px;line-height:20px;color:var(--muted)}
.t-label{font:700 12px/16px var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--font-body);font-variant-numeric:tabular-nums;font-weight:700}
.strong{color:var(--strong)}.muted{color:var(--muted)}.gold{color:var(--gold)}.kill{color:var(--kill)}.wipe{color:var(--wipe)}
@media(max-width:767px){.t-title{font-size:32px;line-height:38px}.t-h2{font-size:20px;line-height:26px}}
/* the one page column */
.pc{width:100%;max-width:var(--page-max);margin-inline:auto;padding-inline:var(--page-inset)}
@media(min-width:768px){.pc{padding-inline:var(--page-gutter)}}
.full-bleed{width:100%}
/* surfaces: S0 page, S1 plate (the page's one primary object), S2 hover. Nothing else has a box. */
.plate{background:var(--raised);border:1px solid var(--line);border-radius:6px;min-width:0}
.rule{border-top:1px solid var(--line-soft)}
.section{padding-top:var(--section-gap)}
.sh{display:flex;align-items:baseline;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line-soft);margin-bottom:16px}
.sh .t-small{margin-left:auto}
/* buttons: one primary per view */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--strong);font:700 13px/16px var(--font-body);letter-spacing:.01em;white-space:nowrap}
.btn:hover{border-color:var(--gold);color:var(--gold-hover)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#17110a}.btn.primary:hover{background:var(--gold-hover);color:#17110a}
.btn.sm{height:36px;padding:0 18px}
.link{font-weight:600}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:3px;font:600 12px/16px var(--font-body);letter-spacing:.01em;border:1px solid var(--gold);color:var(--gold)}
.ic{border-radius:5px;border:1px solid #4a4030;background:#10141d;flex:none;display:inline-block;object-fit:cover}
.ic.q3{border-color:#0070dd}.ic.q4{border-color:#a335ee}.ic.q2{border-color:#1eff00}.ic.q5{border-color:#ff8000}
.crest{flex-shrink:0;object-fit:cover;border-radius:999px;box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 55%,transparent);background:var(--raised)}
.bar-track{height:8px;border-radius:3px;background:var(--line-soft);overflow:hidden}.bar-track>i{display:block;height:100%;background:var(--gold);border-radius:3px}
/* page head: crest + title left, the answer right */
.head{display:grid;gap:16px;padding-block:16px 14px;grid-template-columns:minmax(0,1fr);align-items:start}
.head .id{display:flex;gap:16px;align-items:center;min-width:0}
.head .id>div{min-width:0}
.head .ans{display:flex;flex-direction:column;gap:4px}
@media(min-width:900px){.head{grid-template-columns:minmax(0,1fr) auto;padding-block:20px 16px}.head .ans{align-items:flex-end;text-align:right}}
/* THE control bar: one pattern for every page */
.cbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(6px);border-block:1px solid var(--line-soft)}
.cbar .pc{display:flex;align-items:center;gap:20px;min-height:var(--bar-h);padding-block:6px;flex-wrap:wrap}
.cbar .grp{display:flex;align-items:center;gap:8px}
.cbar .grp>.t-label{display:none}
@media(min-width:1280px){.cbar:not([data-labels-from="1920"]) .grp>.t-label{display:block}}
@media(min-width:1920px){.cbar .grp>.t-label{display:block}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg a{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;font:600 14px/16px var(--font-body);color:var(--nav);border-left:1px solid var(--line-soft);white-space:nowrap}
.seg a:first-child{border-left:0}
.seg a:hover{background:var(--hover);color:var(--strong)}
.seg a.on{background:#e5b9551a;color:var(--gold);box-shadow:inset 0 -2px 0 var(--gold)}
.seg a .n{font-size:12px;color:var(--muted)}.seg a.on .n{color:var(--gold)}
.sel{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:4px;font:600 14px/16px var(--font-body);color:var(--strong)}
.sel::after{content:"\25BE";color:var(--muted);font-size:12px}
.cbar .end{margin-left:auto;display:flex;gap:16px;align-items:center}
.bar-d{display:none}.bar-m{display:block;width:100%}
@media(min-width:768px){.bar-d{display:contents}.bar-m{display:none}}
.bar-m summary{display:flex;align-items:center;gap:10px;min-height:48px;list-style:none;font:600 14px/20px var(--font-body);color:var(--strong);cursor:pointer}
.bar-m summary::-webkit-details-marker{display:none}
.bar-m summary .chg{margin-left:auto;color:var(--gold);font-size:13px}
.bar-m .stack{display:flex;flex-direction:column;gap:12px;padding-bottom:12px}
.bar-m .seg{display:flex}.bar-m .seg a{flex:1;justify-content:center;height:44px}.bar-m .sel{height:44px;width:100%;justify-content:space-between}
.cbar.static{position:static;background:none;border-top:0}
.mocknote{margin-block:32px 0;font-size:12px;color:var(--muted)}
.ic.fit,.fit>.ic{width:100%!important;height:auto!important;aspect-ratio:1}
body{display:flex;flex-direction:column;min-height:100vh}.fs-foot{margin-top:auto}main{padding-bottom:calc(0px + 40px)}@media(min-width:1024px){main{padding-bottom:calc(0px + 64px)}}</style><style>
/* ---- native deltas over the web system (spec 3.3: N1 to N4) ---- */
/* round 5 (lane M0): the apps set Open Sans, so their mocks do too */
:root{--page-inset:16px!important;--font-body:'Open Sans',Arial,sans-serif!important}
@media(min-width:0px){.pc{padding-inline:16px!important}}
.t-label,.cdn .eb,.frow .wh .k,.rgrp>h3,.menu .mg,.rprose .glabel,.gridm .h,.cdn .clk>span>span{text-transform:none!important;letter-spacing:.01em!important}
.cdn .clk>span>span,.frow .wh .k{font-size:12px!important}
.fs-chrome{display:none!important}
/* the phone paperdoll cell (spec 3.4 Paperdoll): the slot label sits above the name so the name and source get the width */
.cell{grid-template-columns:40px minmax(0,1fr) auto!important;row-gap:0}
.cell>.lb{grid-column:2;grid-row:1;flex-direction:row!important;gap:8px;font-size:12px!important;line-height:16px!important}
.cell>:nth-child(2){grid-column:1;grid-row:1/span 2;margin-top:2px}
.cell>.bd{grid-column:2;grid-row:2}
.cell>.gn,.cell>.gn0,.cell>span:last-child:not(.bd){grid-column:3;grid-row:1/span 2;width:auto!important;max-width:104px}
body{min-height:var(--dev-h)!important}
main{min-height:calc(var(--dev-h) - var(--top) - var(--bottom));flex:1 0 auto}
/* phone: the two countdown panels stack (the web mock keeps two columns at 390 and overflows; spec 5 H-1) */
.cds{grid-template-columns:minmax(0,1fr)!important}
/* ---- the frame ---- */
.app-status{position:relative;flex:none;height:var(--status);z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 32px;
  font:600 16px/1 -apple-system,'SF Pro Text','Open Sans',sans-serif;color:var(--strong);background:var(--bg)}
.app-status .island{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000}
.app-status .sys{display:flex;gap:6px;align-items:center}.app-status .sys i{display:block;width:17px;height:11px;border-radius:2px;background:var(--strong)}
.app-status .sys i.b{width:25px;height:12px;border-radius:3px}
[data-platform=android] .app-status{padding:0 20px;font:500 14px/1 'Roboto','Open Sans',sans-serif}
.app-nav{position:relative;flex:none;height:var(--nav);z-index:49;display:flex;align-items:center;gap:8px;padding:0 8px;background:var(--bg)}
.app-nav a{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;color:var(--gold);font:400 17px/1 var(--font-body);gap:2px}
.app-nav .ttl{flex:1;text-align:center;font:600 17px/22px var(--font-body);color:var(--strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-nav .ttl.hidden{visibility:hidden}
[data-platform=android] .app-nav{padding:0 4px}[data-platform=android] .app-nav a{min-width:48px;height:48px;color:var(--strong)}
[data-platform=android] .app-nav .ttl{text-align:left;font-size:20px;line-height:28px;padding-left:4px}
.app-tabs{position:relative;flex:none;height:calc(var(--bottom) - var(--home));z-index:49;display:grid;grid-template-columns:repeat(4,1fr);align-items:start;
  background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line-soft);padding-top:6px}
.app-tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:44px;color:var(--nav);font:600 12px/14px var(--font-body)}
.app-tabs a.on{color:var(--gold)}
.app-tabs a{position:relative}.app-tabs .badge{position:absolute;top:-2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--wipe);color:#17110a;font:700 12px/18px var(--font-body);text-align:center}
[data-platform=android] .app-tabs .badge{top:2px;left:calc(50% + 10px)}
.app-nav .menu-crest{position:relative;width:44px;height:44px}
.app-nav .menu-crest .anon{width:32px;height:32px;border-radius:50%;box-shadow:0 0 0 2px #9a9484;background:var(--raised)}
.pf{position:relative;display:inline-block;flex:none}
.pf-img{width:100%;height:100%;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--ring);background:var(--raised);display:block}
.pf-anon{display:flex!important;align-items:center;justify-content:center;color:var(--muted)}
.pf-badge{position:absolute;top:-3px;right:-4px;object-fit:contain;filter:drop-shadow(0 0 1px var(--bg)) drop-shadow(0 0 1px var(--bg))}
.app-nav .menu-crest .anon{display:flex;align-items:center;justify-content:center;color:var(--muted)}
[data-platform=android] .app-tabs{padding-top:12px;border-top:0;background:var(--raised)}
[data-platform=android] .app-tabs a{gap:4px;min-height:48px}
[data-platform=android] .app-tabs a .ind{display:flex;align-items:center;justify-content:center;width:64px;height:32px;border-radius:16px}
[data-platform=android] .app-tabs a.on .ind{background:#e5b9552e}
[data-platform=android] .app-tabs a.on{color:var(--strong)}[data-platform=android] .app-tabs a.on svg{color:var(--gold)}
.app-home{display:block;flex:none;align-self:center;margin:calc((var(--home) - 5px) / 2) 0;width:134px;height:5px;border-radius:3px;background:var(--strong);z-index:51}
[data-platform=android] .app-home{width:108px;height:4px;opacity:.7}
/* pull to refresh affordance, drawn only on the states that show it */
.app-ptr{display:flex;justify-content:center;padding:10px 0 0}.app-ptr span{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--gold)}

/* ---- Page: one column, four layouts ---- */
.layout-split{display:grid;gap:var(--gap);grid-template-columns:minmax(0,1fr);align-items:start}
@media(min-width:1024px){.layout-split{grid-template-columns:minmax(0,1fr) 340px}}
@media(min-width:1760px){.layout-split{grid-template-columns:minmax(0,1fr) var(--rail-w)}}

.layout-split>.rail{gap:32px}
@media(min-width:1024px){.layout-split>.rail.sticky{position:sticky;top:76px}}
/* ---- PageHeader ---- */
.ph-wrap{padding-bottom:0}
.ph-title{display:flex;gap:16px;align-items:center;min-width:0}
/* below 900 the side is no box: the answer, then the actions, each a row of the head's grid (16 px apart); a hidden
   answer leaves no gap (web ui/PageHeader) */
@media(max-width:899px){.ph-side{display:contents}.ph-side>.ans{order:1}.ph-side>.ph-actions{order:2}}
@media(min-width:900px){.ph-side{display:flex;flex-direction:row;align-items:flex-end;gap:24px;min-width:0}.ph-side .ph-actions{justify-content:flex-end}.ph-side:has(>.ans)>.ph-actions{margin-bottom:-6px}.head .ans{max-width:26rem}}
.ph-title .t-title{overflow-wrap:anywhere}
/* the crumb (a way back) on the band above the title: it takes the row's top padding (web PageHeader .ui-page-header-crumb) */
.ph-crumb{display:flex;align-items:center;min-height:32px;padding-top:4px}.ph-crumb+.head{padding-top:0}
.ph-crumb a{display:inline-flex;align-items:center;min-height:32px;font-size:14px;color:var(--muted);text-decoration:none}
/* the notice line under the row, one style (web .ui-page-header-notice: 10 px under the row, the head's 14 px under it) */
.head:has(+.ph-notice){padding-bottom:0}.ph-notice{margin-top:10px;padding-bottom:14px}
/* a pending title: the skeleton holds the title row, the heading is for a screen reader only */
.ph-title-sk{display:block;width:280px;max-width:100%;height:30px}@media(max-width:767px){.ph-title-sk{height:25px}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

.ph-tabs{margin-top:8px}

.sec-h .act{margin-left:auto;font-weight:600;font-size:14px}

.rpanel>.rsec>.sec-h{padding-bottom:0;border-bottom:0}
.rpanel .rsec>.sec-h h2{font:400 24px/30px var(--font-title);letter-spacing:-.015em;color:var(--cream)}
.rpanel .rd{padding-top:12px}

@media(min-width:1280px){.rpanel .rd:not(.solo){grid-template-columns:minmax(0,var(--measure-reading,720px)) minmax(380px,1fr);column-gap:28px}
.rpanel .rd:not(.solo)>.rd-lane{padding-left:18px;border-left:1px solid var(--line-soft)}}
.plate.framed{position:relative}
.plate.framed::before{content:"";position:absolute;inset:6px;border:1px solid rgba(243,238,226,.42);border-radius:6px;pointer-events:none}

.rd-more{display:none}.rd-more:not(:empty){display:block;margin-top:24px;padding-top:16px;border-top:1px solid var(--line-soft);columns:340px;column-gap:28px}
.rd-more [data-wrapped]{break-inside:avoid}
@media(max-width:1279.98px){.rd[data-prose-first]{grid-template-areas:'prose' 'lane'}}
@media(min-width:1280px){.rd{align-items:start}.rd[data-lane-sticky]>.rd-lane{position:sticky;top:12px}}

.cspick{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
@media(min-width:768px){.cspick{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1024px){.cspick{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cspick-c{padding-bottom:8px;min-width:0}

.layout-wb.panels{--section-gap:22px}
.porder-s .ah img,.porder-s .ah .ic{opacity:.5}.porder-s .ah b{opacity:.7}
.porder-s .ah::after{content:"";position:absolute;inset:0;border-radius:5px;border:1px dashed var(--line)}
@media(min-width:1280px){.layout-wb.panels{column-gap:28px}.layout-wb.panels>.main,.layout-wb.panels>.rail{gap:22px}}

@media(max-width:767px){.porder-r .porder-s>span,.porder-r .porder-s img,.porder-r .porder-s .ic,.porder-r .porder-s .em{width:100%!important;max-width:30px;height:auto!important;aspect-ratio:1}.porder-r .porder-s img,.porder-r .porder-s .ic{display:block}}

.layout-wb>.below{display:contents}
@media(min-width:1280px){.layout-wb>.below{grid-column:1/-1;display:flex;flex-direction:column;gap:var(--section-gap);min-width:0}}

.btn.subscribe{background:var(--teal-edge);border-color:var(--teal-edge);color:var(--strong)}
:root{--radius-field:4px;--selected:#0093b229;--shadow-selected-underline:inset 0 -3px 0 #0093b2}


.tt-trees {
  --cell: 44px;
  --cgap: 8px;
  --cell-radius: 5px;
  --ring-w: 2px;
  --rk-font: 12px;
  --rk-line: 14px;
  --rk-pad: 4px;
  --rk-off: -5px;
  --arrow-w: 2px;
  --grid-pad: 6px;
  --head-icon: 28px;
  --head-font: 15px;
  --head-line: 20px;
  --points-font: 18px;
  --points-line: 24px;
  --head-gap: 14px;
}
.tt-trees[data-size='md'] {
  --head-icon: 22px;
  --points-font: 15px;
  --points-line: 20px;
  --head-gap: 10px;
}
@media (min-width: 768px) {
  .tt-trees[data-size='lg'] {
    --cell: 48px;
  }
  .tt-trees[data-size='md'] {
    --cell: 36px;
    --cgap: 6px;
    --rk-font: 11px;
    --rk-line: 13px;
    --rk-pad: 3px;
    --rk-off: -4px;
  }
}
@media (min-width: 1760px) {
  .tt-trees[data-size='lg'] {
    --cell: 56px;
    --cgap: 10px;
  }
}


.tt-trees[data-size='sm'] {
  --cgap: 4px;
  --tree-gap: 16px;
  --cell-radius: 3px;
  --ring-w: 1.5px;
  --rk-font: 9px;
  --rk-line: 11px;
  --rk-pad: 2px;
  --rk-off: -3px;
  --arrow-w: 1.5px;
  --grid-pad: 3px;
  --head-icon: 16px;
  --head-font: 13px;
  --head-line: 18px;
  --points-font: 13px;
  --points-line: 18px;
  --head-gap: 6px;
  container-type: inline-size;
}
.tt-trees[data-size='sm'] .tt-cols {
  --cell: clamp(
    18px,
    calc((100cqw - 2 * var(--tree-gap) - 9 * var(--cgap) - 6 * var(--grid-pad)) / 12 - 0.5px),
    32px
  );
  
  --tree-w: calc(4 * var(--cell) + 3 * var(--cgap) + 2 * var(--grid-pad));
  display: grid;
  gap: var(--tree-gap);
  grid-template-columns: repeat(var(--n), var(--tree-w));
}
.tt-trees[data-size='sm'] .tt {
  --tree-align: flex-start;
}
.tt-trees[data-size='sm'] .tt-h {
  --points-left: 0;
  gap: 6px;
}
@media (max-width: 767px) {
  .tt-trees[data-size='sm'] {
    --cgap: 3px;
    --tree-gap: 10px;
  }
  
  .tt-trees[data-size='sm'] .tt-h {
    flex-wrap: wrap;
    align-content: flex-end;
    row-gap: 0;
    min-height: 40px;
  }
  .tt-trees[data-size='sm'] .tt-h h3 {
    white-space: normal;
  }
  
  .tt-trees[data-size='sm'] .tt-h img {
    display: none;
  }
}
@container (max-width: 270px) {
  .tt-trees[data-size='sm'] .tt-cols {
    grid-template-columns: var(--tree-w);
  }
}


.tt-tabs {
  display: flex;
  border: 1px solid var(--line);
  border-radius: var(--radius-field);
  overflow: hidden;
  margin: 12px 12px 0;
}
.tt-tabs button {
  all: unset;
  box-sizing: border-box;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-height: 60px;
  padding: 8px 4px;
  border-left: 1px solid var(--line-soft);
  cursor: pointer;
  color: var(--nav);
  font: 600 12px/16px var(--font-body);
  text-align: center;
}
.tt-tabs button:first-child {
  border-left: 0;
}
.tt-tabs button:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: -2px;
}
.tt-tabs button > span {
  display: flex;
  align-items: center;
  gap: 6px;
}
.tt-tabs b {
  font: 700 15px/20px var(--font-body);
  font-variant-numeric: tabular-nums;
  color: var(--strong);
}
.tt-tabs button[aria-selected='true'] {
  background: var(--selected);
  color: var(--strong);
  box-shadow: var(--shadow-selected-underline);
}
.tt-tabs img {
  display: block;
  width: 22px;
  height: 22px;
  border-radius: 4px;
  flex: none;
}
.tt-trees:not([data-size='sm']) .tt-cols {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
}
.tt-trees:not([data-size='sm']) .tt-col {
  padding: 14px 12px 18px;
  min-width: 0;
}
.tt-trees[data-bare]:not([data-size='sm']) .tt-col {
  padding: 12px 0 0;
}
@media (max-width: 767px) {
  .tt-trees:not([data-size='sm']) .tt-col:not(.on) {
    display: none;
  }
  .tt-trees:not([data-size='sm']) .tt-h {
    display: none;
  }
}
@media (min-width: 768px) {
  .tt-trees:not([data-size='sm']) .tt-tabs {
    display: none;
  }
  .tt-trees:not([data-size='sm']) .tt-cols {
    grid-template-columns: repeat(var(--n), minmax(0, 1fr));
  }
  .tt-trees:not([data-size='sm']) .tt-col + .tt-col {
    border-left: 1px solid var(--line-soft);
  }
  .tt-trees[data-bare]:not([data-size='sm']) .tt-col {
    padding: 0 12px;
  }
  .tt-trees[data-bare]:not([data-size='sm']) .tt-col:first-child {
    padding-left: 0;
  }
  .tt-trees[data-bare]:not([data-size='sm']) .tt-col:last-child {
    padding-right: 0;
  }
}
@media (min-width: 1280px) {
  .tt-trees:not([data-bare]):not([data-size='sm']) .tt-col {
    padding: 16px 20px 20px;
  }
}


.tt-f {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 16px;
  padding: 12px 16px;
  border-top: 1px solid var(--line-soft);
}
.tt-f .st2 {
  flex-basis: 100%;
  min-height: 20px;
  margin: 0;
  font-size: 14px;
  line-height: 20px;
  color: var(--strong);
}
.tt-f .st2.wipe {
  color: var(--wipe);
}
.tt-f .rs {
  margin-left: auto;
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}


.tt {
  display: flex;
  flex-direction: column;
  align-items: var(--tree-align, center);
  gap: var(--head-gap);
  min-width: 0;
}
.tt-h {
  align-self: stretch;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  min-height: var(--head-icon);
}
.tt-h img {
  display: block;
  width: var(--head-icon);
  height: var(--head-icon);
  border-radius: 4px;
  flex: none;
}
.tt-h h3 {
  font: 700 var(--head-font) / var(--head-line) var(--font-body);
  color: var(--strong);
  margin: 0;
  min-width: 0;
  white-space: nowrap;
}
.tt-h b {
  margin-left: var(--points-left, auto);
  font: 700 var(--points-font) / var(--points-line) var(--font-body);
  font-variant-numeric: tabular-nums;
  color: var(--gold);
}
.tt-h b.zero {
  color: var(--muted);
}
.tt-reset {
  all: unset;
  cursor: pointer;
  font: 600 13px/18px var(--font-body);
  color: var(--gold);
  border-radius: 2px;
}

@media (pointer: coarse) {
  .tt-reset {
    padding: 13px 8px;
    margin: -13px -8px;
  }
}
.tt-reset:hover {
  color: var(--gold-hover);
}
.tt-reset:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}
.tt-g {
  position: relative;
  display: grid;
  grid-template-columns: repeat(var(--cols), var(--cell));
  gap: var(--cgap);
  padding: var(--grid-pad);
}
.tt-g:focus {
  outline: none;
}
.tt-g > [role='row'] {
  display: contents;
}
.tt-g [role='gridcell'] {
  position: relative;
  width: var(--cell);
  height: var(--cell);
}
.tt-art {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 4px;
  opacity: 0.5;
  pointer-events: none;
}
.tt-arrows {
  position: absolute;
  inset: var(--grid-pad);
  width: calc(100% - 2 * var(--grid-pad));
  height: calc(100% - 2 * var(--grid-pad));
  pointer-events: none;
  overflow: visible;
}
.tt-arrows path {
  fill: none;
  stroke-linecap: round;
  vector-effect: non-scaling-stroke;
  stroke-width: var(--arrow-w);
}
.tt-arrows .halo {
  stroke: var(--bg);
  stroke-width: calc(var(--arrow-w) + 3px);
}
.tt-arrows .on {
  stroke: var(--gold);
}
.tt-arrows .off {
  stroke: var(--line);
}


.tt-wrap {
  position: relative;
  display: block;
  width: var(--cell);
  height: var(--cell);
}
.tt-cell {
  all: unset;
  box-sizing: border-box;
  position: relative;
  display: block;
  width: var(--cell);
  height: var(--cell);
  border-radius: var(--cell-radius);
  cursor: pointer;
  background: var(--bg);
}
.tt-cell > img,
.tt-cell > .tt-ic {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: var(--cell-radius);
  border: 0;
}
.tt-ic {
  background: var(--raised);
}
.tt-cell::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--cell-radius);
  box-shadow: inset 0 0 0 var(--ring-w) var(--ring, var(--line));
  pointer-events: none;
}
.tt-rk {
  position: absolute;
  right: var(--rk-off);
  bottom: var(--rk-off);
  z-index: 1;
  padding: 0 var(--rk-pad);
  border-radius: 999px;
  border: 1px solid var(--ring, var(--line));
  background: var(--bg);
  font: 700 var(--rk-font) / var(--rk-line) var(--font-body);
  font-variant-numeric: tabular-nums;
  color: var(--rk, var(--muted));
  white-space: nowrap;
  pointer-events: none;
}
.tt-cell.avail {
  --ring: #4fae5c;
  --rk: var(--kill);
}
.tt-cell.part {
  --ring: var(--kill);
  --rk: var(--kill);
}
.tt-cell.max {
  --ring: var(--gold);
  --rk: var(--gold);
}
.tt-cell.lock {
  cursor: default;
}
.tt-cell.lock > img,
.tt-cell.lock > .tt-ic {
  filter: grayscale(1) brightness(0.55);
}

.tt-cell.lock[data-rank='0'] .tt-rk {
  display: none;
}
.tt-cell.diff::before {
  content: '';
  position: absolute;
  left: -4px;
  top: -4px;
  z-index: 1;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 0 2px var(--bg);
}
.tt-cell:not(.lock):hover > img {
  filter: brightness(1.15);
}
.tt-cell:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}
.tt-wrap .tt-cell:active {
  transform: translateY(1px);
}
.tt-cell.plan .tt-rk {
  opacity: 0.6;
  border-style: dashed;
}
