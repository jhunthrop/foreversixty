openapi: 3.1.0
info:
  title: Forever Sixty API
  version: 0.1.0
servers:
  - url: https://api.foreversixty.gg
components:
  schemas:
    Envelope:
      type: object
      description: >-
        Every successful (2xx) GET response carries ETag: W/"<16 hex chars of sha256(data)>".
        A request with a matching If-None-Match (weak or strong, comma-separated) gets 304 Not
        Modified with an empty body and the same ETag and Cache-Control headers the 200 would
        have carried. POST, PATCH, and DELETE responses never carry an ETag.
      required: [ok, data, error, request_id]
      properties:
        ok: { type: boolean }
        data:
          description: any JSON or null
        error:
          oneOf:
            - type: "null"
            - type: object
              properties:
                code: { type: string }
                message: { type: string }
                fields: { type: object, additionalProperties: { type: string } }
        request_id: { type: string }
    AddonInbox:
      type: object
      description: >-
        GET /v1/addon/inbox's data: contract 3 of docs/contracts/addon-v2.md, the body
        docs/contracts/fixtures/inbox-v2.json pins. `format` is the version the companion writes
        into ForeverSixtyInbox.lua; `builds` is the pre-v2 list, kept for one release beside the
        `build` messages that repeat it.
      required: [format, generated_at, builds, messages]
      properties:
        format: { type: integer, enum: [2] }
        generated_at: { type: string, format: date-time, description: "RFC 3339, UTC" }
        builds:
          type: array
          items:
            type: object
            required: [id, name, code]
            properties:
              id: { type: string }
              name: { type: string }
              character: { type: string, description: "character key region/ruleset/name-slug; absent reaches every character" }
              code: { type: string, description: "the build's FSB1 addon code" }
        messages:
          type: array
          items: { $ref: '#/components/schemas/AddonInboxMessage' }
    AddonInboxMessage:
      description: >-
        One typed message, selected by `type`; a reader skips a type it does not know.
        `character` is the character key region/ruleset/name-slug (the form builds have always
        carried), absent on an upgrade or weights message whose run names none of the account's
        characters. Player-visible strings (name, item_name, source, biggest_loss,
        consumables_missed, raid, guild_name) are plain words; ids are lookup keys only.
      oneOf:
        - type: object
          title: build
          required: [type, name, code]
          properties:
            type: { type: string, enum: [build] }
            character: { type: string }
            name: { type: string }
            code: { type: string }
        - type: object
          title: upgrade
          required: [type, slot, item_id, delta, unit]
          properties:
            type: { type: string, enum: [upgrade] }
            character: { type: string }
            slot: { type: string }
            item_id: { type: integer }
            item_name: { type: string }
            source: { type: string }
            delta: { type: number }
            unit: { type: string, enum: [dps, score], description: "absent means dps" }
        - type: object
          title: weights
          required: [type, spec, weights]
          properties:
            type: { type: string, enum: [weights] }
            character: { type: string }
            spec: { type: string }
            weights:
              type: array
              items:
                type: object
                required: [stat, weight]
                properties: { stat: { type: string }, weight: { type: number } }
            caps: { type: array, items: { type: string } }
            dps_per_point:
              type: number
              description: >-
                DPS (healing per second for a healer) per point of the stat whose weight is 1,
                from the data build's dps-per-point.json; absent for a spec it has no entry for,
                or when the run's weight-1 stat is not that file's reference stat
            generated_at:
              type: string
              format: date-time
              description: >-
                When the run that made these weights was queued (UTC): the character's newest
                finished in-game run, else the account's newest website weights run
            export_seen_at:
              type: string
              format: date-time
              description: >-
                The export the in-game request was made on, the same value the ack carried
                for it; absent for a website run and for an in-game request with no export recorded
        - type: object
          title: sim_result
          required: [type, character, spec, dps, error, generated_at, slots]
          properties:
            type: { type: string, enum: [sim_result] }
            character: { type: string }
            spec: { type: string }
            dps:
              type: number
              description: >-
                the run's DPS; for the weights run an in-game request queues, the DPS of the
                sweep's baseline sim (the character as it is), over the baseline's own iterations
            error:
              type: number
              description: "always present, 0 included; for a weights run, the baseline sim's"
            generated_at: { type: string, format: date-time }
            slots:
              type: array
              description: "per-slot DPS deltas from a Top Gear run; an empty list for a run with no bulk section, such as the weights run an in-game request queues"
              items:
                type: object
                required: [slot, item_id, delta]
                properties: { slot: { type: string }, item_id: { type: integer }, delta: { type: number } }
        - type: object
          title: last_raid
          required: [type, character, report_id, date, bosses]
          properties:
            type: { type: string, enum: [last_raid] }
            character: { type: string }
            report_id: { type: string }
            date: { type: string, format: date }
            bosses:
              type: array
              items:
                type: object
                required: [name, percentile, loss_seconds, deaths, consumables_missed]
                properties:
                  name: { type: string }
                  percentile: { type: integer, minimum: 0, maximum: 100 }
                  biggest_loss:
                    type: string
                    description: >-
                      downtime | dead early | died to <cause> | a death | standing in fire |
                      missing consumables | missed mechanics | low output | utility; absent when
                      nothing cost a point
                  loss_seconds: { type: integer }
                  deaths: { type: integer }
                  consumables_missed: { type: array, items: { type: string, enum: [flask, food] } }
                  adherence: { type: number, minimum: 0, maximum: 1, description: "share of the player's ability casts that the spec's shipped rotation lists for the character's level band, to two decimals; absent without a shipped rotation, under 10 ability casts, when the level could not be read, or for a fight rated before migration 0037" }
        - type: object
          title: loot_values
          required: [type, character, raid, items]
          properties:
            type: { type: string, enum: [loot_values] }
            character: { type: string }
            raid: { type: string }
            items:
              type: object
              description: keyed by item id
              additionalProperties:
                type: object
                required: [value, unit, planned]
                properties:
                  value: { type: number }
                  unit: { type: string, enum: [dps, score] }
                  planned: { type: boolean }
        - type: object
          title: guild
          required: [type, character, guild_name]
          properties:
            type: { type: string, enum: [guild] }
            character: { type: string }
            guild_name: { type: string }
            claim_state: { type: string }
            pending_approvals: { type: integer }
            rank: { type: string }
        - type: object
          title: ack
          required: [type, character, export_seen_at]
          properties:
            type: { type: string, enum: [ack] }
            character: { type: string }
            export_seen_at:
              type: string
              format: date-time
              description: >-
                When the site last received an upload for the character, whether or not the export
                changed
            export_changed_at:
              type: string
              format: date-time
              description: When the export text last changed; never later than export_seen_at
            sim_request_state:
              type: string
              enum: [queued, needs_premium, duplicate, invalid, done, failed]
              description: >-
                what became of the character's newest in-game sim request; "duplicate" when
                another request started a run within the hour (a run that failed does not count),
                "done" and "failed" read from its run once it ends
            requested_at:
              type: string
              format: date-time
              description: >-
                When the site received the character's newest in-game sim request (UTC), not the
                player's own wall time; absent when it never asked
    BuildInput:
      type: object
      required: [class_id, race_id, tree_version, point_order]
      properties:
        class_id: { type: integer, description: "Class id present in classes.json for tree_version" }
        race_id: { type: integer, description: "Race id present in races.json for tree_version" }
        tree_version: { type: string, example: "1.15.9.69722", description: "Client build id the API has data for" }
        point_order:
          type: array
          maxItems: 51
          items: { type: integer }
          description: "Talent id per point spent, in the order the points were spent"
        gear:
          type: object
          additionalProperties: { type: integer }
          description: "Item id per planner slot: head neck shoulder back chest wrist hands waist legs feet finger1 finger2 trinket1 trinket2 main_hand off_hand ranged"
        title: { type: string, maxLength: 60 }
    Build:
      type: object
      required: [id, class_id, race_id, tree_version, point_order, gear, created_at, views]
      properties:
        id: { type: string, minLength: 8, maxLength: 8, example: "k7x2qm4a" }
        class_id: { type: integer }
        race_id: { type: integer }
        tree_version: { type: string }
        point_order: { type: array, items: { type: integer } }
        gear: { type: object, additionalProperties: { type: integer } }
        title: { type: string }
        created_at: { type: string, format: date-time }
        views: { type: integer, format: int64 }
    MetricsRow:
      type: object
      description: "One player's numbers for one boss fight; the companion posts these and the API recomputes them from the events"
      required: [player_guid, name, role, metric_dps, metric_hps, damage_taken, active_ms, deaths,
                 encounter_id, difficulty, size, duration_ms, kill]
      properties:
        player_guid: { type: string }
        name: { type: string }
        class: { type: string }
        spec: { type: string }
        role: { type: string, enum: [dps, healer, tank] }
        ilvl: { type: integer }
        metric_dps: { type: number }
        metric_hps: { type: number }
        damage_taken: { type: integer, format: int64 }
        active_ms: { type: integer, format: int64 }
        deaths: { type: integer }
        encounter_id: { type: integer, format: int64 }
        difficulty: { type: integer }
        size: { type: integer }
        duration_ms: { type: integer, format: int64 }
        kill: { type: boolean }
    Report:
      type: object
      required: [id, title, visibility, status, fights, players, created_at, data_base_url]
      properties:
        id: { type: string, minLength: 12, maxLength: 12 }
        title: { type: string }
        visibility: { type: string, enum: [public, unlisted, private, guild] }
        owner:
          title: ReportOwner
          type: object
          properties:
            id: { type: integer, format: int64 }
            battletag:
              type: string
              description: >-
                The owner's battletag, or "user-<id>" when they have none or have set
                anonymize. Never an email address: this body is public for a public or
                unlisted report.
        guild:
          title: ReportGuild
          type: object
          properties:
            id: { type: integer, format: int64 }
            name: { type: string }
            region: { type: string }
            ruleset: { type: string, enum: [normal, pvp, rp, hardcore] }
        zone: { type: string }
        status: { type: string, enum: [live, processing, complete, failed] }
        engine_version: { type: string }
        flagged: { type: string, description: "metrics_mismatch or tampered when the report is under suspicion" }
        fights:
          type: array
          items: { $ref: '#/components/schemas/FightEntry' }
        players: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        last_upload_at:
          type: [string, "null"]
          format: date-time
          description: >-
            The newest of the report's fight uploads and its creation. A fight sent again counts.
            The waiting screen of a live report reads it.
        heartbeat_at:
          type: [string, "null"]
          format: date-time
          description: >-
            When the companion last called POST /v1/reports/{id}/heartbeat; null before the first.
        logging_character:
          title: ReportLoggingCharacter
          type: [object, "null"]
          description: >-
            The character whose client wrote the log; null when the report names none. name is
            the characters table's when the key resolves, else the key's last segment
            title-cased.
          required: [key, name]
          properties:
            key: { type: string, description: "region/ruleset/slug, e.g. us/pvp/bow-jackzon" }
            name: { type: string }
        data_base_url:
          type: string
          description: >-
            Where the island reads report.json and the per-fight files. Public and unlisted reports
            are served off the bucket by the site Worker; everything else points at
            /v1/reports/{id}/files, which redirects each object to a signed URL valid ten minutes.
    FightEntry:
      type: object
      description: "The engine's store.FightEntry plus whether the ingest verified the fight"
      required: [index, kind, name, kill, duration_ms, players, verified]
      properties:
        index: { type: integer }
        kind: { type: string, enum: [encounter, trash] }
        name: { type: string }
        encounter_id: { type: integer, format: int64 }
        difficulty: { type: integer }
        size: { type: integer }
        kill: { type: boolean }
        in_progress: { type: boolean }
        zone: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        duration_ms: { type: integer, format: int64 }
        players: { type: array, items: { type: string } }
        deaths: { type: integer, description: "Every player death in range" }
        mob_deaths: { type: integer, description: "Hostile NPCs that died in range, each once. Absent on a fight indexed before engine 0.6.0: show no kill count then" }
        group_kills: { type: integer, description: "How many of mob_deaths the logger's group killed. Absent before engine 0.6.0" }
        group_deaths: { type: integer, description: "Player deaths among the group. Absent before engine 0.6.0" }
        group: { type: array, items: { type: string }, description: "Player GUIDs flagged MINE, PARTY or RAID during this fight. Absent before engine 0.6.0 or when nobody was" }
        verified: { type: boolean }
    RankingRow:
      type: object
      required: [rank, player, value, size, fought_at, duration_ms, report_id, fight_index, state]
      properties:
        rank: { type: integer }
        player:
          type: object
          properties:
            key: { type: string, description: "<region>/<ruleset>/<name-slug>" }
            name: { type: string }
            class: { type: string }
            spec: { type: string }
        guild:
          type: object
          properties:
            name: { type: string }
            region: { type: string }
            ruleset: { type: string }
        value: { type: number }
        ilvl: { type: integer }
        size: { type: integer }
        fought_at: { type: string, format: date-time }
        duration_ms: { type: integer }
        talent_split: { type: string, example: "31/20/0" }
        trinkets: { type: array, items: { type: integer } }
        buff_count: { type: integer }
        report_id: { type: string }
        fight_index: { type: integer }
        state: { type: string, enum: [ok, at_risk, removed] }
        execution_score: { $ref: '#/components/schemas/ExecutionScore' }
    GearSlotName:
      type: string
      enum: [head, neck, shoulder, back, chest, wrist, hands, waist, legs, feet,
             finger1, finger2, trinket1, trinket2, main_hand, off_hand, ranged]
      description: >-
        The planner's slot vocabulary, in the order the engine's positional
        equipment array is built.
    GearSlot:
      type: object
      description: One equipped item.
      required: [slot, item_id]
      properties:
        slot: { $ref: '#/components/schemas/GearSlotName' }
        item_id: { type: integer }
        enchant: { type: integer }
        suffix: { type: integer }
    Candidate:
      type: object
      description: One item the planner may substitute in.
      required: [item_id, origin]
      properties:
        slot:
          description: >-
            The planner slot, or "" for "wherever it fits", which is how a
            ring, a trinket or a one-hander is offered. A slot named in
            bulk.locked cannot also carry a candidate.
          oneOf:
            - { type: string, const: "" }
            - $ref: '#/components/schemas/GearSlotName'
        item_id: { type: integer }
        enchant:
          type: integer
          description: >-
            0 inherits the equipped item's enchant for the slot it lands in,
            where that enchant fits; it does not mean "none".
        suffix: { type: integer }
        origin:
          type: string
          description: >-
            Where the candidate came from: equipped, bag, bank, search,
            "drop:<source id>" or "set:<name>". A prefixed origin must name
            something after the colon, and every candidate of a drops request
            must carry a "drop:" origin.
          examples: [equipped, "drop:lucifron"]
        source_name:
          type: string
          description: >-
            The human name of the place the candidate came from - "Lucifron",
            "my AQ set". It travels into the result's substitution and into
            the row's headline, so nothing downstream has to join an origin id
            back to a name.
    TalentLoadout:
      type: object
      description: One named build to try.
      required: [name, talents]
      properties:
        name: { type: string }
        talents: { type: string, description: The engine's own positional talent string. }
    GearSet:
      type: object
      description: >-
        A whole-gear alternative: one candidate that replaces every slot at
        once.
      required: [name, gear]
      properties:
        name: { type: string }
        gear: { type: array, items: { $ref: '#/components/schemas/GearSlot' } }
    BulkSpec:
      type: object
      description: >-
        What turns one character into many sims. Top Gear, talent compare and
        Droptimizer ask the same question - a base character, a set of
        substitutions, a ranked answer - so they are one request shape with one
        planner behind it; mode says which of the three asked, and it is also
        the request's kind.
      required: [mode, precision]
      properties:
        mode: { type: string, enum: [gear, talents, drops] }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/Candidate' }
          description: >-
            A drops request needs at least one and a talents request carries
            none; a gear request needs at least one candidate, talent loadout,
            set or consumable list between them.
        talents:
          type: array
          items: { $ref: '#/components/schemas/TalentLoadout' }
          description: >-
            A talents request needs at least one, and carries no candidates and
            no consumable lists: everything but the talents is locked.
        sets:
          type: array
          items: { $ref: '#/components/schemas/GearSet' }
          description: Gear mode only; a set on any other mode is refused.
        consumables:
          type: array
          items: { type: array, items: { type: string } }
          description: >-
            Alternative consumable lists tried as candidates in gear mode: each
            inner list REPLACES character.consumes for that combination, so
            "flask or elixirs" is a dimension of the product rather than a
            thing the player has to run twice. An empty inner list is legal and
            means "no consumables". Gear mode only.
        locked:
          type: array
          items: { $ref: '#/components/schemas/GearSlotName' }
          description: >-
            Slots that are never substituted, whatever the candidate list says.
            It is the page's "keep what I have here".
        precision:
          type: string
          enum: [fast, normal, high]
          description: >-
            How many stages the planner runs and how many iterations the last
            one gets. iterations must be that last stage's count: 3000 for fast
            and for normal, 10000 for high.
        cap:
          type: integer
          description: >-
            The lane's combination cap, echoed into the request so a saved row
            says what bounded it. POST /v1/sims/run sets it itself - it is the
            server's to set, not a control the client holds - and refuses an
            expansion above it with cap_exceeded rather than silently trimming.
            A result saved through POST /v1/sims must carry the cap its own
            lane ran under.
    DiscordBlock:
      type: object
      description: The saved Discord channel. Never carries the URL, token or webhook id.
      properties:
        channel_id: { type: string }
        name:
          type: [string, "null"]
          description: The webhook's own name at Discord, trimmed and at most 80 characters; null when Discord gave none.
        events:
          title: DiscordEvents
          type: object
          properties:
            sim_finished: { type: boolean }
            upload_parsed: { type: boolean }
            upload_private:
              type: boolean
              description: A private report posts only when this and upload_parsed are both on.
        disabled_reason:
          type: [string, "null"]
          enum: [failed five times, plan lapsed]
        last_error: { type: [string, "null"] }
        failures: { type: integer }
        source:
          type: string
          enum: [pasted, connected]
          description: How the webhook got here. A connected webhook has a null name.
        guild_id:
          type: [string, "null"]
          description: The Discord server of the channel; null when Discord did not say.
    WeightsSpec:
      type: object
      description: Asks for stat weights instead of a DPS number.
      required: [stats, reference]
      properties:
        stats:
          type: array
          items: { type: string }
          description: >-
            Engine stat ids: the Stat enum names in lower snake case -
            attack_power, crit, spell_haste. There is no melee_crit or
            spell_crit; the engine carries one hit and one crit. A stat the
            engine does not have is refused rather than weighed as nothing.
        reference:
          type: string
          description: >-
            The stat normalised to exactly 1.0. It is required and must be one
            of stats: a reference that is not among the stats being weighed
            would normalise against a number nobody computed. The per-spec
            default is reference_stat on GET /v1/specs.
    SimRequest:
      type: object
      required: [engine_version, spec, source, character, encounter, iterations]
      properties:
        engine_version:
          type: string
          description: The short sha of the engine build, from sim/enginever.
        spec: { type: string, example: warrior-fury }
        source:
          title: SimRequestSource
          type: object
          properties:
            kind: { type: string, enum: [armory, addon, build, fight, manual] }
            ref: { type: string }
            captured_at: { type: string, format: date-time }
        character:
          title: SimRequestCharacter
          type: object
          required: [race, class, level]
          properties:
            name: { type: string }
            race: { type: string, example: orc }
            class: { type: string, example: warrior, x-name: className }
            level: { type: integer, maximum: 60 }
            talents:
              type: string
              description: The engine's own positional talent string.
            gear:
              type: array
              items: { $ref: '#/components/schemas/GearSlot' }
            buffs: { type: array, items: { type: string } }
            consumes: { type: array, items: { type: string } }
            professions: { type: array, items: { type: string } }
        encounter:
          title: SimRequestEncounter
          type: object
          properties:
            duration_sec: { type: integer, default: 180, minimum: 60, maximum: 480 }
            variation: { type: number, default: 0.2 }
            targets: { type: integer, default: 1, minimum: 1, maximum: 10 }
            execute_ratio: { type: number, default: 0.25 }
            profile: { type: string }
        iterations: { type: integer, enum: [500, 3000, 10000] }
        random_seed: { type: integer, format: int64 }
        bulk:
          $ref: '#/components/schemas/BulkSpec'
          description: >-
            Turns one character into many sims. A request carrying it is a
            gear, talents or drops request, by bulk.mode; one carrying weights
            instead is a weights request; one carrying neither is a plain run.
            A request never names its own kind, and never carries both blocks.
        weights:
          $ref: '#/components/schemas/WeightsSpec'
          description: Asks for stat weights instead of a DPS number.
        role_metrics:
          type: boolean
          description: >-
            Asks a healer or tank spec's plain run for the figure its role is
            ranked on. A healer runs against the curated heal profile's fake
            raid for the profile's fixed fight (duration_sec and variation are
            replaced) and the result carries healing; a tank runs in the
            curated boss fight it always does and the result carries tank. A
            damage spec, a bulk request and a weights request refuse it.
    SimResult:
      type: object
      required: [engine_version, lane, dps, iterations_run]
      properties:
        sim_id: { type: string }
        title: { type: string, description: "The run's saved title; omitted when it has none." }
        engine_version: { type: string }
        request: { $ref: '#/components/schemas/SimRequest' }
        lane: { type: string, enum: [browser, server] }
        dps: { $ref: '#/components/schemas/Estimate' }
        iterations_run: { type: integer }
        duration_ms: { type: integer, format: int64 }
        summary:
          type: object
          description: The logs engine's per-fight summary, so the report components render a sim.
        error: { type: string }
        aborted: { type: boolean, description: "The run was stopped on request rather than failing; iterations_run is whatever completed. Never true on a saved result - POST /v1/sims refuses one." }
        combos:
          type: array
          items: { $ref: '#/components/schemas/Combo' }
          description: The ranked answer to a bulk request, best first.
        equipped:
          $ref: '#/components/schemas/Estimate'
          description: >-
            The base character at the FINAL stage, which is what every combo's
            delta is measured against. Absent, rather than zero, when there is
            no baseline.
        stages:
          type: array
          items: { $ref: '#/components/schemas/Stage' }
          description: >-
            What the planner actually ran, so the page can say "3 stages, 38
            combinations" without recomputing the ladder.
        weights:
          type: array
          items: { $ref: '#/components/schemas/StatWeight' }
          description: The answer to a weights request.
        sample:
          type: array
          items: { $ref: '#/components/schemas/SampleCast' }
          description: >-
            One iteration's casts in order - the median-DPS one. It is a table
            view of the cast log, not a guide.
        healing:
          $ref: '#/components/schemas/HealingResult'
        tank:
          $ref: '#/components/schemas/TankResult'
    HealingResult:
      type: object
      description: >-
        What a healer did against the heal profile's fake raid; present only
        when the request set role_metrics for a healer spec.
      required: [effective_hps, hps, mana_lasts_sec, hpm]
      properties:
        effective_hps:
          $ref: '#/components/schemas/Estimate'
          description: Healing that landed per second, the figure a healer is ranked on.
        hps:
          $ref: '#/components/schemas/Estimate'
          description: Healing per second including the overheal.
        mana_lasts_sec:
          type: number
          description: >-
            When the healer first ran out of mana; past the fight's length
            for a set that never did.
        hpm:
          type: number
          description: Effective healing per point of mana spent.
    TankResult:
      type: object
      description: >-
        What a tank took and made against the curated boss and the score made
        of it (sim/score); present only when the request set role_metrics for
        a tank spec.
      required: [dtps, tps, tmi, health, effective_health, chance_of_death, score]
      properties:
        dtps: { $ref: '#/components/schemas/Estimate' }
        tps: { $ref: '#/components/schemas/Estimate' }
        tmi: { $ref: '#/components/schemas/Estimate' }
        health: { type: number, description: The character's maximum health. }
        effective_health:
          type: number
          description: >-
            The hit points the boss's raw damage would take to kill the tank at
            the damage it actually takes.
        chance_of_death: { type: number }
        score:
          $ref: '#/components/schemas/Estimate'
          description: >-
            The tank score. A bulk-pooled run computes it after pooling the
            three measured terms, because it is nonlinear in them.
    Estimate:
      type: object
      description: A measured number and its spread.
      properties:
        mean: { type: number }
        stddev: { type: number }
        error: { type: number }
        min: { type: number }
        max: { type: number }
    Substitution:
      type: object
      description: One change from the base character.
      required: [kind]
      properties:
        kind: { type: string, enum: [item, talents, set, consumes] }
        slot:
          $ref: '#/components/schemas/GearSlotName'
          description: >-
            Where an item landed. A ring or a trinket says which of the two
            slots it took, because that is the answer the player acts on.
        item_id: { type: integer }
        enchant: { type: integer }
        suffix: { type: integer }
        name:
          type: string
          description: >-
            The item's, the loadout's or the set's name. An item's name is
            filled in from the engine's own item database, so a row read back
            years later still says what it was about. For a consumes
            substitution it is the consumable ids joined by ", ", or "no
            consumables" when the alternative list is empty.
        talents: { type: string }
        origin: { type: string, description: Copied from the candidate. }
        source_name:
          type: string
          description: Copied from the candidate; a Droptimizer headline reads it.
        consumes:
          type: array
          items: { type: string }
          description: The alternative consumable list this combination ran.
    Combo:
      type: object
      description: One substitution set's result.
      required: [substitutions, dps, delta, group]
      properties:
        substitutions: { type: array, items: { $ref: '#/components/schemas/Substitution' } }
        dps: { $ref: '#/components/schemas/Estimate' }
        delta:
          $ref: '#/components/schemas/Estimate'
          description: >-
            Against equipped, paired at the same stage, WITH ITS OWN ERROR -
            which is what lets the page say "within error" honestly instead of
            ranking noise.
        group:
          type: integer
          description: >-
            0 for the leader's within-error group, then 1, 2, and so on. Rows
            in one group are the same answer and are ranked the same.
    Stage:
      type: object
      description: One rung of the ladder, as run.
      required: [iterations, combos]
      properties:
        iterations: { type: integer }
        combos: { type: integer }
    StatWeight:
      type: object
      description: One stat's answer. The reference stat's weight is exactly 1.
      required: [stat, weight, error]
      properties:
        stat: { type: string }
        weight: { type: number }
        error: { type: number }
    SampleCast:
      type: object
      description: One cast of the sample iteration.
      required: [at_ms, action]
      properties:
        at_ms:
          type: integer
          format: int64
          description: >-
            Negative during the pre-pull, which the page renders as its own
            section.
        action:
          type: string
          description: >-
            The summary's action key - "spell:23881", "item:13503",
            "other:attack" - and not a display name; it is resolved to a name
            the same way a cast row is.
        target: { type: string }
        resources:
          type: object
          additionalProperties: { type: integer }
          description: >-
            What the player held AFTER the cast: rage, energy, mana,
            combo_points.
    SimRow:
      type: object
      properties:
        sim_id: { type: string }
        spec: { type: string }
        kind: { type: string, enum: [run, gear, talents, drops, weights] }
        dps: { type: number }
        headline:
          type: string
          maxLength: 120
          description: >-
            The one line the history list shows, composed when the result
            was written: "1,204 DPS", "+41 DPS from Vis'kag the
            Bloodletter", "3 upgrades on Ragnaros", "+18 DPS with 'Deep
            Fury'", "Crit 1.00 · Agility 0.87".
        state:
          type: string
          enum: [queued, running, done, error]
          description: >-
            The row's own state. A failed run has no headline to show, and
            without this the page could not tell that from a row whose headline
            is simply missing.
        engine_version: { type: string }
        created_at: { type: string, format: date-time }
        title: { type: string }
        lane: { type: string, enum: [server, browser], description: Where the run happened. }
        finished_at:
          type: string
          format: date-time
          description: When a server run reached done or error. Absent while it is queued or running, and for a browser save.
        failure_reason: { type: string, description: The plain sentence a failed run stopped with. Absent unless state is error. }
        seen: { type: boolean, description: Whether the owner has looked at the finished result. }
        estimate_seconds:
          type: integer
          description: >-
            How long a run of this spec usually takes: the median of the last
            ten finished server runs. Only on queued and running rows, and
            absent with fewer than three finished runs.
    SpecFidelity:
      type: object
      properties:
        spec: { type: string }
        reference_stat:
          type: string
          description: >-
            The stat the weights tool normalises to 1.0 for this spec, in
            the engine's own vocabulary (crit, attack_power, …). There is no
            melee_crit or spell_crit: the engine carries one hit and one
            crit.
        state: { type: string, enum: [validated, in_progress, unsupported] }
        median_gap: { type: [number, "null"] }
        parses: { type: integer }
        worst_actions:
          type: array
          items:
            type: object
            properties:
              spell_id:
                type: integer
                format: int64
                description: >-
                  The summary's row identity: the client spell id for a plain
                  spell, a reserved id above 2,000,000 for a tagged, item or
                  other action.
              name: { type: string }
              sim_casts: { type: number }
              actual_casts: { type: number }
        engine_version: { type: string }
        updated_at:
          type: [string, "null"]
          format: date-time
          description: Null until the nightly job has measured this spec.
    CharacterIdentity:
      type: object
      description: >-
        Who the character is in game: the fields GET /v1/characters/{region}/{ruleset}/{name}
        adds to its character object. Each is always present and null when no source knows it.
        Never an id.
      required: [guild, level, race, realm]
      properties:
        guild:
          type: [object, "null"]
          description: >-
            The character's verified guild membership (a guild_characters row with verified_at
            set). Null when it has none, or its membership is not verified yet.
          required: [name, rank]
          properties:
            name: { type: string }
            rank: { type: string, enum: [member, officer, leader] }
        level:
          type: [integer, "null"]
          description: >-
            From the newest of the stored addon export (its level= section, dated by when it was
            captured in game) and the Battle.net import (dated by when it ran). When the newer
            source does not carry a level, the older one's stands; on a tie the Battle.net import
            wins, as does a stored level with no import date. Null when neither has one.
        race:
          type: [string, "null"]
          description: >-
            The race's display name ("Night Elf"), chosen like level: the newest of the addon
            export (its race slug, named by the build data) and the Battle.net import. Null when
            neither has one.
        realm:
          type: [string, "null"]
          description: >-
            The realm as the client names it, from the first source that has one: the Battle.net
            import's realm name, else the addon export's who= realm, else the realm half of the
            newest rated fight's logged unit (which the combat log writes without spaces, e.g.
            "ClassicBetaPvP"). The nightly data addon keys characters by the same order. Null
            when no source has one.
    ScorePoint:
      type: object
      description: >-
        One UTC date of score_history on GET /v1/characters/{region}/{ruleset}/{name}: the
        Forever Score the rater recorded on the last rated fight of that date. The list has one
        point per date on which a rated fight in a public, unflagged report landed, the newest 30 dates,
        oldest first; [] when there is none. Fights rated before the score's snapshot existed
        (migration 0035), or re-rated by the backfill, carry no snapshot and are left out.
      required: [date, score, tier]
      properties:
        date: { type: string, format: date, description: "The UTC date, YYYY-MM-DD." }
        score: { type: integer }
        tier: { type: string, enum: [common, uncommon, rare, epic, legendary] }
    CharacterGear:
      type: object
      description: >-
        The gear panel fields of GET /v1/characters/{region}/{ruleset}/{name}, beside the
        Forever Score. The spec is the newest rated fight's in a public report, else the one the
        export's talents name (gear_spec, gear_spec_source); the level is the export's level=
        section (60 when it has none), and the band that level falls in (the highest of 20, 30,
        40, 50 and 60 at or below it that the spec has a best-in-slot set for).
      required: [gear, gear_gap_total, gear_spec, gear_spec_source]
      properties:
        gear:
          type: array
          items: { $ref: '#/components/schemas/CharacterGearSlot' }
          description: >-
            One row per slot an addon export names, always all 17 in the export's order (head,
            neck, shoulder, back, chest, wrist, hands, waist, legs, feet, finger1, finger2,
            trinket1, trinket2, main_hand, off_hand, ranged) when the character has an export;
            [] when it has none (never null).
        gear_spec:
          type: [string, "null"]
          description: >-
            The spec the gear picks are for, the site's slug ("warrior-fury"): the spec of the
            newest rated fight, else the one the export's talents name, else (no points spent) the
            class's first spec. Null when the character has no export or the data knows no spec.
        gear_spec_source:
          type: [string, "null"]
          enum: [fight, talents, default]
          description: Where gear_spec came from; null exactly when gear_spec is.
        gear_gap_total:
          type: [number, "null"]
          description: >-
            The score points the band's picks would add over what the character wears, summed
            over the slots: the plain sum of every non-null gap, one decimal. It is not the Gear
            component's distance to its top, which is measured against the best set of the band
            across presets and factions (so a character wearing every pick can have a total of 0
            and a Gear component still below 500). Null when no slot has a gap (no export, or
            nothing could be scored).
    CharacterGearSlot:
      type: object
      description: >-
        One slot of the gear panel. Nothing is invented: a pick the data does not have is null,
        and a gap that cannot be scored is null.
      required: [slot, worn, pick, gap]
      properties:
        slot: { $ref: '#/components/schemas/GearSlotName' }
        worn:
          title: CharacterGearSlotWorn
          type: [object, "null"]
          description: >-
            The item the character wears in the slot, from its newest addon export. Null when
            the slot is empty in the export.
          required: [id, name, item_level]
          properties:
            id: { type: integer }
            name: { type: [string, "null"], description: "Null when the export's data build does not have the item." }
            item_level: { type: [integer, "null"], description: "Null when the export's data build does not have the item." }
        pick:
          title: CharacterGearSlotPick
          type: [object, "null"]
          description: >-
            The band's best-in-slot pick for the spec and the character's faction (from the
            export's race, else the faction the Battle.net import stored), as the Forever Sixty
            Data addon ships it: the leveling-bis ladder's pick for the band without raid buffs,
            except that an item whose stats the client has not confirmed is never a pick. Every
            slot whose own pick is confirmed keeps it; each other slot takes the next confirmed
            candidate in the ladder's order that the band's rules allow beside them: the two
            slots of a pair (the rings, the trinkets, the two hands) never hold the same item
            (the same id or the same name), and there is no off-hand pick beside a two-handed
            main-hand pick. Null when the band has no pick for the slot, the character has no
            rated spec or is below level 20, or its faction or the spec's best-in-slot data is
            unknown.
          required: [id, name, source, chance]
          properties:
            id: { type: integer }
            name: { type: string }
            source:
              type: string
              description: >-
                Where the item comes from, as a player knows it: "Wailing Caverns: Mutanus the
                Devourer", "Blacksmithing", "The League of Arathor".
            chance:
              type: [number, "null"]
              description: >-
                The drop chance as a fraction (0.333333 is one in three), at the pick's own
                source; a pick promoted past an item the client has not confirmed carries the
                chance of its own source. Null when the source states no rate (every
                quest, vendor, crafted, reputation and PvP source, and a drop whose loot table
                gives none).
        gap:
          type: [number, "null"]
          description: >-
            The Gear component points the pick would add over the worn item, one decimal: 500 x
            (the pick's gear score - the worn item's gear score) / the band's best set's gear
            score, each item scored by the spec's stat weights as the Gear component scores it.
            An empty slot scores 0. 0 when the worn item is the pick or scores at least as much;
            an upgrade worth under 0.05 points also rounds to 0. The rings and the trinkets are
            matched to their picks whichever way round gives the smaller total, so a pick worn
            in the other slot of its pair reads 0. When the picked or the worn main hand is
            two-handed, the two hands count as one unit: the main hand's gap is the picked main
            and off hands' score less the worn main and off hands' score (0 at least), and the
            off hand's gap is 0, or null when the band has no off-hand pick. Null when there is
            no pick, when an item is not in the data build, or when the band's best set cannot
            be scored.
    ExecutionScore:
      type: [number, "null"]
      description: >-
        execution_score on ranking rows, on a character's best and history rows, and on the
        guild page's roster_best rows (GET /v1/guilds/{region}/{ruleset}/{name}): the
        fight's damage as a share of what the same gear and talents do in the simulator over
        the same fight length (1 is the simulator's average; a lucky pull can pass it, and the
        stored value is kept between 0 and 2). Damage only. Null while the fight has not been
        simulated yet (the score is written after the fight closes, or by the nightly job), and
        null for good for healers and tanks, for a spec the simulator has not validated, for a
        fight whose summary has no row for the player, for a fight whose character the
        simulator could not rebuild from the log, and when the simulation produced no damage.
    GuildAttendance:
      type: object
      description: >-
        A guild roster row's attendance (roster[].attendance and pending[].attendance on GET
        /v1/guilds/{id}/home, candidates[].attendance on GET /v1/guilds/{id}/loot). A character
        was present in a report when it has a ranked or rated row there (fight_metrics not
        removed, or rating_scores), read by its character key, never by the log's GUIDs
        (fights.players). The window is the guild's last 8 non-private, unflagged reports that
        carry at least one ranked or rated row, so a night nobody can be present in (a
        private, tampered, unverified or trash-only report, or one not ranked yet) is never
        everyone's absence.
      properties:
        present: { type: integer, description: "How many of the window's reports the character was present in, 0 to nights; a report with several of its fights counts once." }
        nights: { type: integer, description: "How many reports the window holds: 8, or fewer while the guild has logged fewer such reports. The same for every row of the roster." }
    GuildRosterAddon:
      type: [object, "null"]
      description: >-
        A guild roster row's line from the guild's newest addon roster snapshot (roster[].addon
        and pending[].addon on GET /v1/guilds/{id}/home; the snapshot is the outbox's
        roster_snapshot of POST /v1/addon/exports, docs/contracts/addon-v2.md contract 4).
        Always present, null when the guild has no snapshot or the newest one does not carry
        the character. A snapshot line is matched to a row by character name, any case: the
        snapshot's names carry no realm (a Name-Realm line drops its realm half), so the
        guild's realm is the row's; the first line of a name wins. level, spec, gear_gap and build
        are null unless the row's member gave gear consent (the home withholds spec and gear for
        a roster-consent member); seen_at and snapshot_at stay.
      required: [level, spec, gear_gap, build, seen_at, snapshot_at]
      properties:
        level: { type: [integer, "null"], description: "The level the member's addon announced; null without gear consent" }
        spec: { type: [string, "null"], description: "A spec slug, e.g. warrior-arms; null without gear consent" }
        gear_gap: { type: [integer, "null"], description: "The gear gap the member's addon announced (contract 2's hello); may be negative; null without gear consent" }
        build: { type: [string, "null"], description: "The build name the member's addon announced; null when it announced none or without gear consent" }
        seen_at: { type: string, description: "The sender's local time, YYYY-MM-DD HH:MM, as stored" }
        snapshot_at: { type: string, format: date-time, description: "When the site received the snapshot (addon_snapshot.received_at), RFC 3339 UTC" }
    GuildAddonSnapshot:
      type: [object, "null"]
      description: >-
        addon_snapshot on GET /v1/guilds/{id}/home: the guild's newest addon roster snapshot,
        null when it has none. The newest snapshot wins even when it lists nobody (members is
        then 0 and every roster[].addon is null).
      required: [received_at, by_character, members]
      properties:
        received_at: { type: string, format: date-time, description: "When the site received the snapshot, RFC 3339 UTC" }
        by_character: { type: string, description: "The character key whose export carried the snapshot" }
        members: { type: integer, description: "How many member lines the snapshot listed, those matching no roster row included (they never become rows)" }
    ForeverScore:
      type: object
      description: >-
        The Forever Score fields of GET /v1/characters/{region}/{ruleset}/{name}. Every field
        is null when the character has no rated fight in a public, unflagged report (an
        anonymised character's page answers 404). The components sum to score; the ceilings
        are gear 500, experience 700, parses 600, attendance 200, discipline 100
        (api/internal/rating/score_v2.go). A report flagged as tampered or unverified counts
        for nothing: no component, as_of or experience figure reads it, so a forged report
        cannot raise a score.
      properties:
        score: { type: [integer, "null"] }
        tier:
          type: [string, "null"]
          enum: [common, uncommon, rare, epic, legendary, null]
          description: "common < 500, uncommon < 1000, rare < 1500, epic < 2000, legendary from 2000 (provisional)."
        as_of:
          type: [string, "null"]
          format: date
          description: The newest rated fight's date (YYYY-MM-DD).
        components:
          type: [object, "null"]
          properties:
            gear: { type: integer, description: "The gear component in points, 0-500, comparable across specs: the character's gear score for its spec as a share of that spec's own best-in-slot set for your level (the highest best-in-slot band at or below the character's level, 20 to 60; below 20 there is none and the component is 0) in the same data build. This is contract 5's gear_score." }
            experience: { type: integer, description: "25 a distinct dungeon cleared + 40 a distinct raid boss killed across linked characters, capped at 700." }
            parses: { type: integer, description: "Mean best parse percentile per boss, scaled 0-600." }
            attendance: { type: integer, description: "The attendance component in points, 0-200: the fraction of the verified guild's nights (UTC dates of its fights) in the last 90 days attended, times 200. Contract 5's attendance is that fraction itself, 0-1." }
            discipline: { type: integer, description: "Share of rated fights with a flask, a food and every enchantable slot (chest, feet, back, main hand) enchanted, times 100." }
        experience:
          type: [object, "null"]
          properties:
            dungeons: { type: integer, description: "Distinct dungeon instances cleared; 0 until dungeon logs are classified." }
            raid_kills: { type: integer, description: Distinct raid bosses killed by any linked character. }
            alts: { type: integer, description: Linked characters other than this one. }
    User:
      type: object
      required: [id, role, anonymize, premium]
      properties:
        id: { type: integer, format: int64 }
        battletag: { type: [string, "null"] }
        email: { type: [string, "null"], description: Shown only to the account itself. }
        role: { type: string }
        anonymize: { type: boolean }
        premium:
          type: boolean
          description: >-
            Whether this account may run sims on our servers. Set by hand until
            payments exist; the web reads it to decide whether to offer the
            server lane at all.
    # ---------------------------------------------------------------------------------------
    # Native apps v1 (docs/contracts/app-v1.md). The iOS and Android models are generated from
    # these schemas (web/scripts/gen-mobile-api.mjs); api/internal/contract/openapi_test.go
    # holds every fixture under docs/contracts/fixtures/app to them in strict mode.
    #
    # Conventions the generator reads:
    #   - Every object is a component or carries a `title`, which names its generated type.
    #   - A field is optional in the apps when it is not `required` or its type allows "null".
    #   - `x-name` renames a field whose JSON key is a reserved word in Swift or Kotlin.
    #   - An object with no `properties` and `additionalProperties: true` is open JSON: the
    #     apps get a JSONValue (Swift) or JsonElement (Kotlin) until a lane types it here.
    #   - Strings with an `enum` stay strings in the apps: a client ignores a word it does not
    #     know, so a new value never breaks a decode.
    #   - Operations tagged `app` become Endpoint members, `app-static` StaticResource members,
    #     `app-browser` nothing (the app opens them in the system browser).
    #   - `x-fixtures` on a response lists the fixtures the contract test holds to it; fixture
    #     mode answers the first, or `x-fixture-route` (a `{param}` there fills from the path).
    #   - `x-authenticated: false` sends no device token (sign-in exchange, config).
    # ---------------------------------------------------------------------------------------
    ErrorBody:
      type: object
      description: The envelope's error half (Go httpx.ErrorBody).
      required: [code, message]
      properties:
        code: { type: string, description: "A machine word: unauthorized, session_expired, forbidden, not_found, invalid, ..." }
        message: { type: string, description: "A sentence a person can read; show it as is." }
        fields:
          type: object
          additionalProperties: { type: string }
          description: Each invalid field and a short sentence; only on validation errors.
    ErrorEnvelope:
      type: object
      description: Every failure. data is null and error carries the code.
      required: [ok, data, error, request_id]
      properties:
        ok: { type: boolean, enum: [false] }
        data: { type: "null" }
        error: { $ref: '#/components/schemas/ErrorBody' }
        request_id: { type: string }
    UpdateRequiredError:
      type: object
      description: The 426 answer of the minimum-version gate.
      required: [ok, data, error, request_id]
      properties:
        ok: { type: boolean, enum: [false] }
        data: { type: "null" }
        error:
          type: object
          title: UpdateRequiredBody
          required: [code, message, fields]
          properties:
            code: { type: string, enum: [update_required] }
            message: { type: string }
            fields:
              type: object
              title: UpdateRequiredFields
              required: [store_url, min_version]
              properties:
                store_url: { type: string, format: uri, description: Open it only when it is https; else the app's own store page. }
                min_version: { type: string, description: The lowest x.y.z the API serves to this platform. }
        request_id: { type: string }
    OpenObject:
      type: [object, "null"]
      additionalProperties: true
      description: JSON the v1 apps carry but do not read; the named Go type is its shape.

    # Account ------------------------------------------------------------------------------
    AppUser:
      type: object
      description: The signed-in account (Go auth.User).
      required: [id, battletag, email, role, anonymize]
      properties:
        id: { type: integer, format: int64 }
        battletag: { type: [string, "null"], description: Null for an account signed in by email. }
        email: { type: [string, "null"], description: Shown only to the account itself. }
        role: { type: string }
        anonymize: { type: boolean }
    Me:
      type: object
      description: >-
        GET /v1/me's data (Go auth.Me): who you are, your characters, your guilds and what you
        may use. The apps gate a feature on entitlements only.
      required: [user, characters, guilds, entitlements, finished_sims, discord_link_available, discord_link, discord_link_suggested]
      properties:
        user: { $ref: '#/components/schemas/AppUser' }
        characters: { type: array, items: { $ref: '#/components/schemas/AccountCharacter' } }
        guilds: { type: array, items: { $ref: '#/components/schemas/AccountGuild' } }
        entitlements: { $ref: '#/components/schemas/Entitlements' }
        finished_sims:
          type: array
          description: Unseen finished server runs, newest first, at most three; [] without server_sims.
          items: { $ref: '#/components/schemas/FinishedSim' }
        discord_link_available: { type: boolean }
        discord_link: { oneOf: [{ $ref: '#/components/schemas/DiscordLink' }, { type: "null" }] }
        discord_link_suggested: { type: [string, "null"] }
        main_character_key: { type: string, description: Omitted until the account picks a main. }
        bnet_imported_at: { type: string, format: date-time, description: Omitted when the Battle.net import never ran. }
        server_sims:
          type: object
          title: ServerSimsUsage
          description: Omitted when the server has no sims store configured.
          required: [runs_this_month]
          properties:
            runs_this_month: { type: integer }
        notifications:
          type: object
          title: MeNotifications
          description: Omitted when the deployment has notifications off.
          required: [connect]
          properties:
            connect: { type: boolean, description: True when the one-click Discord connect is configured. }
            discord: { oneOf: [{ $ref: '#/components/schemas/DiscordBlock' }, { type: "null" }] }
        seat: { $ref: '#/components/schemas/MeSeat' }
        seat_offer: { $ref: '#/components/schemas/OpenObject', description: "Go auth.MeSeatOffer; omitted when none." }
        ended_seat: { $ref: '#/components/schemas/OpenObject', description: "Go auth.MeEndedSeat; omitted when none." }
    AccountCharacter:
      type: object
      description: >-
        One character linked to the account (Go auth.Character). key is opaque: build character
        routes from region, ruleset and name. Every field but the first five is omitted when unknown.
      required: [key, region, ruleset, name, source]
      properties:
        key: { type: string }
        region: { type: string, enum: [us, eu, kr, tw, cn] }
        ruleset: { type: string, enum: [normal, pvp, rp, hardcore] }
        name: { type: string }
        source: { type: string, description: "Which path last wrote this character: export (addon or companion) or bnet." }
        class: { type: string, x-name: className, description: The class slug, lowercase. }
        realm: { type: string }
        level: { type: integer }
        faction: { type: string, enum: [alliance, horde] }
        race: { type: string }
        gender: { type: string }
        item_level: { type: integer }
        avatar_url: { type: string, format: uri }
        render_url: { type: string, format: uri, description: Blizzard's render CDN. }
        spec: { type: string, description: The primary talent tree's name. }
        build: { $ref: '#/components/schemas/CharacterBuild' }
        guild: { $ref: '#/components/schemas/CharacterGuild' }
    CharacterBuild:
      type: object
      description: The character's latest simmable build and its sync facts (Go auth.CharacterBuild).
      required: [source, captured_at, median_sync_gap_sec, sync_error]
      properties:
        source: { type: string, enum: [addon, bnet, blizzard] }
        captured_at: { type: string, format: date-time }
        median_sync_gap_sec: { type: [integer, "null"], description: Null with fewer than three syncs on record. }
        sync_error: { type: [string, "null"], description: "The last failed Battle.net refresh's code (bnet_refresh_failed), else null." }
        gear: { type: object, additionalProperties: { type: integer }, description: Slot name to item id; omitted when not decoded. }
        talents: { $ref: '#/components/schemas/BuildTalents' }
        level: { type: integer }
        data_build: { type: string, description: The client build the export was made on. }
    BuildTalents:
      type: object
      description: Per-tree rank strings and point totals, in tree order.
      required: [trees, points]
      properties:
        trees: { type: array, items: { type: string } }
        points: { type: array, items: { type: integer } }
    CharacterGuild:
      type: object
      description: The character's guild membership (Go auth.CharacterGuild).
      required: [id, name, rank, verified]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        rank: { type: string }
        verified: { type: boolean }
        rank_index: { type: integer }
        attendance: { $ref: '#/components/schemas/Attendance' }
    Attendance:
      type: object
      description: Raid nights attended over raid nights counted.
      required: [present, nights]
      properties:
        present: { type: integer }
        nights: { type: integer }
    AccountGuild:
      type: object
      description: >-
        A guild the account belongs to (Go auth.Guild). can lists what you may do there: draw a
        control exactly when its word is present, never from the rank.
      required: [id, region, ruleset, name, verified, verified_count, can, crest_url, faction, roster_count, claim, verify, covered, subscribe]
      properties:
        id: { type: integer, format: int64 }
        region: { type: string }
        ruleset: { type: string }
        name: { type: string }
        verified: { type: boolean }
        verified_count: { type: integer }
        can: { type: array, items: { type: string, enum: [approve, remove, settings, award, billing, release] } }
        crest_url: { type: [string, "null"], format: uri }
        faction: { type: [string, "null"] }
        roster_count: { type: [integer, "null"] }
        claim: { $ref: '#/components/schemas/OpenObject', description: Go auth.GuildClaimView. }
        verify: { $ref: '#/components/schemas/OpenObject', description: Go auth.GuildVerifyView. }
        covered: { $ref: '#/components/schemas/OpenObject', description: Go auth.GuildCoveredView. }
        subscribe: { $ref: '#/components/schemas/OpenObject', description: Go auth.GuildSubscribeView. }
        rank: { type: string }
        consent: { type: string }
        plan: { $ref: '#/components/schemas/GuildPlan' }
        ruleset_label: { type: string }
        slug: { type: string }
    GuildPlan:
      type: object
      description: A guild's billing state, shown only to its verified officers (Go auth.GuildBillingView).
      required: [scope, tier, you_hold_seat, status, current_period_end, cancel_at_period_end, billed_by, you_are_billing_contact]
      properties:
        scope: { type: string, enum: [officer_tools, plan] }
        tier: { type: string }
        you_hold_seat: { type: boolean }
        status: { type: string }
        current_period_end: { type: [string, "null"] }
        cancel_at_period_end: { type: boolean }
        billed_by: { type: string }
        you_are_billing_contact: { type: boolean }
    Entitlements:
      type: object
      description: Every Premium feature pre-resolved for the caller (Go auth.EntitlementsView). A feature is available exactly when its flag is true.
      required: [server_sims, retention, multi_compare, history, notifications, officer_views, roster_check, log_coach, supporter_mark, personal_portal, billing]
      properties:
        server_sims: { type: boolean }
        retention: { type: boolean }
        multi_compare: { type: boolean }
        history: { type: boolean }
        notifications: { type: boolean }
        officer_views: { type: boolean }
        roster_check: { type: boolean }
        log_coach: { type: boolean }
        supporter_mark: { type: boolean }
        personal_portal: { type: boolean }
        billing: { oneOf: [{ $ref: '#/components/schemas/Billing' }, { type: "null" }] }
    Billing:
      type: object
      description: The caller's personal plan (Go auth.BillingView). The apps never show a purchase flow.
      required: [plan, source, status, current_period_end, cancel_at_period_end]
      properties:
        plan: { type: string }
        source: { type: string, enum: [stripe, grant] }
        status: { type: string }
        current_period_end: { type: [string, "null"] }
        cancel_at_period_end: { type: boolean }
        amount_cents: { type: integer, format: int64 }
        interval: { type: string }
        founder: { type: boolean }
    FinishedSim:
      type: object
      required: [sim_id, spec, title, dps, finished_at]
      properties:
        sim_id: { type: string }
        spec: { type: string }
        title: { type: string }
        dps: { type: number }
        finished_at: { type: string, format: date-time }
    DiscordLink:
      type: object
      required: [display_name]
      properties:
        display_name: { type: string }
    MePatch:
      type: object
      description: PATCH /v1/me. At least one field.
      properties:
        anonymize: { type: boolean }
        main_character_key: { type: string, description: One of your own character keys. }

    # Characters ---------------------------------------------------------------------------
    CharacterProfile:
      type: object
      description: >-
        GET /v1/characters/{region}/{ruleset}/{name}: the public character card. Every score
        field is null for a character with no rated fight: render "no logs yet", never 0.
      required: [character, best, history, builds_seen, score_history, gear, gear_gap_total, gear_spec, gear_spec_source, supporter, score, tier, as_of, components, experience]
      properties:
        character:
          type: object
          title: CharacterProfileHeader
          required: [key, region, ruleset, name, guild, level, race, realm]
          properties:
            key: { type: string }
            region: { type: string }
            ruleset: { type: string }
            name: { type: string }
            guild:
              type: [object, "null"]
              title: CharacterProfileGuild
              description: The verified guild membership; null when none.
              required: [name, rank]
              properties:
                name: { type: string }
                rank: { type: string, enum: [member, officer, leader] }
            level: { type: [integer, "null"] }
            race: { type: [string, "null"] }
            realm: { type: [string, "null"] }
            class: { type: string, x-name: className }
            avatar_url: { type: string, format: uri }
            render_url: { type: string, format: uri }
        best: { type: array, items: { $ref: '#/components/schemas/CharacterFight' } }
        history: { type: array, items: { $ref: '#/components/schemas/CharacterFight' } }
        builds_seen:
          type: array
          items:
            type: object
            title: BuildSeen
            required: [talent_split, spec, first_seen]
            properties:
              talent_split: { type: string }
              spec: { type: string }
              first_seen: { type: string, format: date-time }
        score_history: { type: array, items: { $ref: '#/components/schemas/ScorePoint' } }
        gear: { type: array, items: { $ref: '#/components/schemas/CharacterGearSlot' } }
        gear_gap_total: { type: [number, "null"] }
        gear_spec: { type: [string, "null"] }
        gear_spec_source: { type: [string, "null"], enum: [fight, talents, default, null] }
        supporter: { type: boolean }
        score: { type: [integer, "null"] }
        tier: { type: [string, "null"], enum: [common, uncommon, rare, epic, legendary, null] }
        as_of: { type: [string, "null"], format: date }
        components:
          type: [object, "null"]
          title: ScoreComponents
          required: [gear, experience, parses, attendance, discipline]
          properties:
            gear: { type: integer }
            experience: { type: integer }
            parses: { type: integer }
            attendance: { type: integer }
            discipline: { type: integer }
        experience:
          type: [object, "null"]
          title: ScoreExperience
          required: [dungeons, raid_kills, alts]
          properties:
            dungeons: { type: integer }
            raid_kills: { type: integer }
            alts: { type: integer }
    CharacterFight:
      type: object
      description: One rated fight on the character card (best[] and history[]); history[] adds kill, duration_ms, talent_split and execution_score.
      required: [encounter, encounter_id, difficulty, metric, value, fought_at, report_id, fight_index]
      properties:
        encounter: { type: string }
        encounter_id: { type: integer }
        difficulty: { type: integer }
        metric: { type: string }
        value: { type: number }
        percentile: { type: number, description: Omitted when unknown. }
        spec: { type: string, description: Omitted when unknown. }
        fought_at: { type: string, format: date-time }
        report_id: { type: string }
        fight_index: { type: integer }
        kill: { type: boolean }
        talent_split: { type: string }
        duration_ms: { type: integer, format: int64 }
        execution_score: { $ref: '#/components/schemas/ExecutionScore' }
    CharacterSearch:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            type: object
            title: CharacterSearchRow
            required: [key, region, ruleset, name, class, level, spec]
            properties:
              key: { type: string }
              region: { type: string }
              ruleset: { type: string }
              name: { type: string }
              class: { type: [string, "null"], x-name: className }
              level: { type: [integer, "null"] }
              spec: { type: [string, "null"], description: Always null today. }
    SimInput:
      type: object
      description: >-
        The character model a sim starts from. gear is the FS1 export string for an export
        (source addon or blizzard) and { trinkets } for a fight: branch on source, not on the shape.
      required: [spec, spec_source, gear, talents, buffs, captured_at, source]
      properties:
        spec: { type: string }
        spec_source: { type: string, enum: [fight, talents, default, ""] }
        gear:
          oneOf:
            - { type: string }
            - type: object
              title: SimInputFightGear
              required: [trinkets]
              properties:
                trinkets: { type: array, items: { type: integer } }
        talents: { type: string }
        buffs: { type: array, items: { type: string } }
        captured_at: { type: string, format: date-time }
        source: { type: string, enum: [addon, blizzard, fight] }
    CharacterHome:
      type: object
      description: >-
        GET /v1/characters/{region}/{ruleset}/{name}/home (lane A3): the home answer, computed in
        Go by api/internal/upgrades. Show the rows in the server's order; never re-rank them.
        Any state but ok has upgrades and already_best empty and total_gain null.
      required: [character, state, spec, band, band_label, preset, unit, unit_word, data_build, upgrade_count, total_gain, not_sim_checked_count, not_modelled_count, synced_at, synced_from, upgrades, already_best, talents]
      properties:
        character: { type: string, description: The character key. }
        state: { type: string, enum: [ok, no_gear, under_20, no_spec, no_list] }
        spec: { type: [string, "null"] }
        band: { type: [integer, "null"] }
        band_label: { type: [string, "null"] }
        preset: { type: [string, "null"], enum: [raid, bare, null] }
        unit: { type: [string, "null"], enum: [dps, hps, tank_score, null] }
        unit_word: { type: [string, "null"] }
        data_build: { type: string }
        upgrade_count: { type: integer }
        total_gain: { type: [number, "null"] }
        not_sim_checked_count: { type: integer }
        not_modelled_count: { type: integer }
        synced_at: { type: [string, "null"], format: date-time }
        synced_from: { type: [string, "null"], enum: [addon, blizzard, null] }
        upgrades:
          type: array
          items:
            type: object
            title: HomeUpgrade
            required: [slot, slot_label, pick, worn, gain, gain_words, modelled]
            properties:
              slot: { type: string }
              slot_label: { type: string }
              pick:
                type: object
                title: HomePick
                required: [id, name, quality, icon, item_level, source_line]
                properties:
                  id: { type: integer }
                  name: { type: [string, "null"] }
                  quality: { type: [integer, "null"] }
                  icon: { type: [string, "null"] }
                  item_level: { type: [integer, "null"] }
                  source_line:
                    type: string
                    description: >-
                      The site's formatted source (web/src/lib/bis/source-cell.ts
                      describeSourceCell): "Quest: {name} · requires level {n}", "{n}% from {boss}",
                      "Crafted: {profession}", "{instance} · {boss}". Never repeats the item's name.
                  drop_chance:
                    type: [number, "null"]
                    description: Percent (0 to 100) when the source names one; absent or null otherwise.
              worn:
                type: [object, "null"]
                title: HomeWorn
                required: [id, name, quality, icon, item_level, known, label]
                properties:
                  id: { type: integer }
                  name: { type: [string, "null"] }
                  quality: { type: [integer, "null"] }
                  icon: { type: [string, "null"] }
                  item_level: { type: [integer, "null"] }
                  known: { type: boolean }
                  label: { type: string }
              gain: { type: [number, "null"] }
              gain_words: { type: string }
              modelled: { type: boolean }
        already_best:
          type: array
          items:
            type: object
            title: HomeAlreadyBest
            required: [slot, slot_label, item]
            properties:
              slot: { type: string }
              slot_label: { type: string }
              item: { $ref: '#/components/schemas/HomeItem' }
        talents:
          type: object
          title: HomeTalents
          required: [state, points_differ, band_points]
          properties:
            state: { type: string, enum: [optimized, differs, no_export, no_build] }
            points_differ: { type: [integer, "null"] }
            band_points: { type: [integer, "null"] }
    HomeItem:
      type: object
      description: An item read from the build's table; every field but id is null when the table lacks it.
      required: [id, name, quality, icon, item_level]
      properties:
        id: { type: integer }
        name: { type: [string, "null"] }
        quality: { type: [integer, "null"] }
        icon: { type: [string, "null"] }
        item_level: { type: [integer, "null"] }

    # Sims ---------------------------------------------------------------------------------
    SimList:
      type: object
      required: [rows, total, page, per_page]
      properties:
        rows: { type: array, items: { $ref: '#/components/schemas/SimRow' } }
        total: { type: integer }
        page: { type: integer }
        per_page: { type: integer }
    SimProgress:
      type: object
      description: Poll every 2 seconds; stop at done or error.
      required: [state, iterations_done, stage, combos_done, combos_total]
      properties:
        state: { type: string, enum: [queued, running, done, error] }
        iterations_done: { type: integer }
        dps: { type: number, description: Omitted until running or done. }
        stage: { type: integer }
        combos_done: { type: integer }
        combos_total: { type: integer }
    SimStarted:
      type: object
      required: [sim_id]
      properties:
        sim_id: { type: string, description: The new run. }

    # Guilds -------------------------------------------------------------------------------
    GuildHome:
      type: object
      description: GET /v1/guilds/{id}/home. Verified members only.
      required: [guild, viewer, claim, summary, reports, roster, pending, members, counts, addon_snapshot, attendance_source]
      properties:
        guild:
          type: object
          title: GuildHomeGuild
          required: [id, region, ruleset, name, faction, crest_url]
          properties:
            id: { type: integer, format: int64 }
            region: { type: string }
            ruleset: { type: string }
            name: { type: string }
            faction: { type: [string, "null"] }
            crest_url: { type: [string, "null"], format: uri }
        viewer:
          type: object
          title: GuildHomeViewer
          required: [role, verified, officer_tools, raid_guild_tools, verify]
          properties:
            role: { type: string }
            verified: { type: boolean }
            officer_tools: { type: boolean }
            raid_guild_tools: { type: boolean }
            verify:
              type: object
              title: GuildHomeVerify
              required: [has_approver]
              properties:
                has_approver: { type: boolean }
            character_key: { type: string }
        claim:
          type: object
          title: GuildClaimState
          required: [state, frozen]
          properties:
            state: { type: string }
            frozen: { type: boolean }
            since: { type: string, format: date-time }
            claimed_by_name: { type: string }
        summary:
          type: object
          title: GuildSummary
          required: [raiders, waiting_for_approval, below_rating_floor, named_encounters_down, pulls_this_tier, updated_at]
          properties:
            raiders: { type: integer }
            waiting_for_approval: { type: integer }
            below_rating_floor: { type: integer }
            named_encounters_down: { type: integer }
            pulls_this_tier: { type: integer }
            updated_at: { type: string, format: date-time }
        standing:
          type: object
          title: GuildStanding
          description: Omitted when it cannot be derived.
          required: [spec, class, same_spec_count, rank_by_item_level, item_level, needs_before_next_raid]
          properties:
            spec: { type: string }
            class: { type: string, x-name: className }
            same_spec_count: { type: integer }
            rank_by_item_level: { type: integer }
            item_level: { type: integer }
            needs_before_next_raid: { type: array, items: { type: string } }
        reports:
          type: array
          description: The last 7 days.
          items:
            type: object
            title: GuildReportRow
            required: [id, title, zone, created_at, fight_count, kill_count, duration_ms]
            properties:
              id: { type: string }
              title: { type: string }
              zone: { type: string }
              created_at: { type: string, format: date-time }
              fight_count: { type: integer }
              kill_count: { type: integer }
              duration_ms: { type: integer, format: int64 }
        next_cursor: { type: string }
        roster: { type: array, items: { $ref: '#/components/schemas/GuildRosterRow' } }
        pending: { type: array, description: "[] for a non-officer.", items: { $ref: '#/components/schemas/GuildRosterRow' } }
        members:
          type: array
          items:
            type: object
            title: GuildMember
            required: [name, character_key, state, rank]
            properties:
              name: { type: string }
              character_key: { type: string }
              state: { type: string, enum: [approved, waiting, no_account, not_seen] }
              rank: { type: string }
              class: { type: string, x-name: className }
              level: { type: integer }
              spec: { type: string }
              seen_at: { type: string }
        counts:
          type: object
          title: GuildMemberCounts
          required: [on_roster, in_game_no_account, waiting, not_seen]
          properties:
            on_roster: { type: integer }
            in_game_no_account: { type: integer }
            waiting: { type: integer }
            not_seen: { type: integer }
        addon_snapshot: { $ref: '#/components/schemas/GuildAddonSnapshot' }
        next_raid: { $ref: '#/components/schemas/RaidLine' }
        attendance_source: { type: string, enum: [raids, reports] }
    GuildRosterRow:
      type: object
      description: One roster row. Draw Remove and Approve exactly when may_remove and may_approve.
      required: [character_key, region, ruleset, name, rank, verified, consent, logged_at, logged_recently, attendance, account_key, supporter, last_report_at, may_remove, may_approve, addon]
      properties:
        character_key: { type: string }
        region: { type: string }
        ruleset: { type: string }
        name: { type: string }
        rank: { type: string }
        verified: { type: boolean }
        consent: { type: string }
        logged_at: { type: string, format: date-time }
        logged_recently: { type: boolean }
        attendance: { $ref: '#/components/schemas/GuildAttendance' }
        account_key: { type: string }
        supporter: { type: boolean }
        last_report_at: { type: [string, "null"], format: date-time }
        may_remove: { type: boolean }
        may_approve: { type: boolean }
        addon: { $ref: '#/components/schemas/GuildRosterAddon' }
        class: { type: string, x-name: className }
        spec: { type: string }
        role: { type: string }
        item_level: { type: integer, description: Withheld without gear consent. }
        attendance_30: { $ref: '#/components/schemas/GuildAttendance' }
        best_parse:
          type: object
          title: RosterBestParse
          required: [metric, value, percentile, encounter, report_id, fight_index]
          properties:
            metric: { type: string }
            value: { type: number }
            percentile: { type: number }
            encounter: { type: string }
            report_id: { type: string }
            fight_index: { type: integer }
        rating:
          type: object
          title: RosterRating
          required: [overall, output, survival, mechanics, utility, preparation, activity]
          properties:
            overall: { type: number }
            output: { type: number }
            survival: { type: number }
            mechanics: { type: number }
            utility: { type: number }
            preparation: { type: number }
            activity: { type: number }
        professions: { type: array, items: { type: string } }
    RaidCounts:
      type: object
      description: Sign-up counts; the role counts count in only.
      required: [in, late, tanks, healers, dps]
      properties:
        in: { type: integer, x-name: signedIn }
        late: { type: integer }
        bench: { type: integer }
        out: { type: integer, x-name: signedOut }
        tanks: { type: integer }
        healers: { type: integer }
        dps: { type: integer }
    RaidLine:
      type: object
      description: A guild's next raid, the band's raid line; omitted when none.
      required: [id, zone, zone_name, title, starts_at, status, size, guild_timezone, counts, own]
      properties:
        id: { type: integer, format: int64 }
        zone: { type: string }
        zone_name: { type: string }
        title: { type: string }
        starts_at: { type: string, format: date-time }
        status: { type: string, enum: [planned, locked, done, cancelled] }
        size: { type: integer }
        guild_timezone: { type: string }
        counts: { $ref: '#/components/schemas/RaidCounts' }
        own:
          oneOf:
            - type: object
              title: RaidOwnSignup
              required: [character_key, state, role, note]
              properties:
                character_key: { type: string }
                state: { type: string, enum: [in, late, bench, out] }
                role: { type: string, enum: [tank, healer, dps] }
                note: { type: string }
            - { type: "null" }
    GuildRaids:
      type: object
      description: >-
        GET /v1/guilds/{id}/raids. rows are logged raid nights. A verified member also gets
        planned, zones, guild_timezone and discord; anyone else gets none of those four keys.
      required: [rows]
      properties:
        rows: { type: array, items: { $ref: '#/components/schemas/RaidNightRow' } }
        next_cursor: { type: string, description: Omitted at the end. }
        planned: { type: array, items: { $ref: '#/components/schemas/RaidView' } }
        zones:
          type: array
          items:
            type: object
            title: RaidZone
            required: [key, name, size]
            properties:
              key: { type: string, description: 'The zone key PATCH takes, e.g. "raid:onyxias-lair".' }
              name: { type: string }
              size: { type: [integer, "null"] }
        guild_timezone: { type: string }
        discord: { $ref: '#/components/schemas/RaidDiscord' }
        waiting_for_approval:
          type: integer
          description: >-
            Characters waiting for approval; present only when the viewer's guild can lists
            approve (lane F4 contract, handler pending). The Raids tab's officer row.
    RaidNightRow:
      type: object
      description: A logged raid night. id is a report id; raid_id is the planned raid, or null.
      required: [id, title, zone, created_at, duration_ms, fight_count, kill_count, wipe_count, raiders, deaths, fights, present, raid_id]
      properties:
        id: { type: string }
        title: { type: string }
        zone: { type: string }
        created_at: { type: string, format: date-time }
        duration_ms: { type: integer, format: int64 }
        fight_count: { type: integer }
        kill_count: { type: integer }
        wipe_count: { type: integer }
        raiders: { type: integer }
        deaths: { type: integer }
        fights:
          type: array
          items:
            type: object
            title: RaidNightFight
            required: [index, name, encounter_id, kill, duration_ms, deaths, players]
            properties:
              index: { type: integer }
              name: { type: string }
              encounter_id: { type: integer }
              kill: { type: boolean }
              duration_ms: { type: integer, format: int64 }
              deaths: { type: integer }
              players: { type: integer }
        present: { type: array, items: { $ref: '#/components/schemas/RaidCharacter' } }
        raid_id: { type: [integer, "null"], format: int64 }
        top_parse:
          type: object
          title: RaidTopParse
          required: [name, class, metric, value]
          properties:
            name: { type: string }
            class: { type: string, x-name: className }
            metric: { type: string }
            value: { type: number }
    RaidCharacter:
      type: object
      required: [character_key, name, class]
      properties:
        character_key: { type: string }
        name: { type: string }
        class: { type: string, x-name: className }
    RaidDiscord:
      type: object
      required: [available, connected, post_default, remind_default, channel_name]
      properties:
        available: { type: boolean }
        connected: { type: boolean }
        post_default: { type: boolean }
        remind_default: { type: boolean }
        channel_name: { type: [string, "null"] }
    RaidView:
      type: object
      description: >-
        One raid (Go guilds.RaidView). A locked raid takes no sign-up from a member; an officer
        may still write. match, night, attendance and report fill after the night (null before a
        log is matched).
      required: [id, zone, zone_name, title, starts_at, duration_minutes, status, size, guild_timezone, notes, notes_html, counts, signups, not_signed, viewer, discord, discord_post, pre_done_status, match, night, attendance, report]
      properties:
        id: { type: integer, format: int64 }
        zone: { type: string }
        zone_name: { type: string }
        title: { type: string }
        starts_at: { type: string, format: date-time }
        invite_at:
          type: [string, "null"]
          format: date-time
          description: >-
            When invites go out, before starts_at (the pull); null when the guild sets none. The
            web form sets it and raid.starting fires at it minus the lead (lane F4 contract,
            handler pending: omitted until the column exists, which reads as null).
        duration_minutes: { type: integer }
        status: { type: string, enum: [planned, locked, done, cancelled] }
        size: { type: [integer, "null"] }
        guild_timezone: { type: string }
        notes: { type: string }
        notes_html: { type: string, description: Sanitised HTML of notes; render it. }
        counts: { $ref: '#/components/schemas/RaidCounts' }
        composition: { $ref: '#/components/schemas/RaidComposition' }
        signups:
          type: array
          items:
            type: object
            title: RaidSignup
            required: [character_key, name, class, spec, role, state, note, own]
            properties:
              character_key: { type: string }
              name: { type: string }
              class: { type: string, x-name: className }
              spec: { type: string }
              role: { type: string, enum: [tank, healer, dps] }
              state: { type: string, enum: [in, late, bench, out] }
              note: { type: string }
              own: { type: boolean }
              spec_name: { type: string, description: "The spec's display name (specs.json name), e.g. Fury. Lane F4 contract, handler pending." }
              spec_icon: { type: string, description: "The spec's talent-tab icon stem, /data/{build}/icons/{stem}.webp. Lane F4 contract, handler pending." }
        not_signed:
          type: array
          items:
            type: object
            title: RaidNotSigned
            required: [character_key, name, class, spec]
            properties:
              character_key: { type: string }
              name: { type: string }
              class: { type: string, x-name: className }
              spec: { type: string }
              role: { type: string, enum: [tank, healer, dps], description: "The spec's role, for an officer's Add. Lane F4 contract, handler pending." }
              spec_name: { type: string, description: "The spec's display name (specs.json name), e.g. Fury. Lane F4 contract, handler pending." }
              spec_icon: { type: string, description: "The spec's talent-tab icon stem, /data/{build}/icons/{stem}.webp. Lane F4 contract, handler pending." }
        viewer:
          type: object
          title: RaidViewer
          required: [characters]
          properties:
            characters:
              type: array
              items:
                type: object
                title: RaidViewerCharacter
                description: One of your characters in the guild. When raid_spec is null, ask "Which spec tonight?".
                required: [character_key, name, class, spec, verified, state, role, raid_spec]
                properties:
                  character_key: { type: string }
                  name: { type: string }
                  class: { type: string, x-name: className }
                  spec: { type: string }
                  verified: { type: boolean }
                  state: { type: [string, "null"], enum: [in, late, bench, out, null] }
                  role: { type: string }
                  raid_spec: { type: [string, "null"] }
                  spec_name: { type: string, description: "The display name of raid_spec, else of spec. Lane F4 contract, handler pending." }
                  spec_icon: { type: string, description: "The icon stem of raid_spec, else of spec. Lane F4 contract, handler pending." }
                  spec_options:
                    type: array
                    description: >-
                      The class's specs in catalogue order, for "Which spec tonight?" (specs.json
                      filtered by class). Lane F4 contract, handler pending.
                    items:
                      type: object
                      title: RaidSpecOption
                      required: [spec, name, role, icon]
                      properties:
                        spec: { type: string, description: 'The specs.json key the PUT takes, e.g. "shaman-elemental".' }
                        name: { type: string }
                        role: { type: string, enum: [tank, healer, dps] }
                        icon: { type: string, description: The talent-tab icon stem. }
            can:
              type: array
              description: >-
                What the viewer may do on this raid, from the guild's capability rule: lock
                (lock and unlock sign-ups) and move (an officer's PUT for any roster character).
                Draw officer tools exactly when the word is present, never from a rank. Lane F4
                contract, handler pending; missing reads as [].
              items: { type: string, enum: [lock, move] }
            tools_ended:
              type: boolean
              description: >-
                True for an officer of a guild whose plan ended (officer read-only): the officer
                tools draw disabled with the plan sentence. Lane F4 contract, handler pending.
            raid_night:
              type: boolean
              description: >-
                True when GET /v1/me/raid-nights/{raid} has a summary for the viewer (a done raid
                whose log has one of the viewer's characters). Lane F4 contract, handler pending.
        discord: { $ref: '#/components/schemas/RaidDiscord' }
        discord_post:
          type: [object, "null"]
          title: RaidDiscordPost
          required: [posted_at, post_at, reminded_at, remind]
          properties:
            posted_at: { type: [string, "null"], format: date-time }
            post_at: { type: [string, "null"], format: date-time }
            reminded_at: { type: [string, "null"], format: date-time }
            remind: { type: boolean }
        pre_done_status: { type: [string, "null"] }
        match:
          type: [object, "null"]
          title: RaidMatch
          required: [report_id, zone_name, uploaded_at, uploaded_by_name, pulls, kills, duration_ms, how]
          properties:
            report_id: { type: string }
            zone_name: { type: string }
            uploaded_at: { type: string, format: date-time }
            uploaded_by_name: { type: string }
            pulls: { type: integer }
            kills: { type: integer }
            duration_ms: { type: integer, format: int64 }
            how: { type: string }
        night:
          type: [object, "null"]
          title: RaidNight
          required: [signed, came, late, not_in_log, joined, excused, kills, wipes, deaths, duration_ms]
          properties:
            signed: { type: integer }
            came: { type: integer }
            late: { type: integer }
            not_in_log: { type: integer }
            joined: { type: integer }
            excused: { type: integer }
            kills: { type: integer }
            wipes: { type: integer }
            deaths: { type: integer }
            duration_ms: { type: integer, format: int64 }
        attendance:
          type: [array, "null"]
          description: Every row for an officer, your own characters for a member.
          items:
            type: object
            title: RaidAttendanceRow
            required: [character_key, name, class, spec, signed, role, outcome, came_as, first_seen_offset_s, pulls_present, pulls_total, excused, own]
            properties:
              character_key: { type: string }
              name: { type: string }
              class: { type: string, x-name: className }
              spec: { type: string }
              signed: { type: string }
              role: { type: string }
              outcome: { type: string, description: "present, late, no_show, ..." }
              came_as: { type: [string, "null"] }
              first_seen_offset_s: { type: integer }
              pulls_present: { type: integer }
              pulls_total: { type: integer }
              excused: { type: boolean }
              own: { type: boolean }
        report: { $ref: '#/components/schemas/OpenObject', description: "Go guilds.RaidReportView, the night's summary; v1 opens the full report on the web." }
    SignupRequest:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [in, late, bench, out] }
        role: { type: string, enum: ["", tank, healer, dps], description: Empty takes the spec's default. }
        note: { type: string, maxLength: 140, description: The PUT writes note; leaving it out clears the stored note. }
        spec: { type: string, description: 'A specs.json key such as "warrior-fury", saved as the raid spec first.' }
    SignupAnswer:
      type: object
      required: [raid, moved]
      properties:
        raid: { $ref: '#/components/schemas/RaidView' }
        moved: { type: [string, "null"], description: Your other character the server moved to Bench; tell the player. }
    RaidComposition:
      type: object
      description: >-
        The raid leader's read (lane F4 contract, handler pending; the apps render it and never
        compute it). classes lists all nine classes in the game's order with the count signed In
        or Late; roles are the In counts by role; targets are the raid's role targets, null when
        the raid sets none; buffs is the Classic raid-essentials coverage from the classes signed
        In or Late: fortitude and shadow_protection (priest), mark_of_the_wild and battle_rez
        (druid), arcane_intellect (mage), blessings (paladin, count is the paladin count),
        soulstone (warlock), and the shaman totems windfury_totem, strength_of_earth and
        mana_spring. The list, names, labels and icons are data/curated/raid-buffs.json; the data
        pipeline exports each icon.
      required: [classes, roles, targets, buffs]
      properties:
        classes:
          type: array
          items:
            type: object
            title: RaidClassCount
            required: [class, count]
            properties:
              class: { type: string, x-name: className }
              count: { type: integer }
        roles: { $ref: '#/components/schemas/RaidRoleCounts' }
        targets: { oneOf: [{ $ref: '#/components/schemas/RaidRoleCounts' }, { type: "null" }] }
        buffs:
          type: array
          items:
            type: object
            title: RaidBuff
            required: [key, name, label, icon, present, count]
            properties:
              key: { type: string, enum: [fortitude, mark_of_the_wild, arcane_intellect, blessings, shadow_protection, soulstone, battle_rez, windfury_totem, strength_of_earth, mana_spring] }
              label: { type: string, description: "A short label (MotW, Fort) the apps draw inside the tile while the icon is missing or fails to load." }
              name: { type: string, description: "The spell's name in the client, e.g. Power Word: Fortitude." }
              icon: { type: string, description: "The icon stem, /data/{build}/icons/{stem}.webp." }
              present: { type: boolean }
              count: { type: integer, description: How many signed In or Late can provide it. }
    RaidRoleCounts:
      type: object
      required: [tanks, healers, dps]
      properties:
        tanks: { type: integer }
        healers: { type: integer }
        dps: { type: integer }
    RaidNightSummary:
      type: object
      description: >-
        GET /v1/me/raid-nights/{raid}: one raider's night (spec C5). loot and bests are [] when
        there are none; coach_notes is null without log_coach.
      required: [raid_id, guild_id, guild_name, zone_name, starts_at, report_id, character, kills, wipes, new_bests, loot, bests, coach_notes]
      properties:
        raid_id: { type: integer, format: int64 }
        guild_id: { type: integer, format: int64 }
        guild_name: { type: string }
        zone_name: { type: string }
        starts_at: { type: string, format: date-time }
        report_id: { type: string, description: "The matched report; the full report opens at /reports/{report_id} on the web." }
        character:
          type: object
          title: RaidNightCharacter
          required: [character_key, name, class, spec, spec_name, role]
          properties:
            character_key: { type: string }
            name: { type: string }
            class: { type: string, x-name: className }
            spec: { type: string }
            spec_name: { type: string }
            role: { type: string, enum: [tank, healer, dps] }
        kills: { type: integer }
        wipes: { type: integer }
        new_bests: { type: integer }
        loot:
          type: array
          items:
            type: object
            title: RaidNightLoot
            required: [item_id, name, quality, icon, slot, boss, awarded_by, replaces]
            properties:
              item_id: { type: integer }
              name: { type: string }
              quality: { type: integer, description: 0 (poor) to 5 (legendary). }
              icon: { type: string, description: The icon stem. }
              slot: { type: string, description: The slot label, e.g. Back. }
              boss: { type: string }
              awarded_by: { type: string, description: The awarding officer's main character name. }
              replaces:
                type: [object, "null"]
                title: RaidNightReplaces
                required: [item_id, name, quality, item_level]
                properties:
                  item_id: { type: integer }
                  name: { type: string }
                  quality: { type: integer }
                  item_level: { type: integer }
        bests:
          type: array
          items:
            type: object
            title: RaidNightBest
            required: [boss, dps, percentile, kill_ms]
            properties:
              boss: { type: string }
              dps: { type: number }
              percentile: { type: integer, description: 0 to 100, the parse colour band. }
              kill_ms: { type: integer, format: int64 }
        coach_notes:
          type: [array, "null"]
          description: Up to three; null without log_coach.
          items: { type: string }
    RaidPatch:
      type: object
      description: The officer's whole raid form.
      required: [zone, title, starts_at, duration_minutes, notes, timezone]
      properties:
        zone: { type: string }
        title: { type: string }
        starts_at: { type: string, format: date-time }
        duration_minutes: { type: integer, minimum: 60, maximum: 240, multipleOf: 30 }
        notes: { type: string, maxLength: 2000 }
        timezone: { type: string, description: An IANA name. }
        post_to_discord: { type: boolean }
        remind_day_before: { type: boolean }
    RaidCancel:
      type: object
      properties:
        post_to_discord: { type: boolean }
    GuildLoot:
      type: object
      required: [encounters, selected, items]
      properties:
        encounters:
          type: array
          items:
            type: object
            title: LootEncounter
            required: [encounter_id, name, zone, killed]
            properties:
              encounter_id: { type: integer }
              name: { type: string }
              zone: { type: string }
              killed: { type: boolean }
        selected: { type: integer, format: int64 }
        items:
          type: array
          items:
            type: object
            title: LootItem
            required: [item_id, name, icon, quality, slot, copies, awarded_to, candidates]
            properties:
              item_id: { type: integer }
              name: { type: string }
              icon: { type: string }
              quality: { type: integer, minimum: 0, maximum: 5 }
              slot: { type: string }
              copies: { type: integer }
              awarded_to:
                type: [object, "null"]
                title: LootAward
                required: [award_id, character_key, name, at, by_name]
                properties:
                  award_id: { type: integer, format: int64 }
                  character_key: { type: string }
                  name: { type: string }
                  at: { type: string, format: date-time }
                  by_name: { type: string }
              candidates:
                type: array
                description: Ranked best first.
                items:
                  type: object
                  title: LootCandidate
                  required: [character_key, name, class, spec, gain_dps, not_sim_checked, ilvl_delta, attendance, already_equivalent, replaces, items_won]
                  properties:
                    character_key: { type: string }
                    name: { type: string }
                    class: { type: string, x-name: className }
                    spec: { type: string }
                    gain_dps: { type: [number, "null"] }
                    not_sim_checked: { type: boolean }
                    ilvl_delta: { type: [integer, "null"] }
                    attendance: { $ref: '#/components/schemas/GuildAttendance' }
                    already_equivalent: { type: boolean }
                    replaces: { type: string }
                    items_won: { type: integer }

    # Reports and builds -------------------------------------------------------------------
    ReportList:
      type: object
      required: [rows, total, page, per_page]
      properties:
        rows:
          type: array
          items:
            type: object
            title: ReportRow
            required: [id, title, zone, status, visibility, created_at, fight_count, kill_count, boss_count, logging_character, last_upload_at, heartbeat_at]
            properties:
              id: { type: string }
              title: { type: string, description: 'May be ""; show the zone.' }
              zone: { type: string }
              status: { type: string, enum: [live, processing, complete, failed] }
              visibility: { type: string, enum: [public, unlisted, guild, private] }
              created_at: { type: string, format: date-time }
              fight_count: { type: integer }
              kill_count: { type: integer }
              boss_count: { type: integer }
              logging_character: { oneOf: [{ $ref: '#/components/schemas/LoggingCharacter' }, { type: "null" }] }
              last_upload_at: { type: [string, "null"], format: date-time }
              heartbeat_at: { type: [string, "null"], format: date-time }
        total: { type: integer }
        page: { type: integer }
        per_page: { type: integer }
    LoggingCharacter:
      type: object
      required: [key, name]
      properties:
        key: { type: string }
        name: { type: string }
    BuildList:
      type: object
      required: [rows, total, page, per_page]
      properties:
        rows: { type: array, items: { $ref: '#/components/schemas/Build' } }
        total: { type: integer }
        page: { type: integer }
        per_page: { type: integer }
    BuildSaved:
      type: object
      required: [id, url]
      properties:
        id: { type: string }
        url: { type: string, format: uri }

    # App sign-in, devices, notifications and config ---------------------------------------
    AppExchangeRequest:
      type: object
      required: [code, code_verifier]
      properties:
        code: { type: string, description: The one-time code from the /app/auth landing. }
        code_verifier: { type: string, minLength: 43, maxLength: 128 }
        device_name: { type: string, description: 'Optional, trimmed to 60; otherwise "iOS" or "Android".' }
    AppSession:
      type: object
      description: The device token (shown only here), the device row and the GET /v1/me body.
      required: [token, device, me]
      properties:
        token: { type: string }
        device: { $ref: '#/components/schemas/Device' }
        me: { $ref: '#/components/schemas/Me' }
    Device:
      type: object
      description: One signed-in install. The sign-in exchange carries only id, name and platform.
      required: [id, name, platform]
      properties:
        id: { type: string }
        name: { type: string }
        platform: { type: string, description: "ios, android, or a companion's OS." }
        kind: { type: string, enum: [companion, app] }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
    SignedOut:
      type: object
      required: [signed_out]
      properties:
        signed_out: { type: boolean }
    MeSeat:
      type: object
      description: The Premium seat this account holds from a guild (Go auth.MeSeat); omitted when none.
      required: [guild_name, given_by, since, starts_at]
      properties:
        guild_name: { type: string }
        given_by: { type: string }
        since: { type: string, format: date-time }
        starts_at: { type: [string, "null"], format: date-time }
    AccountDeletionRequest:
      type: object
      description: >-
        The explicit confirmation behind DELETE /v1/me. The app sends the phrase only after the
        person has read what is deleted and confirmed it; any other value answers 400 invalid.
      required: [confirm]
      properties:
        confirm: { type: string, enum: ["delete my account"] }
    AccountDeletion:
      type: object
      description: >-
        An accepted deletion. Every device and session of the account is already signed out;
        the data goes by complete_by (30 days after the request, the privacy page's promise).
      required: [requested_at, complete_by]
      properties:
        requested_at: { type: string, format: date-time }
        complete_by: { type: string, format: date-time }
    NotificationSettings:
      type: object
      description: >-
        The player's choices per event and channel, every catalogue event in catalogue order.
        Show copy from the app's own strings keyed by kind; hide an unknown kind.
      required: [time_zone, quiet_hours, events]
      properties:
        time_zone: { type: string, description: An IANA name. }
        quiet_hours: { $ref: '#/components/schemas/QuietHours' }
        events:
          type: array
          items:
            type: object
            title: NotificationEvent
            required: [kind, who, officer, quiet_exempt, time_sensitive, channels]
            properties:
              kind: { type: string, description: "The catalogue's name: raid.posted, raid.starting, sim.finished, ..." }
              who: { type: string, description: "player, guild_members, signed_up, in_and_late, raiders, officers, payer, everyone" }
              officer: { type: boolean, description: Show only to officers. }
              quiet_exempt: { type: boolean }
              time_sensitive: { type: boolean }
              channels: { $ref: '#/components/schemas/NotificationChannels' }
    QuietHours:
      type: object
      required: [enabled, start, end]
      properties:
        enabled: { type: boolean }
        start: { type: string, description: "HH:MM in time_zone." }
        end: { type: string, description: "HH:MM in time_zone." }
    NotificationChannels:
      type: object
      required: [push, discord]
      properties:
        push: { type: boolean }
        discord: { type: boolean }
    NotificationsPatch:
      type: object
      description: Every key optional but at least one.
      properties:
        time_zone: { type: string }
        quiet_hours: { $ref: '#/components/schemas/QuietHours' }
        events:
          type: array
          items:
            type: object
            title: NotificationChoice
            required: [kind, channel, enabled]
            properties:
              kind: { type: string }
              channel: { type: string, enum: [push, discord] }
              enabled: { type: boolean }
    PushTokenRequest:
      type: object
      required: [platform, token]
      properties:
        platform: { type: string, enum: [ios, android] }
        token: { type: string, description: "iOS: 64 to 200 hex characters. Android: the FCM registration token." }
        app_version: { type: string, maxLength: 32 }
    PushTokenRegistered:
      type: object
      required: [platform, app_version]
      properties:
        platform: { type: string }
        app_version: { type: string }
    AppConfig:
      type: object
      description: >-
        GET /v1/app/config, read once at launch and cached. Show "See plans" exactly when the
        storefront country is in web_checkout_regions. Below min_app_version, block with the
        update screen. A feature ships behind a features key, dark in both apps, and the key
        turns it on in both at once: a key the app does not know is ignored, and a key the
        answer leaves out takes the app's bundled default (apps/shared/features.json).
      required: [web_checkout_regions, min_app_version, active_build, features]
      properties:
        web_checkout_regions: { type: array, items: { type: string, pattern: '^[A-Z]{2}$' }, description: "ISO 3166-1 alpha-2, upper case; never null." }
        min_app_version:
          type: object
          title: MinAppVersion
          required: [ios, android]
          properties:
            ios: { type: string, description: Dotted, compared numerically. }
            android: { type: string }
        active_build: { type: string, description: The client build the static data serves. }
        features:
          type: object
          additionalProperties: { type: boolean }
          description: Feature switches by key; apps/shared/features.json lists the keys and their bundled defaults.

