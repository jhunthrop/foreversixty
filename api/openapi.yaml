              background: { type: string }
              icon: { type: string }
              talents:
                type: array
                items:
                  type: object
                  title: Talent
                  required: [id, name, icon, max_rank, tier, column, prereq_talent_id, prereq_rank, ranks, spell_id]
                  properties:
                    id: { type: integer }
                    name: { type: string }
                    icon: { type: string }
                    max_rank: { type: integer }
                    tier: { type: integer }
                    column: { type: integer }
