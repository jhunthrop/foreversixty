                        type: object
                        title: TalentRank
                        required: [spell_id, description]
                        properties:
                          spell_id: { type: integer }
                          description: { type: string }

    # Push payloads (lane A2, api/internal/push): what APNs and FCM hand the app -------------
    ApnsPayload:
      type: object
      x-fixtures: [push.raid-posted.apns, push.raid-starting.apns]
      required: [aps, kind, link, data]
      properties:
        aps:
          type: object
          required: [alert, sound, thread-id]
          properties:
            alert:
              type: object
              required: [title, body]
              properties:
                title: { type: string }
                body: { type: string }
            sound: { type: string, enum: [default] }
            thread-id: { type: string, description: "raid-<raid id>" }
            category: { type: string, enum: [RAID_SIGNUP] }
            interruption-level: { type: string, enum: [time-sensitive] }
        kind: { type: string }
        link: { type: string, format: uri }
        actions: { type: array, items: { $ref: '#/components/schemas/PushAction' } }
        data:
          type: object
          additionalProperties: { type: string }
          description: >-
            Strings only. A raid push carries guild_id and raid_id; one with actions also carries
            character_key (the character the actions answer for: the one signed, else the main,
            else the only verified one), ask_spec ("true" when that character has no raid spec
            and its class has two or more) and answers, a JSON string of { in, late, out, moved,
            locked, cancelled, failed } each { title, body } composed in the player's locale,
            which the app posts in place of the notification after an action (moved.body holds
            {name}, appended to the in or late body). Lane F4 contract, A2 pending.
    FcmMessage:
      type: object
      x-fixtures: [push.raid-posted.fcm]
      required: [message]
      properties:
        message:
          type: object
          required: [token, notification, data, android]
          properties:
            token: { type: string }
            notification:
              type: object
              required: [title, body]
              properties:
                title: { type: string }
                body: { type: string }
            data:
              type: object
              description: Strings only; actions is the actions array as a JSON string.
              required: [kind, link]
              additionalProperties: { type: string }
              properties:
                kind: { type: string }
                link: { type: string }
                thread: { type: string }
                category: { type: string }
                actions: { type: string }
                guild_id: { type: string }
                raid_id: { type: string }
                character_key: { type: string, description: As ApnsPayload.data. }
                ask_spec: { type: string, enum: ["true", "false"] }
                answers: { type: string, description: As ApnsPayload.data, a JSON string. }
            android:
              type: object
              required: [priority, collapse_key, notification]
              properties:
                priority: { type: string, enum: [HIGH, NORMAL] }
                collapse_key: { type: string }
                notification:
                  type: object
                  required: [tag]
                  properties:
                    tag: { type: string }
                    click_action: { type: string }
    PushAction:
      type: object
      description: 'One notification button. The app replaces {character} in path with the region/ruleset/name it answers for.'
      required: [id, title, method, path, body]
      properties:
        id: { type: string, enum: [signup_in, signup_late, signup_out] }
        title: { type: string }
        method: { type: string, enum: [PUT] }
        path: { type: string }
        body: { type: object, required: [state], properties: { state: { type: string, enum: [in, late, out] } } }
  parameters:
    XApp:
      name: X-App
      in: header
      required: false
      description: >-
        Which app build sends the request: `<platform>/<version> (<build>)`, platform ios or
        android, version and build from apps/VERSION ("ios/1.2.0 (42)"). Both apps send it on
        every call from their transport (iOS IdentifiedTransport, Android's client identity
        plugin), so the generated endpoints never set it. A missing or malformed value is not an
        error; the API logs it and gates outdated builds on it (426).
      schema: { type: string, pattern: '^(ios|android)/[0-9A-Za-z.\-]+ \([0-9]+\)$' }
    XAppInstall:
      name: X-App-Install
      in: header
      required: false
      description: >-
        A random UUID made on first launch, tied to no account and gone on uninstall (never
        backed up). Sent with X-App by the same transports.
      schema: { type: string, format: uuid }
  responses:
    UpdateRequired:
      description: >-
        update_required: this app build (X-App) is below the API's minimum for its platform.
        error.fields.store_url is the store page to send the player to and min_version the lowest
        version served. The apps' UpdateGate replaces every screen with the update screen; a
        feature never handles it.
      x-fixtures: [error-update-required]
      content: { application/json: { schema: { $ref: '#/components/schemas/UpdateRequiredError' } } }
    NotFound:
      description: "Unmatched routes return the envelope with code not_found"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
paths:
  /health:
    get:
      summary: Liveness
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
  /version:
    get:
      summary: Build version
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
  /v1/subscribe:
    post:
      summary: Start a double opt-in subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: "Accepted regardless of whether the address is already known"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '400':
          description: "Malformed or missing JSON body, or invalid email address. When email is invalid, error.fields.email is set."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '429':
          description: "Rate limited: 10 requests per minute per IP on this route, 120 per minute per IP overall"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '500':
          description: "Unexpected store error; envelope with code internal. Mail is sent asynchronously after the response, so this is never a mail-provider failure."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
  /v1/subscribe/confirm:
    get:
      summary: Confirm a subscription
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: "Redirect to configured public site base URL + /subscribed (success) or /subscribe-invalid (invalid token)"
  /v1/subscribe/unsubscribe:
    get:
      summary: Unsubscribe
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: "Redirect to configured public site base URL + /unsubscribed (success) or /subscribe-invalid (invalid token)"
  /v1/builds:
    post:
      operationId: saveBuild
      tags: [app]
      summary: Save a build
      description: >-
        The id is the first eight characters of the lowercase base32 SHA-256 of the canonical JSON of
        class_id, gear, point_order, race_id, and tree_version, so saving the same build twice returns
        the same id and the first title wins.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BuildInput' } } }
      parameters:
        - $ref: '#/components/parameters/XApp'
        - $ref: '#/components/parameters/XAppInstall'
      responses:
        '426': { $ref: '#/components/responses/UpdateRequired' }
        '201':
          description: "Saved; url is PUBLIC_BASE_URL + /b/ + id"
          x-fixtures: [builds.save]
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { type: object, properties: { data: { $ref: '#/components/schemas/BuildSaved' } } }
        '200':
          description: "That build was already saved; the same { id, url }"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { type: object, properties: { data: { $ref: '#/components/schemas/BuildSaved' } } }
        '400':
          description: "Body was not JSON or over 8 KB, or the build breaks a talent rule; fields is keyed class_id, race_id, tree_version, title, point_order, point_order[i] or gear.<slot>"
          x-fixtures: [builds.save.error-invalid]
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '429':
          description: "Rate limited: 20 saves per IP per hour"
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '500':
          description: "Unexpected store error"
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    get:
      operationId: listMyBuilds
      tags: [app]
      summary: The caller's own saved builds
      parameters:
        - $ref: '#/components/parameters/XApp'
        - $ref: '#/components/parameters/XAppInstall'
        - { name: mine, in: query, required: true, schema: { type: string, enum: ['1'] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '426': { $ref: '#/components/responses/UpdateRequired' }
        '200':
          description: "One page of the caller's builds, newest first"
          x-fixtures: [builds.list, builds.list.empty]
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - { type: object, properties: { data: { $ref: '#/components/schemas/BuildList' } } }
        '400':
          description: "This list is mine=1 only"
          x-fixtures: [builds.list.error-invalid]
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401':
          description: "No session or device token, or a dead one"
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /v1/builds/{id}:
    get:
      operationId: getBuild
      tags: [app]
      summary: Fetch a build record
      parameters:
