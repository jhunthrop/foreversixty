  /v1/auth/app/start:
    get:
      summary: Begin app sign-in in the system browser (dark, APP_SIGN_IN)
      description: >-
        Opened in ASWebAuthenticationSession or a Custom Tab, never called by the API client.
        Answers a confirm page; "Continue to Battle.net" is GET /v1/auth/app/continue. The flow
        ends at exactly https://foreversixty.gg/app/auth?code=...&state=...; any redirect_uri the
        client sends is ignored. 60 an hour per IP, shared with continue.
      operationId: startAppSignIn
      tags: [app-browser]
      parameters:
        - { name: platform, in: query, required: true, schema: { type: string, enum: [ios, android] } }
        - { name: code_challenge, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
        - { name: state, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z0-9._~-]{16,128}$' } }
      responses:
        '200':
          description: "The confirm page: no script, framing refused"
          content: { text/html: { schema: { type: string } } }
        '400':
          description: "invalid, with fields naming each bad parameter"
          x-fixtures: [app.signin.start.error-invalid]
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '429':
          description: "rate_limited"
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /v1/auth/app/continue:
    get:
      summary: The confirm page's Continue to Battle.net (dark, APP_SIGN_IN)
      operationId: continueAppSignIn
      tags: [app-browser]
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302': { description: "To Battle.net" }
        '400':
          description: "invalid: this browser did not start the flow"
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
