      required: [id, name, icon, slot, quality, required_level, item_level, armor, stats, damage_min, damage_max, speed, dps, two_hand, effect_text, stats_source, set_id, unique, client_unconfirmed, percent_stats, icon_source, weapon_type, superseded_by, required_level_source]
      properties:
