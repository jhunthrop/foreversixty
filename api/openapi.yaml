openapi: 3.1.0
info:
  title: Forever Sixty API
  version: 0.1.0
servers:
  - url: https://api.foreversixty.gg
components:
  schemas:
    Envelope:
      type: object
      description: >-
        Every successful (2xx) GET response carries ETag: W/"<16 hex chars of sha256(data)>".
        A request with a matching If-None-Match (weak or strong, comma-separated) gets 304 Not
        Modified with an empty body and the same ETag and Cache-Control headers the 200 would
        have carried. POST, PATCH, and DELETE responses never carry an ETag.
      required: [ok, data, error, request_id]
      properties:
        ok: { type: boolean }
        data:
          description: any JSON or null
        error:
          oneOf:
            - type: "null"
            - type: object
              properties:
                code: { type: string }
                message: { type: string }
                fields: { type: object, additionalProperties: { type: string } }
        request_id: { type: string }
    AddonInbox:
      type: object
      description: >-
        GET /v1/addon/inbox's data: contract 3 of docs/contracts/addon-v2.md, the body
        docs/contracts/fixtures/inbox-v2.json pins. `format` is the version the companion writes
        into ForeverSixtyInbox.lua; `builds` is the pre-v2 list, kept for one release beside the
        `build` messages that repeat it.
      required: [format, generated_at, builds, messages]
      properties:
        format: { type: integer, enum: [2] }
        generated_at: { type: string, format: date-time, description: "RFC 3339, UTC" }
        builds:
          type: array
          items:
            type: object
            required: [id, name, code]
            properties:
              id: { type: string }
              name: { type: string }
              character: { type: string, description: "character key region/ruleset/name-slug; absent reaches every character" }
              code: { type: string, description: "the build's FSB1 addon code" }
        messages:
          type: array
          items: { $ref: '#/components/schemas/AddonInboxMessage' }
    AddonInboxMessage:
      description: >-
        One typed message, selected by `type`; a reader skips a type it does not know.
        `character` is the character key region/ruleset/name-slug (the form builds have always
        carried), absent on an upgrade or weights message whose run names none of the account's
        characters. Player-visible strings (name, item_name, source, biggest_loss,
        consumables_missed, raid, guild_name) are plain words; ids are lookup keys only.
      oneOf:
        - type: object
          title: build
          required: [type, name, code]
          properties:
            type: { type: string, enum: [build] }
            character: { type: string }
            name: { type: string }
            code: { type: string }
        - type: object
          title: upgrade
          required: [type, slot, item_id, delta, unit]
          properties:
            type: { type: string, enum: [upgrade] }
            character: { type: string }
            slot: { type: string }
            item_id: { type: integer }
            item_name: { type: string }
            source: { type: string }
            delta: { type: number }
            unit: { type: string, enum: [dps, score], description: "absent means dps" }
        - type: object
          title: weights
          required: [type, spec, weights]
          properties:
            type: { type: string, enum: [weights] }
            character: { type: string }
            spec: { type: string }
            weights:
              type: array
              items:
                type: object
                required: [stat, weight]
                properties: { stat: { type: string }, weight: { type: number } }
            caps: { type: array, items: { type: string } }
            dps_per_point:
              type: number
              description: >-
                DPS (healing per second for a healer) per point of the stat whose weight is 1,
                from the data build's dps-per-point.json; absent for a spec it has no entry for,
                or when the run's weight-1 stat is not that file's reference stat
            generated_at:
              type: string
              format: date-time
              description: >-
                When the run that made these weights was queued (UTC): the character's newest
                finished in-game run, else the account's newest website weights run
            export_seen_at:
              type: string
              format: date-time
              description: >-
                The export the in-game request was made on, the same value the ack carried
                for it; absent for a website run and for an in-game request with no export recorded
        - type: object
          title: sim_result
          required: [type, character, spec, dps, error, generated_at, slots]
          properties:
            type: { type: string, enum: [sim_result] }
            character: { type: string }
            spec: { type: string }
            dps:
              type: number
              description: >-
                the run's DPS; for the weights run an in-game request queues, the DPS of the
                sweep's baseline sim (the character as it is), over the baseline's own iterations
            error:
              type: number
              description: "always present, 0 included; for a weights run, the baseline sim's"
            generated_at: { type: string, format: date-time }
            slots:
              type: array
              description: "per-slot DPS deltas from a Top Gear run; an empty list for a run with no bulk section, such as the weights run an in-game request queues"
              items:
                type: object
                required: [slot, item_id, delta]
                properties: { slot: { type: string }, item_id: { type: integer }, delta: { type: number } }
        - type: object
          title: last_raid
          required: [type, character, report_id, date, bosses]
          properties:
            type: { type: string, enum: [last_raid] }
            character: { type: string }
            report_id: { type: string }
            date: { type: string, format: date }
            bosses:
              type: array
              items:
                type: object
                required: [name, percentile, loss_seconds, deaths, consumables_missed]
                properties:
                  name: { type: string }
                  percentile: { type: integer, minimum: 0, maximum: 100 }
                  biggest_loss:
                    type: string
                    description: >-
                      downtime | dead early | died to <cause> | a death | standing in fire |
                      missing consumables | missed mechanics | low output | utility; absent when
                      nothing cost a point
                  loss_seconds: { type: integer }
                  deaths: { type: integer }
                  consumables_missed: { type: array, items: { type: string, enum: [flask, food] } }
                  adherence: { type: number, minimum: 0, maximum: 1, description: "share of the player's ability casts that the spec's shipped rotation lists for the character's level band, to two decimals; absent without a shipped rotation, under 10 ability casts, when the level could not be read, or for a fight rated before migration 0037" }
        - type: object
          title: loot_values
          required: [type, character, raid, items]
          properties:
            type: { type: string, enum: [loot_values] }
            character: { type: string }
            raid: { type: string }
            items:
              type: object
              description: keyed by item id
              additionalProperties:
                type: object
                required: [value, unit, planned]
                properties:
                  value: { type: number }
                  unit: { type: string, enum: [dps, score] }
                  planned: { type: boolean }
        - type: object
          title: guild
          required: [type, character, guild_name]
          properties:
            type: { type: string, enum: [guild] }
            character: { type: string }
            guild_name: { type: string }
            claim_state: { type: string }
            pending_approvals: { type: integer }
            rank: { type: string }
        - type: object
          title: ack
          required: [type, character, export_seen_at]
          properties:
            type: { type: string, enum: [ack] }
            character: { type: string }
            export_seen_at:
              type: string
              format: date-time
              description: >-
                When the site last received an upload for the character, whether or not the export
                changed
            export_changed_at:
              type: string
              format: date-time
              description: When the export text last changed; never later than export_seen_at
            sim_request_state:
              type: string
              enum: [queued, needs_premium, duplicate, invalid, done, failed]
              description: >-
                what became of the character's newest in-game sim request; "duplicate" when
                another request started a run within the hour (a run that failed does not count),
                "done" and "failed" read from its run once it ends
            requested_at:
              type: string
              format: date-time
              description: >-
                When the site received the character's newest in-game sim request (UTC), not the
                player's own wall time; absent when it never asked
    BuildInput:
      type: object
      required: [class_id, race_id, tree_version, point_order]
      properties:
        class_id: { type: integer, description: "Class id present in classes.json for tree_version" }
        race_id: { type: integer, description: "Race id present in races.json for tree_version" }
        tree_version: { type: string, example: "1.15.9.69722", description: "Client build id the API has data for" }
        point_order:
          type: array
          maxItems: 51
          items: { type: integer }
          description: "Talent id per point spent, in the order the points were spent"
        gear:
          type: object
          additionalProperties: { type: integer }
          description: "Item id per planner slot: head neck shoulder back chest wrist hands waist legs feet finger1 finger2 trinket1 trinket2 main_hand off_hand ranged"
        title: { type: string, maxLength: 60 }
    Build:
      type: object
      required: [id, class_id, race_id, tree_version, point_order, gear, created_at, views]
      properties:
        id: { type: string, minLength: 8, maxLength: 8, example: "k7x2qm4a" }
        class_id: { type: integer }
        race_id: { type: integer }
        tree_version: { type: string }
        point_order: { type: array, items: { type: integer } }
        gear: { type: object, additionalProperties: { type: integer } }
        title: { type: string }
        created_at: { type: string, format: date-time }
        views: { type: integer, format: int64 }
    MetricsRow:
      type: object
      description: "One player's numbers for one boss fight; the companion posts these and the API recomputes them from the events"
      required: [player_guid, name, role, metric_dps, metric_hps, damage_taken, active_ms, deaths,
                 encounter_id, difficulty, size, duration_ms, kill]
      properties:
        player_guid: { type: string }
        name: { type: string }
        class: { type: string }
        spec: { type: string }
        role: { type: string, enum: [dps, healer, tank] }
        ilvl: { type: integer }
        metric_dps: { type: number }
        metric_hps: { type: number }
        damage_taken: { type: integer, format: int64 }
        active_ms: { type: integer, format: int64 }
        deaths: { type: integer }
        encounter_id: { type: integer, format: int64 }
        difficulty: { type: integer }
        size: { type: integer }
        duration_ms: { type: integer, format: int64 }
        kill: { type: boolean }
    Report:
      type: object
      required: [id, title, visibility, status, fights, players, created_at, data_base_url]
      properties:
        id: { type: string, minLength: 12, maxLength: 12 }
        title: { type: string }
        visibility: { type: string, enum: [public, unlisted, private, guild] }
        owner:
          type: object
          properties:
            id: { type: integer, format: int64 }
            battletag:
              type: string
              description: >-
                The owner's battletag, or "user-<id>" when they have none or have set
                anonymize. Never an email address: this body is public for a public or
                unlisted report.
        guild:
          type: object
          properties:
            id: { type: integer, format: int64 }
            name: { type: string }
            region: { type: string }
            ruleset: { type: string, enum: [normal, pvp, rp, hardcore] }
        zone: { type: string }
        status: { type: string, enum: [live, processing, complete, failed] }
        engine_version: { type: string }
        flagged: { type: string, description: "metrics_mismatch or tampered when the report is under suspicion" }
        fights:
          type: array
          items: { $ref: '#/components/schemas/FightEntry' }
        players: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        last_upload_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            The newest of the report's fight uploads and its creation. A fight sent again counts.
            The waiting screen of a live report reads it.
        heartbeat_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the companion last called POST /v1/reports/{id}/heartbeat; null before the first.
        logging_character:
          type: object
          nullable: true
          description: >-
            The character whose client wrote the log; null when the report names none. name is
            the characters table's when the key resolves, else the key's last segment
            title-cased.
          required: [key, name]
          properties:
            key: { type: string, description: "region/ruleset/slug, e.g. us/pvp/bow-jackzon" }
            name: { type: string }
        data_base_url:
          type: string
          description: >-
            Where the island reads report.json and the per-fight files. Public and unlisted reports
            are served off the bucket by the site Worker; everything else points at
            /v1/reports/{id}/files, which redirects each object to a signed URL valid ten minutes.
    FightEntry:
      type: object
      description: "The engine's store.FightEntry plus whether the ingest verified the fight"
      required: [index, kind, name, kill, duration_ms, players, verified]
      properties:
        index: { type: integer }
        kind: { type: string, enum: [encounter, trash] }
        name: { type: string }
        encounter_id: { type: integer, format: int64 }
        difficulty: { type: integer }
        size: { type: integer }
        kill: { type: boolean }
        in_progress: { type: boolean }
        zone: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        duration_ms: { type: integer, format: int64 }
        players: { type: array, items: { type: string } }
        deaths: { type: integer }
        npc_kills: { type: integer }
        verified: { type: boolean }
    RankingRow:
      type: object
      required: [rank, player, value, size, fought_at, duration_ms, report_id, fight_index, state]
      properties:
        rank: { type: integer }
        player:
          type: object
          properties:
            key: { type: string, description: "<region>/<ruleset>/<name-slug>" }
            name: { type: string }
            class: { type: string }
            spec: { type: string }
        guild:
          type: object
          properties:
            name: { type: string }
            region: { type: string }
            ruleset: { type: string }
        value: { type: number }
        ilvl: { type: integer }
        size: { type: integer }
        fought_at: { type: string, format: date-time }
        duration_ms: { type: integer }
        talent_split: { type: string, example: "31/20/0" }
        trinkets: { type: array, items: { type: integer } }
        buff_count: { type: integer }
        report_id: { type: string }
        fight_index: { type: integer }
        state: { type: string, enum: [ok, at_risk, removed] }
        execution_score: { $ref: '#/components/schemas/ExecutionScore' }
    GearSlotName:
      type: string
      enum: [head, neck, shoulder, back, chest, wrist, hands, waist, legs, feet,
             finger1, finger2, trinket1, trinket2, main_hand, off_hand, ranged]
      description: >-
        The planner's slot vocabulary, in the order the engine's positional
        equipment array is built.
    GearSlot:
      type: object
      description: One equipped item.
      required: [slot, item_id]
      properties:
        slot: { $ref: '#/components/schemas/GearSlotName' }
        item_id: { type: integer }
        enchant: { type: integer }
        suffix: { type: integer }
    Candidate:
      type: object
      description: One item the planner may substitute in.
      required: [item_id, origin]
      properties:
        slot:
          description: >-
            The planner slot, or "" for "wherever it fits", which is how a
            ring, a trinket or a one-hander is offered. A slot named in
            bulk.locked cannot also carry a candidate.
          oneOf:
            - { type: string, const: "" }
            - $ref: '#/components/schemas/GearSlotName'
        item_id: { type: integer }
        enchant:
          type: integer
          description: >-
            0 inherits the equipped item's enchant for the slot it lands in,
            where that enchant fits; it does not mean "none".
        suffix: { type: integer }
        origin:
          type: string
          description: >-
            Where the candidate came from: equipped, bag, bank, search,
            "drop:<source id>" or "set:<name>". A prefixed origin must name
            something after the colon, and every candidate of a drops request
            must carry a "drop:" origin.
          examples: [equipped, "drop:lucifron"]
        source_name:
          type: string
          description: >-
            The human name of the place the candidate came from - "Lucifron",
            "my AQ set". It travels into the result's substitution and into
            the row's headline, so nothing downstream has to join an origin id
            back to a name.
    TalentLoadout:
      type: object
      description: One named build to try.
      required: [name, talents]
      properties:
        name: { type: string }
        talents: { type: string, description: The engine's own positional talent string. }
    GearSet:
      type: object
      description: >-
        A whole-gear alternative: one candidate that replaces every slot at
        once.
      required: [name, gear]
      properties:
        name: { type: string }
        gear: { type: array, items: { $ref: '#/components/schemas/GearSlot' } }
    BulkSpec:
      type: object
      description: >-
        What turns one character into many sims. Top Gear, talent compare and
        Droptimizer ask the same question - a base character, a set of
        substitutions, a ranked answer - so they are one request shape with one
        planner behind it; mode says which of the three asked, and it is also
        the request's kind.
      required: [mode, precision]
      properties:
        mode: { type: string, enum: [gear, talents, drops] }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/Candidate' }
          description: >-
            A drops request needs at least one and a talents request carries
            none; a gear request needs at least one candidate, talent loadout,
            set or consumable list between them.
        talents:
          type: array
          items: { $ref: '#/components/schemas/TalentLoadout' }
          description: >-
            A talents request needs at least one, and carries no candidates and
            no consumable lists: everything but the talents is locked.
        sets:
          type: array
          items: { $ref: '#/components/schemas/GearSet' }
          description: Gear mode only; a set on any other mode is refused.
        consumables:
          type: array
          items: { type: array, items: { type: string } }
          description: >-
            Alternative consumable lists tried as candidates in gear mode: each
            inner list REPLACES character.consumes for that combination, so
            "flask or elixirs" is a dimension of the product rather than a
            thing the player has to run twice. An empty inner list is legal and
            means "no consumables". Gear mode only.
        locked:
          type: array
          items: { $ref: '#/components/schemas/GearSlotName' }
          description: >-
            Slots that are never substituted, whatever the candidate list says.
            It is the page's "keep what I have here".
        precision:
          type: string
          enum: [fast, normal, high]
          description: >-
            How many stages the planner runs and how many iterations the last
            one gets. iterations must be that last stage's count: 3000 for fast
            and for normal, 10000 for high.
        cap:
          type: integer
          description: >-
            The lane's combination cap, echoed into the request so a saved row
            says what bounded it. POST /v1/sims/run sets it itself - it is the
            server's to set, not a control the client holds - and refuses an
            expansion above it with cap_exceeded rather than silently trimming.
            A result saved through POST /v1/sims must carry the cap its own
            lane ran under.
    DiscordBlock:
      type: object
      description: The saved Discord channel. Never carries the URL, token or webhook id.
      properties:
        channel_id: { type: string }
        name:
          type: string
          nullable: true
          description: The webhook's own name at Discord, trimmed and at most 80 characters; null when Discord gave none.
        events:
          type: object
          properties:
            sim_finished: { type: boolean }
            upload_parsed: { type: boolean }
            upload_private:
              type: boolean
              description: A private report posts only when this and upload_parsed are both on.
        disabled_reason:
          type: string
          nullable: true
          enum: [failed five times, plan lapsed]
        last_error: { type: string, nullable: true }
        failures: { type: integer }
        source:
          type: string
          enum: [pasted, connected]
          description: How the webhook got here. A connected webhook has a null name.
        guild_id:
          type: string
          nullable: true
          description: The Discord server of the channel; null when Discord did not say.
    WeightsSpec:
      type: object
      description: Asks for stat weights instead of a DPS number.
      required: [stats, reference]
      properties:
        stats:
          type: array
          items: { type: string }
          description: >-
            Engine stat ids: the Stat enum names in lower snake case -
            attack_power, crit, spell_haste. There is no melee_crit or
            spell_crit; the engine carries one hit and one crit. A stat the
            engine does not have is refused rather than weighed as nothing.
        reference:
          type: string
          description: >-
            The stat normalised to exactly 1.0. It is required and must be one
            of stats: a reference that is not among the stats being weighed
            would normalise against a number nobody computed. The per-spec
            default is reference_stat on GET /v1/specs.
    SimRequest:
      type: object
      required: [engine_version, spec, source, character, encounter, iterations]
      properties:
        engine_version:
          type: string
          description: The short sha of the engine build, from sim/enginever.
        spec: { type: string, example: warrior-fury }
        source:
          type: object
          properties:
            kind: { type: string, enum: [armory, addon, build, fight, manual] }
            ref: { type: string }
            captured_at: { type: string, format: date-time }
        character:
          type: object
          required: [race, class, level]
          properties:
            name: { type: string }
            race: { type: string, example: orc }
            class: { type: string, example: warrior }
            level: { type: integer, maximum: 60 }
            talents:
              type: string
              description: The engine's own positional talent string.
            gear:
              type: array
              items: { $ref: '#/components/schemas/GearSlot' }
            buffs: { type: array, items: { type: string } }
            consumes: { type: array, items: { type: string } }
            professions: { type: array, items: { type: string } }
        encounter:
          type: object
          properties:
            duration_sec: { type: integer, default: 180, minimum: 60, maximum: 480 }
            variation: { type: number, default: 0.2 }
            targets: { type: integer, default: 1, minimum: 1, maximum: 10 }
            execute_ratio: { type: number, default: 0.25 }
            profile: { type: string }
        iterations: { type: integer, enum: [500, 3000, 10000] }
        random_seed: { type: integer, format: int64 }
        bulk:
          $ref: '#/components/schemas/BulkSpec'
          description: >-
            Turns one character into many sims. A request carrying it is a
            gear, talents or drops request, by bulk.mode; one carrying weights
            instead is a weights request; one carrying neither is a plain run.
            A request never names its own kind, and never carries both blocks.
        weights:
          $ref: '#/components/schemas/WeightsSpec'
          description: Asks for stat weights instead of a DPS number.
        role_metrics:
          type: boolean
          description: >-
            Asks a healer or tank spec's plain run for the figure its role is
            ranked on. A healer runs against the curated heal profile's fake
            raid for the profile's fixed fight (duration_sec and variation are
            replaced) and the result carries healing; a tank runs in the
            curated boss fight it always does and the result carries tank. A
            damage spec, a bulk request and a weights request refuse it.
    SimResult:
      type: object
      required: [engine_version, lane, dps, iterations_run]
      properties:
        sim_id: { type: string }
        engine_version: { type: string }
        request: { $ref: '#/components/schemas/SimRequest' }
        lane: { type: string, enum: [browser, server] }
        dps: { $ref: '#/components/schemas/Estimate' }
        iterations_run: { type: integer }
        duration_ms: { type: integer, format: int64 }
        summary:
          type: object
          description: The logs engine's per-fight summary, so the report components render a sim.
        error: { type: string }
        aborted: { type: boolean, description: "The run was stopped on request rather than failing; iterations_run is whatever completed. Never true on a saved result - POST /v1/sims refuses one." }
        combos:
          type: array
          items: { $ref: '#/components/schemas/Combo' }
          description: The ranked answer to a bulk request, best first.
        equipped:
          $ref: '#/components/schemas/Estimate'
          description: >-
            The base character at the FINAL stage, which is what every combo's
            delta is measured against. Absent, rather than zero, when there is
            no baseline.
        stages:
          type: array
          items: { $ref: '#/components/schemas/Stage' }
          description: >-
            What the planner actually ran, so the page can say "3 stages, 38
            combinations" without recomputing the ladder.
        weights:
          type: array
          items: { $ref: '#/components/schemas/StatWeight' }
          description: The answer to a weights request.
        sample:
          type: array
          items: { $ref: '#/components/schemas/SampleCast' }
          description: >-
            One iteration's casts in order - the median-DPS one. It is a table
            view of the cast log, not a guide.
        healing:
          $ref: '#/components/schemas/HealingResult'
        tank:
          $ref: '#/components/schemas/TankResult'
    HealingResult:
      type: object
      description: >-
        What a healer did against the heal profile's fake raid; present only
        when the request set role_metrics for a healer spec.
      required: [effective_hps, hps, mana_lasts_sec, hpm]
      properties:
        effective_hps:
          $ref: '#/components/schemas/Estimate'
          description: Healing that landed per second, the figure a healer is ranked on.
        hps:
          $ref: '#/components/schemas/Estimate'
          description: Healing per second including the overheal.
        mana_lasts_sec:
          type: number
          description: >-
            When the healer first ran out of mana; past the fight's length
            for a set that never did.
        hpm:
          type: number
          description: Effective healing per point of mana spent.
    TankResult:
      type: object
      description: >-
        What a tank took and made against the curated boss and the score made
        of it (sim/score); present only when the request set role_metrics for
        a tank spec.
      required: [dtps, tps, tmi, health, effective_health, chance_of_death, score]
      properties:
        dtps: { $ref: '#/components/schemas/Estimate' }
        tps: { $ref: '#/components/schemas/Estimate' }
        tmi: { $ref: '#/components/schemas/Estimate' }
        health: { type: number, description: The character's maximum health. }
        effective_health:
          type: number
          description: >-
            The hit points the boss's raw damage would take to kill the tank at
            the damage it actually takes.
        chance_of_death: { type: number }
        score:
          $ref: '#/components/schemas/Estimate'
          description: >-
            The tank score. A bulk-pooled run computes it after pooling the
            three measured terms, because it is nonlinear in them.
    Estimate:
      type: object
      description: A measured number and its spread.
      properties:
        mean: { type: number }
        stddev: { type: number }
        error: { type: number }
        min: { type: number }
        max: { type: number }
    Substitution:
      type: object
      description: One change from the base character.
      required: [kind]
      properties:
        kind: { type: string, enum: [item, talents, set, consumes] }
        slot:
          $ref: '#/components/schemas/GearSlotName'
          description: >-
            Where an item landed. A ring or a trinket says which of the two
            slots it took, because that is the answer the player acts on.
        item_id: { type: integer }
        enchant: { type: integer }
        suffix: { type: integer }
        name:
          type: string
          description: >-
            The item's, the loadout's or the set's name. An item's name is
            filled in from the engine's own item database, so a row read back
            years later still says what it was about. For a consumes
            substitution it is the consumable ids joined by ", ", or "no
            consumables" when the alternative list is empty.
        talents: { type: string }
        origin: { type: string, description: Copied from the candidate. }
        source_name:
          type: string
          description: Copied from the candidate; a Droptimizer headline reads it.
        consumes:
          type: array
          items: { type: string }
          description: The alternative consumable list this combination ran.
    Combo:
      type: object
      description: One substitution set's result.
      required: [substitutions, dps, delta, group]
      properties:
        substitutions: { type: array, items: { $ref: '#/components/schemas/Substitution' } }
        dps: { $ref: '#/components/schemas/Estimate' }
        delta:
          $ref: '#/components/schemas/Estimate'
          description: >-
            Against equipped, paired at the same stage, WITH ITS OWN ERROR -
            which is what lets the page say "within error" honestly instead of
            ranking noise.
        group:
          type: integer
          description: >-
            0 for the leader's within-error group, then 1, 2, and so on. Rows
            in one group are the same answer and are ranked the same.
    Stage:
      type: object
      description: One rung of the ladder, as run.
      required: [iterations, combos]
      properties:
        iterations: { type: integer }
        combos: { type: integer }
    StatWeight:
      type: object
      description: One stat's answer. The reference stat's weight is exactly 1.
      required: [stat, weight, error]
      properties:
        stat: { type: string }
        weight: { type: number }
        error: { type: number }
    SampleCast:
      type: object
      description: One cast of the sample iteration.
      required: [at_ms, action]
      properties:
        at_ms:
          type: integer
          format: int64
          description: >-
            Negative during the pre-pull, which the page renders as its own
            section.
        action:
          type: string
          description: >-
            The summary's action key - "spell:23881", "item:13503",
            "other:attack" - and not a display name; it is resolved to a name
            the same way a cast row is.
        target: { type: string }
        resources:
          type: object
          additionalProperties: { type: integer }
          description: >-
            What the player held AFTER the cast: rage, energy, mana,
            combo_points.
    SimRow:
      type: object
      properties:
        sim_id: { type: string }
        spec: { type: string }
        kind: { type: string, enum: [run, gear, talents, drops, weights] }
        dps: { type: number }
        headline:
          type: string
          maxLength: 120
          description: >-
            The one line the history list shows, composed when the result
            was written: "1,204 DPS", "+41 DPS from Vis'kag the
            Bloodletter", "3 upgrades on Ragnaros", "+18 DPS with 'Deep
            Fury'", "Crit 1.00 · Agility 0.87".
        state:
          type: string
          enum: [queued, running, done, error]
          description: >-
            The row's own state. A failed run has no headline to show, and
            without this the page could not tell that from a row whose headline
            is simply missing.
        engine_version: { type: string }
        created_at: { type: string, format: date-time }
        title: { type: string }
        lane: { type: string, enum: [server, browser], description: Where the run happened. }
        finished_at:
          type: string
          format: date-time
          description: When a server run reached done or error. Absent while it is queued or running, and for a browser save.
        failure_reason: { type: string, description: The plain sentence a failed run stopped with. Absent unless state is error. }
        seen: { type: boolean, description: Whether the owner has looked at the finished result. }
        estimate_seconds:
          type: integer
          description: >-
            How long a run of this spec usually takes: the median of the last
            ten finished server runs. Only on queued and running rows, and
            absent with fewer than three finished runs.
    SpecFidelity:
      type: object
      properties:
        spec: { type: string }
        reference_stat:
          type: string
          description: >-
            The stat the weights tool normalises to 1.0 for this spec, in
            the engine's own vocabulary (crit, attack_power, …). There is no
            melee_crit or spell_crit: the engine carries one hit and one
            crit.
        state: { type: string, enum: [validated, in_progress, unsupported] }
        median_gap: { type: number, nullable: true }
        parses: { type: integer }
        worst_actions:
          type: array
          items:
            type: object
            properties:
              spell_id:
                type: integer
                format: int64
                description: >-
                  The summary's row identity: the client spell id for a plain
                  spell, a reserved id above 2,000,000 for a tagged, item or
                  other action.
              name: { type: string }
              sim_casts: { type: number }
              actual_casts: { type: number }
        engine_version: { type: string }
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Null until the nightly job has measured this spec.
    CharacterIdentity:
      type: object
      description: >-
        Who the character is in game: the fields GET /v1/characters/{region}/{ruleset}/{name}
        adds to its character object. Each is always present and null when no source knows it.
        Never an id.
      required: [guild, level, race, realm]
      properties:
        guild:
          type: object
          nullable: true
          description: >-
            The character's verified guild membership (a guild_characters row with verified_at
            set). Null when it has none, or its membership is not verified yet.
          required: [name, rank]
          properties:
            name: { type: string }
            rank: { type: string, enum: [member, officer, leader] }
        level:
          type: integer
          nullable: true
          description: >-
            From the newest of the stored addon export (its level= section, dated by when it was
            captured in game) and the Battle.net import (dated by when it ran). When the newer
            source does not carry a level, the older one's stands; on a tie the Battle.net import
            wins, as does a stored level with no import date. Null when neither has one.
        race:
          type: string
          nullable: true
          description: >-
            The race's display name ("Night Elf"), chosen like level: the newest of the addon
            export (its race slug, named by the build data) and the Battle.net import. Null when
            neither has one.
        realm:
          type: string
          nullable: true
          description: >-
            The realm as the client names it, from the first source that has one: the Battle.net
            import's realm name, else the addon export's who= realm, else the realm half of the
            newest rated fight's logged unit (which the combat log writes without spaces, e.g.
            "ClassicBetaPvP"). The nightly data addon keys characters by the same order. Null
            when no source has one.
    ScorePoint:
      type: object
      description: >-
        One UTC date of score_history on GET /v1/characters/{region}/{ruleset}/{name}: the
        Forever Score the rater recorded on the last rated fight of that date. The list has one
        point per date on which a rated fight in a public, unflagged report landed, the newest 30 dates,
        oldest first; [] when there is none. Fights rated before the score's snapshot existed
        (migration 0035), or re-rated by the backfill, carry no snapshot and are left out.
      required: [date, score, tier]
      properties:
        date: { type: string, format: date, description: "The UTC date, YYYY-MM-DD." }
        score: { type: integer }
        tier: { type: string, enum: [common, uncommon, rare, epic, legendary] }
    CharacterGear:
      type: object
      description: >-
        The gear panel fields of GET /v1/characters/{region}/{ruleset}/{name}, beside the
        Forever Score. The spec is the newest rated fight's in a public report, else the one the
        export's talents name (gear_spec, gear_spec_source); the level is the export's level=
        section (60 when it has none), and the band that level falls in (the highest of 20, 30,
        40, 50 and 60 at or below it that the spec has a best-in-slot set for).
      required: [gear, gear_gap_total, gear_spec, gear_spec_source]
      properties:
        gear:
          type: array
          items: { $ref: '#/components/schemas/CharacterGearSlot' }
          description: >-
            One row per slot an addon export names, always all 17 in the export's order (head,
            neck, shoulder, back, chest, wrist, hands, waist, legs, feet, finger1, finger2,
            trinket1, trinket2, main_hand, off_hand, ranged) when the character has an export;
            [] when it has none (never null).
        gear_spec:
          type: string
          nullable: true
          description: >-
            The spec the gear picks are for, the site's slug ("warrior-fury"): the spec of the
            newest rated fight, else the one the export's talents name, else (no points spent) the
            class's first spec. Null when the character has no export or the data knows no spec.
        gear_spec_source:
          type: string
          nullable: true
          enum: [fight, talents, default]
          description: Where gear_spec came from; null exactly when gear_spec is.
        gear_gap_total:
          type: number
          nullable: true
          description: >-
            The score points the band's picks would add over what the character wears, summed
            over the slots: the plain sum of every non-null gap, one decimal. It is not the Gear
            component's distance to its top, which is measured against the best set of the band
            across presets and factions (so a character wearing every pick can have a total of 0
            and a Gear component still below 500). Null when no slot has a gap (no export, or
            nothing could be scored).
    CharacterGearSlot:
      type: object
      description: >-
        One slot of the gear panel. Nothing is invented: a pick the data does not have is null,
        and a gap that cannot be scored is null.
      required: [slot, worn, pick, gap]
      properties:
        slot: { $ref: '#/components/schemas/GearSlotName' }
        worn:
          type: object
          nullable: true
          description: >-
            The item the character wears in the slot, from its newest addon export. Null when
            the slot is empty in the export.
          required: [id, name, item_level]
          properties:
            id: { type: integer }
            name: { type: string, nullable: true, description: "Null when the export's data build does not have the item." }
            item_level: { type: integer, nullable: true, description: "Null when the export's data build does not have the item." }
        pick:
          type: object
          nullable: true
          description: >-
            The band's best-in-slot pick for the spec and the character's faction (from the
            export's race, else the faction the Battle.net import stored), as the Forever Sixty
            Data addon ships it: the leveling-bis ladder's pick for the band without raid buffs,
            except that an item whose stats the client has not confirmed is never a pick. Every
            slot whose own pick is confirmed keeps it; each other slot takes the next confirmed
            candidate in the ladder's order that the band's rules allow beside them: the two
            slots of a pair (the rings, the trinkets, the two hands) never hold the same item
            (the same id or the same name), and there is no off-hand pick beside a two-handed
            main-hand pick. Null when the band has no pick for the slot, the character has no
            rated spec or is below level 20, or its faction or the spec's best-in-slot data is
            unknown.
          required: [id, name, source, chance]
          properties:
            id: { type: integer }
            name: { type: string }
            source:
              type: string
              description: >-
                Where the item comes from, as a player knows it: "Wailing Caverns: Mutanus the
                Devourer", "Blacksmithing", "The League of Arathor".
            chance:
              type: number
              nullable: true
              description: >-
                The drop chance as a fraction (0.333333 is one in three), at the pick's own
                source; a pick promoted past an item the client has not confirmed carries the
                chance of its own source. Null when the source states no rate (every
                quest, vendor, crafted, reputation and PvP source, and a drop whose loot table
                gives none).
        gap:
          type: number
          nullable: true
          description: >-
            The Gear component points the pick would add over the worn item, one decimal: 500 x
            (the pick's gear score - the worn item's gear score) / the band's best set's gear
            score, each item scored by the spec's stat weights as the Gear component scores it.
            An empty slot scores 0. 0 when the worn item is the pick or scores at least as much;
            an upgrade worth under 0.05 points also rounds to 0. The rings and the trinkets are
            matched to their picks whichever way round gives the smaller total, so a pick worn
            in the other slot of its pair reads 0. When the picked or the worn main hand is
            two-handed, the two hands count as one unit: the main hand's gap is the picked main
            and off hands' score less the worn main and off hands' score (0 at least), and the
            off hand's gap is 0, or null when the band has no off-hand pick. Null when there is
            no pick, when an item is not in the data build, or when the band's best set cannot
            be scored.
    ExecutionScore:
      type: number
      nullable: true
      description: >-
        execution_score on ranking rows, on a character's best and history rows, and on the
        guild page's roster_best rows (GET /v1/guilds/{region}/{ruleset}/{name}): the
        fight's damage as a share of what the same gear and talents do in the simulator over
        the same fight length (1 is the simulator's average; a lucky pull can pass it, and the
        stored value is kept between 0 and 2). Damage only. Null while the fight has not been
        simulated yet (the score is written after the fight closes, or by the nightly job), and
        null for good for healers and tanks, for a spec the simulator has not validated, for a
        fight whose summary has no row for the player, for a fight whose character the
        simulator could not rebuild from the log, and when the simulation produced no damage.
    GuildAttendance:
      type: object
      description: >-
        A guild roster row's attendance (roster[].attendance and pending[].attendance on GET
        /v1/guilds/{id}/home, candidates[].attendance on GET /v1/guilds/{id}/loot). A character
        was present in a report when it has a ranked or rated row there (fight_metrics not
        removed, or rating_scores), read by its character key, never by the log's GUIDs
        (fights.players). The window is the guild's last 8 non-private, unflagged reports that
        carry at least one ranked or rated row, so a night nobody can be present in (a
        private, tampered, unverified or trash-only report, or one not ranked yet) is never
        everyone's absence.
      properties:
        present: { type: integer, description: "How many of the window's reports the character was present in, 0 to nights; a report with several of its fights counts once." }
        nights: { type: integer, description: "How many reports the window holds: 8, or fewer while the guild has logged fewer such reports. The same for every row of the roster." }
    GuildRosterAddon:
      type: object
      nullable: true
      description: >-
        A guild roster row's line from the guild's newest addon roster snapshot (roster[].addon
        and pending[].addon on GET /v1/guilds/{id}/home; the snapshot is the outbox's
        roster_snapshot of POST /v1/addon/exports, docs/contracts/addon-v2.md contract 4).
        Always present, null when the guild has no snapshot or the newest one does not carry
        the character. A snapshot line is matched to a row by character name, any case: the
        snapshot's names carry no realm (a Name-Realm line drops its realm half), so the
        guild's realm is the row's; the first line of a name wins. level, spec, gear_gap and build
        are null unless the row's member gave gear consent (the home withholds spec and gear for
        a roster-consent member); seen_at and snapshot_at stay.
      required: [level, spec, gear_gap, build, seen_at, snapshot_at]
      properties:
        level: { type: integer, nullable: true, description: "The level the member's addon announced; null without gear consent" }
        spec: { type: string, nullable: true, description: "A spec slug, e.g. warrior-arms; null without gear consent" }
        gear_gap: { type: integer, nullable: true, description: "The gear gap the member's addon announced (contract 2's hello); may be negative; null without gear consent" }
        build: { type: string, nullable: true, description: "The build name the member's addon announced; null when it announced none or without gear consent" }
        seen_at: { type: string, description: "The sender's local time, YYYY-MM-DD HH:MM, as stored" }
        snapshot_at: { type: string, format: date-time, description: "When the site received the snapshot (addon_snapshot.received_at), RFC 3339 UTC" }
    GuildAddonSnapshot:
      type: object
      nullable: true
      description: >-
        addon_snapshot on GET /v1/guilds/{id}/home: the guild's newest addon roster snapshot,
        null when it has none. The newest snapshot wins even when it lists nobody (members is
        then 0 and every roster[].addon is null).
      required: [received_at, by_character, members]
      properties:
        received_at: { type: string, format: date-time, description: "When the site received the snapshot, RFC 3339 UTC" }
        by_character: { type: string, description: "The character key whose export carried the snapshot" }
        members: { type: integer, description: "How many member lines the snapshot listed, those matching no roster row included (they never become rows)" }
    ForeverScore:
      type: object
      description: >-
        The Forever Score fields of GET /v1/characters/{region}/{ruleset}/{name}. Every field
        is null when the character has no rated fight in a public, unflagged report (an
        anonymised character's page answers 404). The components sum to score; the ceilings
        are gear 500, experience 700, parses 600, attendance 200, discipline 100
        (api/internal/rating/score_v2.go). A report flagged as tampered or unverified counts
        for nothing: no component, as_of or experience figure reads it, so a forged report
        cannot raise a score.
      properties:
        score: { type: integer, nullable: true }
        tier:
          type: string
          nullable: true
          enum: [common, uncommon, rare, epic, legendary, null]
          description: "common < 500, uncommon < 1000, rare < 1500, epic < 2000, legendary from 2000 (provisional)."
        as_of:
          type: string
          format: date
          nullable: true
          description: The newest rated fight's date (YYYY-MM-DD).
        components:
          type: object
          nullable: true
          properties:
            gear: { type: integer, description: "The gear component in points, 0-500, comparable across specs: the character's gear score for its spec as a share of that spec's own best-in-slot set for your level (the highest best-in-slot band at or below the character's level, 20 to 60; below 20 there is none and the component is 0) in the same data build. This is contract 5's gear_score." }
            experience: { type: integer, description: "25 a distinct dungeon cleared + 40 a distinct raid boss killed across linked characters, capped at 700." }
            parses: { type: integer, description: "Mean best parse percentile per boss, scaled 0-600." }
            attendance: { type: integer, description: "The attendance component in points, 0-200: the fraction of the verified guild's nights (UTC dates of its fights) in the last 90 days attended, times 200. Contract 5's attendance is that fraction itself, 0-1." }
            discipline: { type: integer, description: "Share of rated fights with a flask, a food and every enchantable slot (chest, feet, back, main hand) enchanted, times 100." }
        experience:
          type: object
          nullable: true
          properties:
            dungeons: { type: integer, description: "Distinct dungeon instances cleared; 0 until dungeon logs are classified." }
            raid_kills: { type: integer, description: Distinct raid bosses killed by any linked character. }
            alts: { type: integer, description: Linked characters other than this one. }
    User:
      type: object
      required: [id, role, anonymize, premium]
      properties:
        id: { type: integer, format: int64 }
        battletag: { type: string, nullable: true }
        email: { type: string, nullable: true, description: Shown only to the account itself. }
        role: { type: string }
        anonymize: { type: boolean }
        premium:
          type: boolean
          description: >-
            Whether this account may run sims on our servers. Set by hand until
            payments exist; the web reads it to decide whether to offer the
            server lane at all.
  responses:
    NotFound:
      description: "Unmatched routes return the envelope with code not_found"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
paths:
  /health:
    get:
      summary: Liveness
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
  /version:
    get:
      summary: Build version
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
  /v1/subscribe:
    post:
      summary: Start a double opt-in subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: "Accepted regardless of whether the address is already known"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '400':
          description: "Malformed or missing JSON body, or invalid email address. When email is invalid, error.fields.email is set."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '429':
          description: "Rate limited: 10 requests per minute per IP on this route, 120 per minute per IP overall"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '500':
          description: "Unexpected store error; envelope with code internal. Mail is sent asynchronously after the response, so this is never a mail-provider failure."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
  /v1/subscribe/confirm:
    get:
      summary: Confirm a subscription
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: "Redirect to configured public site base URL + /subscribed (success) or /subscribe-invalid (invalid token)"
  /v1/subscribe/unsubscribe:
    get:
      summary: Unsubscribe
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: "Redirect to configured public site base URL + /unsubscribed (success) or /subscribe-invalid (invalid token)"
  /v1/builds:
    post:
      summary: Save a build
      description: >-
        The id is the first eight characters of the lowercase base32 SHA-256 of the canonical JSON of
        class_id, gear, point_order, race_id, and tree_version, so saving the same build twice returns
        the same id and the first title wins.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BuildInput' }
      responses:
        '201':
          description: "Saved. data is { id, url } where url is PUBLIC_BASE_URL + /b/ + id."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '200':
          description: "That build was already saved; data is the same { id, url }."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '400':
          description: >-
            Body was not JSON or was larger than 8 KB, or the build breaks a talent rule. In the latter
            case error.fields carries one message per offending field, keyed class_id, race_id,
            tree_version, title, point_order, point_order[i], or gear.<slot>.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '429':
          description: "Rate limited: 20 saves per IP per hour, and 120 requests per minute per IP overall"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '500':
          description: "Unexpected store error; envelope with code internal"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
    get:
      summary: The caller's own saved builds
      operationId: listMyBuilds
      parameters:
        - { name: mine, in: query, required: true, schema: { type: string, enum: ['1'] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: One page of the caller's builds, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          rows:
                            type: array
                            items: { $ref: '#/components/schemas/Build' }
                          total: { type: integer }
                          page: { type: integer }
                          per_page: { type: integer, example: 100 }
        '400': { description: This list is mine=1 only }
        '401': { description: Sign in first }
  /v1/builds/{id}:
    get:
      summary: Fetch a build record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: "The record, in the envelope's data. Cache-Control: public, max-age=86400"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '404':
          description: "Unknown id; envelope with code not_found"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '500':
          description: "Unexpected store error; envelope with code internal"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
  /b/{id}:
    get:
      summary: The shared build page
      description: >-
        Server-rendered HTML carrying the site's header and footer, Open Graph and Twitter card tags,
        a canonical link to https://foreversixty.gg/b/{id}, and the record inlined on the planner
        island's mount point. Proxied from foreversixty.gg/b/* by the site's Worker.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: "The build page"
          content:
            text/html:
              schema: { type: string }
        '404':
          description: "A plain page with a link to the planner"
          content:
            text/html:
              schema: { type: string }
        '500':
          description: >-
            The build could not be loaded or the page could not be rendered. A plain page titled
            "Build unavailable", served with Cache-Control: no-store.
          content:
            text/html:
              schema: { type: string }
  /b/{id}/card.png:
    get:
      summary: The build's preview card
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: >-
            1200x630 PNG. Cache-Control: public, max-age=604800. A build whose card cannot be drawn
            gets the static fallback card here too, with a short cache (Cache-Control: public,
            max-age=300) rather than the week-long one.
          content:
            image/png:
              schema: { type: string, format: binary }
        '404':
          description: "Unknown id; the fallback card with a short cache (Cache-Control: public, max-age=300)"
          content:
            image/png:
              schema: { type: string, format: binary }
        '500':
          description: "Store failure while loading the build; the fallback card with a short cache (Cache-Control: public, max-age=300)"
          content:
            image/png:
              schema: { type: string, format: binary }
  /v1/auth/battlenet/start:
    get:
      summary: Begin Battle.net sign-in
      description: "Sets a ten-minute state cookie and redirects to oauth.battle.net with scope openid wow.profile. Registered only when BNET_CLIENT_ID, BNET_CLIENT_SECRET and BNET_REDIRECT_URL are all set."
      parameters:
        - name: next
          in: query
          schema: { type: string, default: /logs }
          description: "A path on foreversixty.gg to return to; anything else falls back to /logs"
      responses:
        '302': { description: "Redirect to Battle.net" }
  /v1/auth/battlenet/callback:
    get:
      summary: Finish Battle.net sign-in
      responses:
        '302': { description: "Session created; redirect to the site" }
        '400':
          description: "Missing or mismatched state, or no code"
          content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } }
        '502':
          description: "Battle.net could not confirm the sign-in"
          content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } }
  /v1/auth/email:
    post:
      summary: Send a magic link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        '202': { description: "Link sent", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '400': { description: "Not an address; error.fields.email is set", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '429': { description: "Five links per address per hour, twenty per IP per hour", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/auth/email/callback:
    get:
      summary: Spend a magic link
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        '302': { description: "Session created; redirect to the site" }
        '400': { description: "Used or expired link", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/auth/logout:
    post:
      summary: Sign out
      responses:
        '200': { description: "Signed out", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/sessions:
    delete:
      summary: Sign out (session; the account page's own route for POST /v1/auth/logout)
      responses:
        '204': { description: "Signed out; both cookies cleared" }
  /v1/me:
    get:
      summary: The signed-in account, its characters and its guilds
      description: >-
        Each character's build (present whenever addon_exports has a row for it, source
        "addon" or "blizzard") decodes its stored FS1 export string and adds, whenever the
        string actually carries the fact: gear (export slot name -> item id, exactly the
        slot names the export uses -- head, neck, shoulder, back, chest, wrist, hands,
        waist, legs, feet, finger1, finger2, trinket1, trinket2, main_hand, off_hand,
        ranged), talents ({ trees: the three per-tree rank strings in tree order exactly as
        the export carries them, points: each tree's digit-sum total }), level and
        data_build. A character also gains, filled from the same decode only where
        Battle.net has not already set them (Battle.net always wins): level, race (display
        name), faction and realm. spec is the character's primary talent tree by points
        (the tree with strictly the most) -- omitted on a tie, when no points are spent, or
        whenever any of the above cannot be read. A malformed or out-of-date export never
        fails this route; it simply leaves every one of these fields absent.


        Each guilds[] entry carries can: the list of words (approve, remove, settings, award,
        billing, release) naming what the account may do in that guild, from the one rule in
        api/internal/guilds/capabilities.go. approve, remove, settings and award belong to a
        verified officer or leader; billing and release belong to the account holding the
        guild's claim (an officer is not a second guild master), and a moderator gets remove,
        settings and release. It is [] for a plain member.


        A build also always carries two nullable sync-history fields, read from the
        character_syncs history (one row per addon export, Battle.net import or refresh;
        never a stored value). median_sync_gap_sec is the median gap in whole seconds
        between the character's successive syncs, null with fewer than three on record.
        sync_error is a short machine code for the last failed Battle.net refresh
        ("bnet_refresh_failed"), null when the last refresh succeeded or none has run; an
        addon export does not clear it.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: '#/components/schemas/User' }
                          finished_sims:
                            type: array
                            description: >-
                              Unseen finished server runs, newest first, at most three. Always
                              present; [] unless the caller holds the server_sims entitlement.
                            items:
                              type: object
                              properties:
                                sim_id: { type: string }
                                spec: { type: string }
                                title: { type: string }
                                dps: { type: number }
                                finished_at: { type: string, format: date-time }
                          server_sims:
                            type: object
                            description: Omitted when the server has no sims store configured.
                            properties:
                              runs_this_month: { type: integer }
                          notifications:
                            type: object
                            description: Omitted when the deployment has notifications off.
                            properties:
                              connect:
                                type: boolean
                                description: True when the one-click Discord connect is configured.
                              discord:
                                nullable: true
                                allOf: [{ $ref: '#/components/schemas/DiscordBlock' }]
        '401': { description: "Not signed in", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
    patch:
      summary: Set the read-time pseudonym flag
      description: >-
        anonymize replaces your name on report pages: the owner of a report you posted reads as
        "user-<id>" instead of your battletag, for every reader of every report you own.
        It does not touch ranking rows. A row in /v1/rankings, on a character page or on a
        guild page still carries the character name you logged under, both as player.name and
        inside player.key, because the key is the character's identity: the leaderboard filters,
        the character page and the links between them are all keyed on it. Separately and
        regardless of the flag, no route shows your email address to anyone but you.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [anonymize]
              properties: { anonymize: { type: boolean } }
      responses:
        '200': { description: "The account as it now stands", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '400': { description: "Nothing to change", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/auth/app/start:
    get:
      summary: Start a native app sign-in (dark unless APP_SIGN_IN=true; 60 per hour per IP)
      description: Opened in the system browser. Records the PKCE challenge, platform and the app's state, then redirects to Battle.net through the site's own start. The Battle.net callback answers an app flow with a 302 to https://foreversixty.gg/app/auth?code=<one-time code>&state=<the app's state> and sets no web session. The code is single use and lives two minutes.
      parameters:
        - { name: platform, in: query, required: true, schema: { type: string, enum: [ios, android] } }
        - { name: code_challenge, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
        - { name: state, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z0-9._~-]{16,128}$' } }
      responses:
        '302': { description: "To Battle.net" }
        '400': { description: "invalid, with error.fields naming each bad parameter", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '429': { description: "Too many starts from this address", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/auth/app/exchange:
    post:
      summary: Swap the one-time code and the PKCE verifier for a device token (dark unless APP_SIGN_IN=true; 60 per hour per IP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, code_verifier]
              properties:
                code: { type: string }
                code_verifier: { type: string, pattern: '^[A-Za-z0-9._~-]{43,128}$' }
                device_name: { type: string, maxLength: 60 }
      responses:
        '201': { description: "token (shown once), device {id, name, platform}, me (the GET /v1/me body)", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '400': { description: "invalid (bad body) or invalid_grant (unknown, spent, expired or wrong verifier; the code is spent by any attempt)", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '429': { description: "Too many exchanges from this address", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/auth/app/logout:
    post:
      summary: The calling app's Sign out; revokes its device (dark unless APP_SIGN_IN=true)
      responses:
        '200': { description: "signed_out true", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '401': { description: "Not a device token, or the token is already dead", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/devices/pair:
    post:
      summary: Issue a pairing code (session only)
      responses:
        '200': { description: "A code valid ten minutes", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '401': { description: "Not signed in on the site", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/devices/claim:
    post:
      summary: Claim a pairing code (the companion; no identity yet)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
                name: { type: string }
                platform: { type: string }
      responses:
        '201': { description: "device_id, the token (shown once) and account_label", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '404': { description: "Unknown, spent, or expired code", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/devices/connect:
    post:
      summary: Start a companion connect (no identity yet; claim rate limit per IP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                platform: { type: string }
      responses:
        '201': { description: "connect_id, user_code (KQ4-7TM), url, expires_in 600, interval 2", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '429': { description: "Too many connects from this address", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/devices/connect/{connect_id}:
    get:
      summary: Poll a connect (the id is the secret; not rate limited)
      parameters: [ { name: connect_id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: "status pending, denied or expired; or approved with device_id, token and account_label, once", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '404': { description: "Unknown id", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '410': { description: "data.status is used: the approved answer was already collected", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/devices/connect/lookup:
    get:
      summary: What a connect code is for (session only)
      parameters: [ { name: code, in: query, required: true, schema: { type: string } } ]
      responses:
        '200': { description: "name, platform, expires_in", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '404': { description: "Unknown, expired or decided code", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/devices/connect/approve:
    post:
      summary: Approve a connect code for the signed-in account (session only)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } }
      responses:
        '200': { description: "name and platform of the device that will be created", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '404': { description: "Unknown or expired code", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '409': { description: "Already decided", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/devices/connect/deny:
    post:
      summary: Deny a connect code (session only)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } }
      responses:
        '204': { description: "Denied" }
        '404': { description: "Unknown or expired code", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '409': { description: "Already decided", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/devices:
    get:
      summary: The account's devices
      description: Session or app token. Each device carries kind, companion or app (a native app signed in through /v1/auth/app); an app's platform is ios or android.
      responses:
        '200':
          description: "data is the device array itself, with no wrapper object: id, name, platform, kind, created_at, last_seen_at"
          content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } }
  /v1/devices/self:
    delete:
      summary: The calling device revokes itself (the companion's Forget)
      description: Device bearer token. A token that is already revoked answers 401, which the companion treats as done.
      responses:
        '204': { description: "Revoked" }
        '401': { description: "Not a device token, or the token is already dead", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/devices/{id}:
    delete:
      summary: Revoke a device
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '204': { description: "Revoked" }
        '404': { description: "Not one of yours", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/reports:
    get:
      summary: The caller's own reports, newest first (session)
      parameters:
        - { name: mine, in: query, required: true, schema: { type: string, enum: ["1"] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: "rows, total, page, per_page (100). Each row carries id, title, zone, status, visibility, created_at, fight_count, kill_count and boss_count (distinct bosses killed), plus logging_character ({key, name} or null), last_upload_at and heartbeat_at, each as GET /v1/reports/{id} answers them (last_upload_at is never null here; heartbeat_at is null before the first beat)."
          content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } }
        '400': { description: "mine=1 is required", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
    post:
      summary: Start a report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visibility]
              properties:
                title: { type: string }
                visibility: { type: string, enum: [public, unlisted, private, guild] }
                zone: { type: string }
                logging_character:
                  type: object
                  properties:
                    region: { type: string, enum: [us, eu, kr, tw, cn] }
                    ruleset: { type: string, enum: [normal, pvp, rp, hardcore] }
                    name: { type: string }
      responses:
        '201': { description: "id and created_at", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '400': { description: "Bad visibility or character", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '401': { description: "No identity", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/reports/{id}:
    get:
      summary: A report and its fights
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Report' } }
        '404': { description: "Unknown, or not visible to you", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
    patch:
      summary: Change a report's title, visibility, guild, or logging character
      description: >-
        logging_character is validated as on create (region us/eu/kr/tw/cn, ruleset
        normal/pvp/rp/hardcore) and answers 400 otherwise. The companion sets it once, after
        the report exists, when it has read who is logging from the combat log and the addon
        record that names the character arrives late. Fights ingested before the change keep
        the region and ruleset they were keyed under.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                visibility: { type: string, enum: [public, unlisted, private, guild] }
                guild_id: { type: integer, format: int64 }
                logging_character:
                  type: object
                  properties:
                    region: { type: string }
                    ruleset: { type: string }
                    name: { type: string }
      responses:
        '200': { description: "The report as it now stands", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '403': { description: "Not the owner, a guild officer, or a moderator", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/reports/{id}/heartbeat:
    post:
      summary: The companion says it is still tailing the report
      description: >-
        Device bearer only; no body. Records heartbeat_at, which GET /v1/reports/{id} answers.
        Limited to one a minute per device. A report that is not the calling device's account's
        answers 404.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '204': { description: "Recorded" }
        '401': { description: "Not a device bearer", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '404': { description: "Unknown report, or not yours", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '429': { description: "More than one a minute from this device", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/reports/{id}/visibility:
    get:
      summary: A report's visibility, for the site Worker
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: "Cache-Control: public, max-age=60", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/reports/{id}/access:
    get:
      summary: A base URL for a report the Worker will not serve
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: "data_base_url and expires_in", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '404': { description: "Unknown, or not visible to you", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/reports/{id}/files/{path}:
    get:
      summary: One of a report's files, as a signed redirect
      description: >-
        Only report.json and fights/<n>/{summary.json,events.parquet,live.json} are reachable;
        raw chunks never are. Always registered, unlike the ingest and upload routes below:
        without R2 configured it answers 503 rather than being unmounted, because a route that
        exists but cannot serve is a better answer than a bare 404 for something that never
        existed.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: path, in: path, required: true, schema: { type: string } }
      responses:
        '302': { description: "Redirect to a signed R2 URL valid ten minutes" }
        '404': { description: "Unknown report or file", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '503': { description: "R2 is not configured on this deployment; error.code unavailable", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/reports/{id}/fights/{n}:
    put:
      summary: Store one closed fight (device)
      description: >-
        multipart/form-data with summary (summary.Summary JSON), events (Parquet), metrics
        ([]MetricsRow JSON) and raw_range ({start_offset, end_offset, sha256}). Offsets are
        report-relative. The API rebuilds the metrics from the events and compares. Registered
        only when R2 is configured (R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
        R2_BUCKET are all set); without it this route, and every other ingest route below, is
        not mounted at all.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: n, in: path, required: true, schema: { type: integer } }
      responses:
        '201': { description: "Stored and verified", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '200': { description: "Already stored with the same raw hash", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '409': { description: "The metrics do not match the events; error.fields.metrics says how", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/reports/{id}/fights/{n}/ratings:
    get:
      summary: One fight's rating cards
      description: >-
        Every player's rating card for fight n (counted from one), an anonymized player's card
        left out. Visibility follows the report's own rules: a report the caller may not open
        answers 404 not_found, as a missing one does. A flagged report (tampered or unverified)
        is evidence of nothing, so its fights answer 404 with error code "flagged" to a caller
        who may open the report.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: n, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: "fight_index, kill, kill_time_band, model_version and players", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '400': { description: "n is not a number counted from one", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '404': { description: "not_found (no such report, not visible to you, or no ratings for that fight) or flagged (the report is flagged)", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/reports/{id}/fights/{n}/live:
    put:
      summary: The running summary of a fight in progress (device)
      description: "Registered only when R2 is configured; see PUT /v1/reports/{id}/fights/{n}."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: n, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                summary: { type: object }
                elapsed_ms: { type: integer, format: int64 }
                updated_at: { type: string, format: date-time }
      responses:
        '204': { description: "live.json written and report.json touched" }
  /v1/reports/{id}/raw:
    put:
      summary: One compressed raw chunk (device)
      description: >-
        Body is application/zstd, at most 8 MiB. X-Raw-SHA256 is the hex SHA-256 of the decoded
        bytes. Offsets are report-relative and chunk boundaries are multiples of 4 MiB of decoded
        log. Registered only when R2 is configured; see PUT /v1/reports/{id}/fights/{n}.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: offset, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: "Stored" }
        '200': { description: "Already stored with the same hash" }
        '400': { description: "Not zstd, or does not hash to X-Raw-SHA256", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '409': { description: "The range overlaps a different stored range", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/reports/{id}/complete:
    post:
      summary: Finish a live report (device)
      description: "Registered only when R2 is configured; see PUT /v1/reports/{id}/fights/{n}."
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                final_offset: { type: integer, format: int64 }
                engine_version: { type: string }
                health: { type: object }
      responses:
        '204': { description: "Complete; the raw-sample check is scheduled" }
  /v1/uploads:
    post:
      summary: Start a whole-file upload (session)
      description: >-
        Registered only when R2 is configured and the Cloud Run parse job can be reached at
        startup; without either, whole-file uploads are not offered and the ingest above (which
        needs only R2) is what a companion uses instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [size_bytes]
              properties:
                size_bytes: { type: integer, format: int64, maximum: 4294967296 }
                filename: { type: string }
      responses:
        '201': { description: "upload_id, signed 64 MiB parts valid an hour, and complete_url", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/uploads/{upload_id}/complete:
    post:
      summary: Finish an upload and start the parse job (session)
      description: "Registered only when R2 is configured and the parse job can be reached; see POST /v1/uploads."
      parameters: [ { name: upload_id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [etags]
              properties:
                etags:
                  type: array
                  items:
                    type: object
                    properties: { number: { type: integer }, etag: { type: string } }
                title: { type: string }
                visibility: { type: string, enum: [public, unlisted, private, guild] }
      responses:
        '202': { description: "report_id; the parse job has been started", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '502': { description: "Stored, but the parse job could not be started", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/rankings:
    get:
      summary: A leaderboard page
      parameters:
        - name: encounter
          in: query
          required: true
          schema: { type: string }
          description: "The numeric encounter id, or the slug /rankings/<encounter-slug> uses (the encounter name lowercased with spaces as -)"
        - { name: difficulty, in: query, schema: { type: integer } }
        - { name: metric, in: query, schema: { type: string, enum: [dps, hps, damage_taken, execution], default: dps }, description: "execution has no percentile equivalent (see /v1/rankings/percentile)" }
        - { name: spec, in: query, schema: { type: string } }
        - { name: class, in: query, schema: { type: string } }
        - { name: phase, in: query, schema: { type: string, enum: [pre-beta, beta, launch, raids-1] } }
        - { name: region, in: query, schema: { type: string, enum: [us, eu, kr, tw, cn] } }
        - { name: ruleset, in: query, schema: { type: string, enum: [normal, pvp, rp, hardcore] } }
        - { name: faction, in: query, schema: { type: string, enum: [alliance, horde] } }
        - { name: since, in: query, schema: { type: string, example: "today" } }
        - { name: distinct, in: query, schema: { type: string, enum: [character] }, description: "character ranks each character's best kill only, so total counts characters and the response carries deduped: true" }
        - { name: character, in: query, schema: { type: string, example: "us/normal/obnoxious yell" }, description: "A player key (region/ruleset/name). Needs distinct=character. Adds character_rank to the response" }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: "Cache-Control: public, max-age=30"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          rows: { type: array, items: { $ref: '#/components/schemas/RankingRow' } }
                          total: { type: integer }
                          page: { type: integer }
                          per_page: { type: integer, enum: [100] }
                          updated_at: { type: string, format: date-time }
                          deduped: { type: boolean, description: "True when each row is a different character's best kill (distinct=character)" }
                          character_rank:
                            type: object
                            description: "Where the requested character stands on this filtered board, with its best kill; absent when none was asked for or it has no ranked kill in the cohort"
                            properties:
                              rank: { type: integer }
                              row: { $ref: '#/components/schemas/RankingRow' }
  /v1/rankings/percentile:
    get:
      summary: Where one value stands in its bracket
      parameters:
        - { name: encounter, in: query, required: true, schema: { type: string }, description: "Encounter id or slug" }
        - { name: difficulty, in: query, required: true, schema: { type: integer } }
        - { name: spec, in: query, schema: { type: string } }
        - { name: phase, in: query, schema: { type: string } }
        - { name: metric, in: query, schema: { type: string, enum: [dps, hps, damage_taken] } }
        - { name: value, in: query, required: true, schema: { type: number } }
      responses:
        '200': { description: "percentile, 0 to 100", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '404': { description: "Nothing ranked in that bracket yet", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/rankings/guilds:
    get:
      summary: A guild leaderboard
      parameters:
        - { name: encounter, in: query, schema: { type: string }, description: "Encounter id or slug; required for speed and execution" }
        - { name: kind, in: query, schema: { type: string, enum: [speed, execution, progress], default: speed } }
        - { name: phase, in: query, schema: { type: string } }
      responses:
        '200': { description: "rows", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/sims:
    post:
      summary: Save a browser-run sim result
      operationId: saveSim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SimResult'
                - type: object
                  properties:
                    title: { type: string, maxLength: 120 }
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sim_id: { type: string, minLength: 12, maxLength: 12 }
        '400': { description: The body is not a runnable browser result }
    get:
      summary: The caller's own saved sims
      operationId: listMySims
      parameters:
        - { name: mine, in: query, required: true, schema: { type: string, enum: ['1'] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - name: kind
          in: query
          schema: { type: string, enum: [run, gear, talents, drops, weights] }
          description: Narrows the list to one tool. Omitted or empty is every kind; an unknown value is 400.
        - name: lane
          in: query
          schema: { type: string, enum: [server, browser] }
          description: >-
            Narrows the list to runs made on our servers or saved from the
            browser. Omitted or empty is both; an unknown value is 400. Queued
            and running rows carry estimate_seconds.
      responses:
        '200':
          description: One page of the caller's sims
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          rows:
                            type: array
                            items: { $ref: '#/components/schemas/SimRow' }
                          total: { type: integer }
                          page: { type: integer }
                          per_page: { type: integer, example: 100 }
        '401': { description: Sign in first }
  /v1/sims/run:
    post:
      summary: Run a sim on our servers (premium)
      operationId: runSim
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimRequest' }
      responses:
        '202':
          description: Dispatched
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sim_id: { type: string }
        '400':
          description: >-
            The request cannot be run. error.code is "invalid" for a
            malformed envelope, "cap_exceeded" when the expansion is past
            the server lane's cap (error.fields carries cap and
            combinations as decimal strings), or "too_large" when the
            planner estimates the run past the job's budget (error.fields
            carries estimate_sec and budget_sec, also as decimal strings).
        '401': { description: Sign in first }
        '402': { description: 'premium_required: running on our servers is a premium feature' }
        '502': { description: The run was recorded but could not be started }
  /v1/notifications/discord:
    put:
      summary: Save the Discord webhook or its events (premium)
      operationId: putDiscordWebhook
      description: >-
        webhook_url is required when nothing is saved or when replacing, and omitted for an
        events-only change. A new URL is checked against Discord once (5 s) and its channel id
        stored; the URL is sealed and never returned. Limited to 10 per minute per member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                webhook_url: { type: string }
                events:
                  type: object
                  required: [sim_finished, upload_parsed, upload_private]
                  properties:
                    sim_finished: { type: boolean }
                    upload_parsed: { type: boolean }
                    upload_private: { type: boolean }
      responses:
        '200':
          description: The saved block
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DiscordBlock' }
        '400': { description: 'invalid: the body is malformed or the URL is not a Discord webhook URL (the message never echoes it)' }
        '401': { description: Sign in first }
        '402': { description: 'premium_required: Discord messages are part of Premium' }
        '404': { description: 'not_found: an events-only change with no webhook saved' }
        '422': { description: 'invalid: the URL parsed but Discord did not accept it; nothing is stored' }
        '429': { description: 'rate_limited: more than 10 saves in a minute' }
    delete:
      summary: Remove the Discord webhook
      operationId: deleteDiscordWebhook
      description: >-
        Allowed for a lapsed member; deleting an absent webhook is not an error. A connected webhook
        is also deleted at Discord first (best effort, only while entitled); a pasted one never is.
      responses:
        '204': { description: Removed }
        '401': { description: Sign in first }
  /v1/notifications/discord/connect:
    get:
      summary: Start the one-click Discord connect (premium)
      operationId: connectDiscord
      description: >-
        Sets the fs_discord_state cookie (httpOnly, SameSite=Lax, path
        /v1/notifications/discord/callback, 10 minutes) and redirects to Discord's authorize page
        with scope webhook.incoming.
      responses:
        '302': { description: "Discord's authorize URL; or /account?discord=failed#discord when the member lacks the notifications entitlement" }
        '404': { description: The deployment has no Discord application configured }
  /v1/notifications/discord/callback:
    get:
      summary: Finish the Discord connect
      operationId: discordConnectCallback
      description: >-
        Always clears the state cookie and redirects to the account page with discord=connected,
        denied (no code, or error=access_denied) or failed. A connect replaces the saved webhook
        keeping its events and removes the replaced connected webhook from Discord.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '302': { description: "/account?discord=connected|denied|failed#discord" }
  /v1/notifications/discord/test:
    post:
      summary: Post the test message (premium)
      operationId: testDiscordWebhook
      description: >-
        Limited to 5 per minute per member. Success resets the failure counter and clears a
        failed-five-times switch-off; a failed test changes no counter.
      responses:
        '204': { description: Posted }
        '401': { description: Sign in first }
        '402': { description: 'premium_required' }
        '404': { description: 'not_found: no webhook saved' }
        '429': { description: 'rate_limited: more than 5 tests in a minute' }
        '502': { description: "upstream: Discord answered with an error; error.message is its own message (or the status text), URL and token removed, at most 140 characters" }
        '504': { description: 'upstream: Discord did not answer (timeout or unreachable); error.message is a fixed sentence' }
  /v1/sims/{id}:
    get:
      summary: One saved sim
      operationId: getSim
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SimResult' }
        '404': { description: No such sim }
  /v1/sims/{id}/seen:
    post:
      summary: Mark the caller's finished server run as looked at
      operationId: markSimSeen
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Marked seen (marking twice is the same answer) }
        '401': { description: Sign in first }
        '404': { description: Not the caller's finished run }
  /v1/sims/{id}/rerun:
    post:
      summary: Run a failed server run again (premium)
      description: >-
        Starts the failed run's stored request as a new run, through the same
        checks POST /v1/sims/run applies. The failed row is left as it is.
      operationId: rerunSim
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '202':
          description: Dispatched as a new run
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sim_id: { type: string }
        '400':
          description: >-
            The stored request can no longer be run: error.code is "invalid",
            "cap_exceeded" or "too_large", as for POST /v1/sims/run.
        '401': { description: Sign in first }
        '402': { description: 'premium_required: running on our servers is a premium feature' }
        '404': { description: Not the caller's failed run }
        '502': { description: The run was recorded but could not be started }
  /v1/sims/{id}/progress:
    get:
      summary: How far a server-lane run has got
      operationId: getSimProgress
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The run's state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          state: { type: string, enum: [queued, running, done, error] }
                          iterations_done: { type: integer }
                          dps: { type: number, nullable: true }
                          stage: { type: integer, description: Which stage of a bulk run is going; 0 for a plain run. }
                          combos_done: { type: integer }
                          combos_total: { type: integer }
        '404': { description: No such sim }
  /v1/specs:
    get:
      summary: Every spec's simulator fidelity
      operationId: listSpecs
      responses:
        '200':
          description: The support page's data, one card per spec
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          specs:
                            type: array
                            items: { $ref: '#/components/schemas/SpecFidelity' }
  /v1/characters/{region}/{ruleset}/{name}/sim-input:
    get:
      summary: The character model the sim page starts from
      operationId: getSimInput
      parameters:
        - { name: region, in: path, required: true, schema: { type: string } }
        - { name: ruleset, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The newest of the addon export and the last fight
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          spec: { type: string }
                          spec_source:
                            type: string
                            enum: [fight, talents, default, ""]
                            description: >-
                              Where spec came from: fight (a logged fight named it), talents (the
                              dominant tree of the export's talent points) or default (no points
                              spent: the class's first spec). Empty when spec is.
                          gear: { type: object }
                          talents: { type: string }
                          buffs:
                            type: array
                            items: { type: string }
                            description: Engine buff ids, from sim/request/IDS.md.
                          captured_at: { type: string, format: date-time }
                          source: { type: string, enum: [addon, blizzard, fight] }
        '404': { description: No such character }
  /v1/phases:
    get:
      summary: The content phase boundaries
      operationId: getPhases
      description: >-
        The same four instants the rankings bucket by, from
        data/curated/phases.json. Cached an hour: they change only with a
        deploy.
      responses:
        '200':
          description: The phases, in order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          phases:
                            type: array
                            items:
                              type: object
                              properties:
                                name: { type: string, example: raids-1 }
                                start: { type: string, format: date-time }
  /v1/characters/search:
    get:
      summary: Characters whose name starts with the typed text (the lookup typeahead)
      description: >-
        A case-insensitive prefix match on the character's name. q is trimmed; fewer than 2
        characters answers 200 with rows [] (never 400), and more than 24 is cut to 24. The
        text matches literally (% and _ are not wildcards). Rows are ordered by the exact name
        first, then name, then region us before the others, then ruleset normal before the
        others. A character whose account is anonymised is left out, as the character page
        answers 404 for it. Each row is { key, region, ruleset, name, class, level, spec }: class
        is the character's stored class (null when unknown), level the Battle.net import's level
        (null when unknown; the addon export's level is not consulted), and spec is always null.
        rows is never null.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "The start of the name; fewer than 2 characters answers rows []." }
        - { name: region, in: query, schema: { type: string, enum: [us, eu, kr, tw, cn] } }
        - { name: ruleset, in: query, schema: { type: string, enum: [normal, pvp, rp, hardcore] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 10, default: 8 } }
      responses:
        '200': { description: "rows[]", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '400':
          description: "An unknown region or ruleset, or a limit outside 1 to 10 (code bad_request)"
          content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } }
  /v1/characters/{region}/{ruleset}/{name}/history:
    get:
      summary: The owner's Forever Score and parse history
      description: >-
        Owner-only and premium (the history entitlement). Returns { as_of, score[], encounters[],
        gaps[], fights[] }, every array present and never null. score[] is { at (RFC 3339 UTC),
        score, tier, report_id, fight_index, encounter, encounter_id, difficulty (the integer
        difficulty id), parse_percentile?, kill, visibility }; encounters[] is { encounter,
        encounter_id, difficulty, points[{ at, parse_percentile, report_id, fight_index }] };
        gaps[] is { from, to, reason }; fights[] are the public history row shape plus
        visibility. Anyone who is not the owner, and an anonymised character, answer 404
        not_found. Cache-Control is private, no-store.
      operationId: getCharacterHistory
      parameters:
        - { name: region, in: path, required: true, schema: { type: string } }
        - { name: ruleset, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: "The history", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '401': { description: 'Not signed in' }
        '402': { description: 'premium_required: character history is a premium feature' }
        '404': { description: 'not_found: not the owner, or an anonymised character' }
  /v1/characters/{region}/{ruleset}/{name}:
    get:
      summary: A character's bests, history, the builds they have been seen in, and their Forever Score
      description: >-
        character is { key, region, ruleset, name, class?, avatar_url?, render_url?, guild,
        level, race, realm } (schema CharacterIdentity for the last four, each always present
        and null when unknown). best[] and history[] rows are { encounter, encounter_id,
        difficulty, metric, value, percentile?, spec?, fought_at, report_id, fight_index,
        execution_score? }; builds_seen[] is { talent_split, spec?, first_seen }. The Forever
        Score (docs/contracts/addon-v2.md contract 5, computed by api/internal/rating) rides
        beside them as score, tier, components, as_of and experience (schema ForeverScore). All
        five are null when the character has no rated fight in a public report: no logs is never
        a zero score. A score that cannot be read just then is also null, and the rest of the
        page is still served. score_history[] (schema ScorePoint) is the score over time, oldest
        first, never null. A character whose account is anonymised answers 404 exactly as a
        character nobody has logged does, the rule GET .../rating already follows. gear[]
        (schema CharacterGearSlot) is the gear panel: the 17 slots of the character's newest
        addon export, in the export's order, each with what it wears, the band's pick and the
        gap; [] when the character has no export. gear_gap_total beside it is the sum of the
        gaps (schema CharacterGear gives both and every null rule). A history row's
        execution_score is defined in schema ExecutionScore. supporter is true when the
        owning account shows the supporter mark, and false for a character with no linked
        account.
      parameters:
        - { name: region, in: path, required: true, schema: { type: string, enum: [us, eu, kr, tw, cn] } }
        - { name: ruleset, in: path, required: true, schema: { type: string, enum: [normal, pvp, rp, hardcore] } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '404':
          description: "No such character, or its account is anonymised (the same answer)"
          content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } }
  /v1/guilds/{id}/reports:
    get:
      summary: A guild's own reports, newest first (session)
      description: >-
        Shaped exactly like GET /v1/reports?mine=1 (rows, total, page, per_page): each row
        carries id, title, zone, status, visibility, created_at, fight_count and kill_count,
        plus logging_character, last_upload_at and heartbeat_at as in GET /v1/reports?mine=1.
        The rows are the guild's own guild-visibility reports plus its public ones, the set a
        member already sees on any one of that guild's reports. Authorized the same way: a
        verified member of the guild (any rank) may list it; a signed-in caller with no
        standing in the guild gets 404, the same answer an unknown guild id gets, never a 403
        that would confirm the guild exists.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: "rows, total, page, per_page (100)", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '400': { description: "page must be 1 or more", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '401': { description: "No session", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '404': { description: "Unknown guild, or not a member", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/guilds/{id}/home:
    get:
      summary: A guild's control centre home (session)
      description: >-
        The guild, the viewer's standing, the summary, the last week's reports, the roster and
        the officer's pending queue, in the shape docs/contracts/2026-10-04-guild-centre-api.md
        gives. roster[].attendance is { present, nights } (schema GuildAttendance): presence in
        the guild's last 8 non-private, unflagged reports that someone is present in, read by
        character key. Every roster[] (and pending[]) row carries addon (schema
        GuildRosterAddon): its line in the guild's newest addon roster snapshot, or null; the
        top-level addon_snapshot (schema GuildAddonSnapshot) says when that snapshot was
        received, by which character, and how many members it listed, or is null when the
        members[] and counts are the roster as a person counts it: one entry per character the
        newest addon snapshot names and per verified character, merged by name, each with a
        state (approved, waiting, no_account, not_seen), the rank word (the addon's for an
        account's character; "member" for a snapshot name that carries none) and the snapshot's
        level, spec and seen_at; counts is { on_roster, in_game_no_account, waiting,
        not_seen }. An account that joined by invite has an entry the moment it joins
        (not_seen until the snapshot names it). roster[] and pending[] stay the account rows.
        Each of their rows carries supporter, true when its owning account shows the supporter
        mark; the members[] entries, which have no account of their own, never carry it.
        guild has none. reports[] is paged by cursor (next_cursor). A verified member of the
        guild (an account with a verified character on its roster) may read it; anyone else,
        an account whose rows are all unverified included, gets 403.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: cursor, in: query, schema: { type: string }, description: "The next_cursor a previous page returned; it pages reports[] past that report." }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '400': { description: "cursor is not a next_cursor this route returned", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '401': { description: "No session", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '403': { description: "Not a verified member of the guild (an unknown numeric id answers 403 too: nobody is its member)", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '404': { description: "No such guild: an id that is not a positive number, or a guild gone by the time the home is read", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/guilds/{region}/{ruleset}/{name}:
    get:
      summary: A guild's progression, roster bests, and reports
      description: "progression[] rows are { encounter, encounter_id, difficulty, kills, pull_count, first_kill_at? }; roster_best[] rows are { player, encounter, encounter_id, metric, value, fought_at, execution_score? }, where execution_score is defined in schema ExecutionScore."
      parameters:
        - { name: region, in: path, required: true, schema: { type: string, enum: [us, eu, kr, tw, cn] } }
        - { name: ruleset, in: path, required: true, schema: { type: string, enum: [normal, pvp, rp, hardcore] } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '404': { description: "No such guild", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/addon/exports:
    post:
      summary: Store the addon's character exports and outbox (device)
      description: >-
        The body carries the per-character `characters` list, the addon's `outbox`
        (docs/contracts/addon-v2.md, contract 4), or both; with no outbox the list must hold at
        least one character. The list is stored first. An outbox whose `format` is not 1 is
        ignored whole (`outbox.status` "ignored"). A format 1 outbox carries no region, so its
        `export.character` (Name-Realm) is matched by name against the characters this account
        has synced; a name the account has never synced, or one that matches two characters a
        ruleset realm cannot tell apart, stores nothing ("unknown_character"). Its export is
        stored exactly as a `characters` entry is. Its `sim_request` queues one premium server
        run (the same sims row and job POST /v1/sims/run starts, built from the request's own
        gear code) unless that character already has the same request, or any request in the
        last hour whose run has not failed ("duplicate"; a run that failed does not hold the
        hour, so the player can ask again at once); an account without server sims gets
        "premium_required", a
        deployment that cannot start the job "unavailable". Its `roster_snapshot` is stored for
        the guild the exporting character belongs to, and only that guild ("not_in_guild"
        otherwise); a newer snapshot replaces the guild's last one. GET /v1/guilds/{id}/home
        reads it back as roster[].addon and addon_snapshot. Its
        members come from other players' addons, so they are checked one by one: a member
        whose fields fail validation is dropped and counted in `dropped_members`, the rest are
        stored, and a snapshot with no usable guild name, or whose every member was dropped,
        is answered "invalid". A sim request whose content cannot be used is likewise answered
        "invalid". Neither part ever fails the sync: only an outbox that is structurally not
        one (not an object, a non-numeric format, a missing or malformed export) is refused
        400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                characters:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      ruleset: { type: string, description: "Normalised through the API's realm-to-ruleset mapping; an unrecognised value is not rejected" }
                      region: { type: string, enum: [us, eu, kr, tw, cn] }
                      export: { type: string, maxLength: 4096 }
                outbox:
                  type: object
                  required: [format]
                  description: "ForeverSixtyDB.outbox as the addon wrote it. Fields added inside format 1 are ignored."
                  properties:
                    format: { type: integer, description: "1; any other value is ignored" }
                    export:
                      type: object
                      description: "Required in format 1."
                      required: [character, code]
                      properties:
                        character: { type: string, description: "Name-Realm" }
                        code: { type: string, maxLength: 4096, description: "The FS1 export string" }
                        saved_at: { type: string, description: "Player's local time, YYYY-MM-DD HH:MM" }
                    sim_request:
                      type: object
                      nullable: true
                      required: [character, spec, requested_at, gear_code]
                      properties:
                        character: { type: string, description: "Name-Realm" }
                        spec: { type: string, description: "A spec slug, e.g. warrior-arms" }
                        requested_at: { type: string, description: "Player's local time, YYYY-MM-DD HH:MM; with the character, the request's identity" }
                        gear_code: { type: string, maxLength: 4096, description: "The FS1 export as of the request" }
                    roster_snapshot:
                      type: object
                      nullable: true
                      required: [guild, members]
                      properties:
                        guild: { type: string, maxLength: 24 }
                        members:
                          type: array
                          maxItems: 1000
                          items:
                            type: object
                            required: [name, level, seen_at]
                            properties:
                              name: { type: string, description: "Name-Realm" }
                              level: { type: integer, minimum: 1, maximum: 60 }
                              spec: { type: string, maxLength: 64 }
                              gear_gap: { type: integer }
                              build: { type: string, maxLength: 64 }
                              seen_at: { type: string, description: "Player's local time, YYYY-MM-DD HH:MM" }
      responses:
        '200':
          description: >-
            { stored, outbox? } where stored counts the exports written (the list, plus the
            outbox's own export when the list did not already carry that character) and outbox,
            present when the body carried one, is { status: "read" | "ignored", export?: "stored" |
            "unknown_character", sim_request?: "queued" | "duplicate" | "premium_required" |
            "unavailable" | "unknown_character" | "invalid" | "not_started", roster_snapshot?:
            "stored" | "not_in_guild" | "unknown_character" | "invalid", dropped_members?: the
            number of snapshot members left out for failing validation (absent when none) }, each
            part present only when the outbox carried it
          content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } }
        '400': { description: "neither a characters list nor an outbox, a malformed list, or an outbox that is structurally not one", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '409': { description: "a character is already synced from a different account", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /v1/addon/inbox:
    get:
      summary: The builds and typed messages waiting to be written into the game (device)
      description: >-
        Wave C (docs/superpowers/specs/2026-09-14-phase-3-interfaces.md's Sept 28 amendment) adds
        `messages` beside `builds`, both read the same way by character: `character` absent
        reaches every character on the account, present reaches one. Each message's `type` is
        `upgrade` ({ slot, item_id, item_name, source, delta }, from the account's last Top Gear
        run), `weights` ({ spec, weights: [{ stat, weight }], caps: [stat, ...] }, from the
        account's last saved weights run), or `guild` ({ guild_name, claim_state, pending_approvals,
        rank }, this character's own private guild state). A companion or addon build from before
        this date reads `builds` exactly as it always did and never looks at `messages`.
        Inbox v2 (docs/contracts/addon-v2.md contract 3; data is AddonInbox, pinned by
        docs/contracts/fixtures/inbox-v2.json) adds `format` 2 and `generated_at`, the `build`,
        `sim_result`, `last_raid`, `loot_values` and `ack` messages, `unit` on upgrade and
        `dps_per_point` on weights. `character` is the character key region/ruleset/name-slug.
        `ack` is sent only to an account with a paired, unrevoked device.
      responses:
        '200':
          description: "data is AddonInbox: { format: 2, generated_at, builds: [ { id, name, character?, code } ], messages: [ AddonInboxMessage ] } where code is the build's FSB1 addon code, so the companion writes the inbox file without a second call"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AddonInbox' }
    post:
      summary: Queue a build for the game (session)
      description: >-
        Escaping contract. What this route stores comes straight back out of GET /v1/addon/inbox
        as `id` and `character`, and the companion writes those into ForeverSixtyInbox.lua, a Lua
        source file the addon loads. The API's half of the bargain is shape: build_id is exactly
        eight lowercase RFC 4648 base32 characters ([a-z2-7]), and character_key is either empty
        or <region>/<ruleset>/<name-slug> whose slug is letters, digits and hyphens only - no
        quote, backslash, bracket, control character or whitespace can reach the store, and
        anything else is refused 400. The companion's half is to escape what it writes anyway:
        the shape check is a floor, not a promise that the value is safe to interpolate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [build_id]
              properties:
                build_id: { type: string, minLength: 8, maxLength: 8, pattern: '^[a-z2-7]{8}$' }
                character_key:
                  type: string
                  pattern: '^$|^[a-z]{2}/(normal|pvp|rp|hardcore)/[^/]{1,64}$'
      responses:
        '201': { description: "queued", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '400': { description: "build_id or character_key is not the right shape", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
        '422': { description: "that build has no talent points, or its code cannot be rendered", content: { application/json: { schema: { $ref: '#/components/schemas/Envelope' } } } }
  /reports/{id}/card.png:
    get:
      summary: A report's unfurl card
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: >-
            1200x630 PNG, Vary: Cookie. Cache-Control is public, max-age=300 for a public or
            unlisted report and private, max-age=300 for one whose card was drawn because the
            caller may read it.
          content: { image/png: { schema: { type: string, format: binary } } }
        '404':
          description: "Unknown or invisible report; the stand-in card, cached a minute"
          content: { image/png: { schema: { type: string, format: binary } } }
