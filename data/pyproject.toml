[project]
name = "pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic>=2.8", "pillow>=11", "protobuf>=7.36"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "grpcio-tools>=1.84"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pipeline --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
# Generated protobuf bindings are not ours to exercise for coverage.
omit = ["pipeline/simproto/*_pb2.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Generated protobuf bindings are not ours to lint.
"pipeline/simproto/*_pb2.py" = ["ALL"]
