<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forever Sixty</title>
<link rel="preload" href="fonts/marcellus-400-subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/open-sans-400-subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/open-sans-600-subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<!-- The Mac's first launch from a download (internal/install): one question, one button. -->
<body class="prompt">
<div class="top">
  <header class="col">
    <span class="wordmark"><img class="seal" src="seal.svg" width="32" height="32" alt="">Forever Sixty</span>
  </header>
</div>
<main>
  <div class="col page">
    <div class="panel lead" id="move-panel">
      <h1 id="move-title"></h1>
      <p class="lede" id="move-lede"></p>
      <label class="switch" id="move-login-row" hidden><input type="checkbox" id="move-login" checked><span id="move-login-label"></span></label>
      <button class="action primary big" id="move" type="button" autofocus></button>
      <p class="reason" id="move-error" role="alert" hidden></p>
    </div>
  </div>
</main>
<script src="copy.js"></script>
<script src="install.js"></script>
</body>
</html>
