<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forever Sixty</title>
<link rel="preload" href="fonts/marcellus-400-subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/open-sans-400-subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/open-sans-600-subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<!-- The install windows (internal/install): the Mac's move, the Windows setup and its uninstall
     (?mode=move|setup|uninstall). One question, one toggle, one button, then the progress. -->
<body class="prompt">
<div class="top">
  <header class="col">
    <span class="wordmark"><img class="seal" src="seal.svg" width="32" height="32" alt="">Forever Sixty</span>
  </header>
</div>
<main>
  <div class="col page">
    <div class="panel lead" id="move-panel">
      <h1 id="move-title"></h1>
      <p class="lede" id="move-lede"></p>
      <label class="switch" id="move-login-row" hidden><input type="checkbox" id="move-login" checked><span id="move-login-label"></span></label>
      <button class="action primary big" id="move" type="button"></button>
      <div class="progress" id="move-progress" hidden>
        <div class="progress-track"><span id="move-bar"></span></div>
        <p class="fine" id="move-step" aria-live="polite"></p>
      </div>
      <p class="reason" id="move-error" role="alert" hidden></p>
    </div>
  </div>
</main>
<script src="copy_gen.js"></script>
<script src="copy.js"></script>
<script src="install.js"></script>
</body>
</html>
