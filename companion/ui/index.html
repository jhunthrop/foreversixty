<!doctype html>
<html lang="en">
<head>
<style>html{background:#07090d}</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forever Sixty</title>
<link rel="preload" href="fonts/cinzel-700-subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-400-subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-600-subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/jetbrains-mono-500-subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="top">
  <header>
    <a class="wordmark" id="wordmark" href="https://foreversixty.gg" data-open><img class="seal" src="seal.svg" width="28" height="28" alt="">Forever Sixty</a>
    <nav aria-label="Pages">
      <button data-page="status" aria-current="page">Status</button>
      <button data-page="reports">Reports</button>
      <button data-page="device">Device</button>
      <button data-page="settings">Settings</button>
    </nav>
  </header>
</div>
<div class="bar bad" id="poll-bar" role="alert" hidden></div>
<div class="bar" id="tray-bar" role="status" hidden>
  <span id="tray-bar-text"></span>
  <button class="ghost" id="tray-bar-dismiss" type="button">Dismiss</button>
</div>
<p class="col first-check" id="first-check" role="status">Checking…</p>
<main id="main" hidden>
  <div class="col page">
    <section id="status">
      <h2 class="sr" tabindex="-1">Status</h2>
      <div class="panel headline" id="headline" aria-live="polite"></div>
      <div class="panel rows secondary" id="status-rows"></div>
      <h3 id="folders-title">Game folders</h3>
      <div class="panel list" id="installs"></div>
    </section>

    <section id="reports" hidden>
      <div class="h2line">
        <h2 tabindex="-1">Your reports</h2>
        <a id="reports-all" href="#" data-open></a>
      </div>
      <p class="hint" id="reports-hint" hidden></p>
      <div class="panel flush" id="report-panel"></div>
    </section>

    <section id="device" hidden>
      <h2 tabindex="-1">This device</h2>
      <div class="panel" id="device-panel"></div>
    </section>

    <section id="settings" hidden>
      <h2 tabindex="-1">Settings</h2>
      <div class="panel">
        <div class="group">
          <label for="visibility" id="visibility-label">New reports are</label>
          <select id="visibility">
            <option value="public">Public</option>
            <option value="unlisted">Unlisted</option>
            <option value="private">Private</option>
            <option value="guild">Guild only</option>
          </select>
          <p class="help" id="visibility-help"></p>
        </div>

        <div class="group">
          <label class="switch" for="keep-addon"><input type="checkbox" role="switch" id="keep-addon" checked><span id="keep-addon-label">Keep the addon up to date</span></label>
          <p class="help" id="keep-addon-help"></p>
        </div>

        <div class="group">
          <label for="logging-character" id="character-label">Reports are credited to</label>
          <select id="logging-character"></select>
          <p class="help" id="character-help"></p>
        </div>

        <div class="group">
          <div class="label-row">
            <div class="label" id="folders-label">Game folders</div>
            <button class="ghost small" id="add-folder" type="button">Add a folder...</button>
          </div>
          <ul class="folders" id="folder-list" aria-labelledby="folders-label"></ul>
          <p class="note" id="folder-note" role="status"></p>
        </div>

      </div>
      <div class="save-row">
        <div class="save-msg">
          <p class="state" id="save-state">No changes</p>
          <p class="note" id="settings-note" role="status"></p>
        </div>
        <button class="action primary big" id="save" type="button" disabled>Save changes</button>
      </div>
    </section>
  </div>
</main>
<div class="bar update" id="update-bar" role="status" hidden><span class="pip" aria-hidden="true"></span><span id="update-text"></span></div>
<footer id="footer">
  <div class="inner">
    <span class="foot-left" id="foot-version">Companion</span>
    <a class="foot-right" id="foot-site" href="https://foreversixty.gg" data-open>foreversixty.gg</a>
  </div>
</footer>
<script src="copy.js"></script>
<script src="format.js"></script>
<script src="app.js"></script>
</body>
</html>
