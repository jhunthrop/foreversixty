<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forever Sixty</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="col top">
  <header>
    <a class="wordmark" id="wordmark" href="https://foreversixty.gg" data-open>Forever Sixty</a>
    <nav aria-label="Pages">
      <button data-page="status">Status</button>
      <button data-page="reports">Reports</button>
      <button data-page="device">Device</button>
      <button data-page="settings">Settings</button>
    </nav>
  </header>
</div>
<div class="bar bad" id="poll-bar" role="alert" hidden></div>
<div class="bar" id="tray-bar" role="status" hidden>
  <span id="tray-bar-text"></span>
  <button class="ghost" id="tray-bar-dismiss" type="button">Dismiss</button>
</div>
<main class="col" id="main" hidden>
  <section id="status">
    <h2 tabindex="-1">Status</h2>
    <div class="panel headline" id="headline" aria-live="polite"></div>
    <div class="panel secondary" id="status-rows"></div>
    <h3 id="folders-title">Game folders</h3>
    <div class="panel" id="installs"></div>
  </section>

  <section id="reports" hidden>
    <div class="h2line">
      <h2 tabindex="-1">Your reports</h2>
      <a id="reports-all" href="#" data-open></a>
    </div>
    <div class="panel" id="report-panel"></div>
  </section>

  <section id="device" hidden>
    <h2 tabindex="-1">This device</h2>
    <div class="panel" id="device-panel"></div>
  </section>

  <section id="settings" hidden>
    <h2 tabindex="-1">Settings</h2>
    <div class="panel">
      <label for="visibility" id="visibility-label">New reports are</label>
      <select id="visibility">
        <option value="public">Public</option>
        <option value="unlisted">Unlisted</option>
        <option value="private">Private</option>
        <option value="guild">Guild only</option>
      </select>
      <p class="help" id="visibility-help"></p>

      <div class="label" id="folders-label">Game folders</div>
      <ul class="folders" id="folder-list" aria-labelledby="folders-label"></ul>
      <button class="action" id="add-folder" type="button">Add a folder...</button>
      <p class="note" id="folder-note" role="status"></p>

      <label for="logging-character" id="character-label">Reports are credited to</label>
      <select id="logging-character"></select>
      <p class="help" id="character-help"></p>

      <button class="action primary" id="save" type="button" disabled>Save changes</button>
      <p class="note" id="settings-note" role="status"></p>
    </div>
  </section>
</main>
<footer id="footer" hidden>
  <div class="inner">
    <span class="foot-left" id="foot-version"></span>
    <a class="foot-right" id="foot-site" href="https://foreversixty.gg" data-open></a>
    <span class="foot-update" id="foot-update" hidden></span>
  </div>
</footer>
<script src="copy.js"></script>
<script src="format.js"></script>
<script src="app.js"></script>
</body>
</html>
