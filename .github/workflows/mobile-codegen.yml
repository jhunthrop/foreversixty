# The native apps' generated code must match its sources: the design tokens
# (design/tokens/tokens.json), the API models and endpoints (api/openapi.yaml), the copy catalog
# and the deep-link table (apps/shared). The tokens' generator and its node:test drift check live
# in design/tokens; the others live in web/scripts with a vitest drift check in web. This runs
# only those checks, on any change to a source, an output or a generator, so a hand edit to
# a generated file or a source change without a regeneration fails here. The web workflow runs
# the same tests with the rest of the unit suite.
name: mobile-codegen
on:
  push:
    branches: [main, 'land/**']
    paths:
      - api/openapi.yaml
      - apps/**
      - web/scripts/gen-mobile-*.mjs
      - web/scripts/mobile-codegen/**
      - web/src/lib/mobile/**
      - design/tokens/**
      - web/src/styles/tokens.css
      - addon/ForeverSixty/Tokens.lua
      - addon/ForeverSixty/media/fonts/**
      - .github/workflows/mobile-codegen.yml
  pull_request:
    paths:
      - api/openapi.yaml
      - apps/**
      - web/scripts/gen-mobile-*.mjs
      - web/scripts/mobile-codegen/**
      - web/src/lib/mobile/**
      - design/tokens/**
      - web/src/styles/tokens.css
      - addon/ForeverSixty/Tokens.lua
      - addon/ForeverSixty/media/fonts/**
      - .github/workflows/mobile-codegen.yml
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: mobile-codegen-${{ startsWith(github.ref, 'refs/heads/land/') && github.sha || github.ref }}
  # A newer push cancels a branch or pull request run; main's runs always finish, or a
  # quick second push leaves production undeployed (2026-11-02: two hours).
  # A land/** run (tools/land.sh) is grouped by its sha and is never cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/land/') }}
jobs:
  drift:
    # Skipped in launch mode (docs/runbooks/landing.md, "Launch mode").
    if: vars.LAUNCH_MODE != 'true'
    runs-on: ubuntu-latest
    # 30, not 10-15: a cold checkout took 5-16 minutes when a land/** run started ~35 jobs at
    # once (2026-11-03), and a timed-out checkout reads as a red landing.
    timeout-minutes: 30
    defaults: { run: { working-directory: web } }
    steps:
      # The generators' sources and both apps' outputs; the planner golden reads the active
      # build's talents, so data/builds comes from the cache (docs/runbooks/landing.md, "Checkout").
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/builds/
            !/data/diffs/
            !/design/reviews/
            !/design/mocks/
            !/docs/superpowers/reviews/
      - uses: ./.github/actions/data-builds
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated mobile code matches its sources
        run: npx vitest run src/lib/mobile
      - name: Generated design tokens match tokens.json
        run: node --test ../design/tokens/tokens.test.mjs
