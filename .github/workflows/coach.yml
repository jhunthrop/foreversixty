# .github/workflows/coach.yml
#
# The coach's starter personas (data/curated/coach/<spec>.md) are generated by
# tools/coach/persona_starter.py from each spec's guide, rotation, raid preset, consumable
# catalogue and the active build's spell constants. tools/coach/test_persona_starter.py checks
# the generator's rulings and that every committed starter is exactly what it generates today.
# Before this workflow nothing ran it, and twelve tests went red unseen as guides, presets and
# the client build moved (round 10 platform). So it runs on every change to any of those
# inputs, not only to tools/: a guide edit that leaves a starter stale fails here, and the fix
# is `python tools/coach/persona_starter.py --all` from the repository root.
name: coach
on:
  push:
    branches: [main, 'land/**']
    paths: &inputs
      - tools/coach/**
      - data/curated/coach/**
      - data/curated/apl/**
      - data/curated/presets.json
      - data/curated/specs.json
      - data/builds/*/spellconst/**
      - sim/request/raid-consumes.json
      - logs/engine/mechanics/consumables/catalogue.json
      - web/src/content/guides/**
      - web/src/data/active-build.json
      - data/pyproject.toml
      - data/uv.lock
      - .github/workflows/coach.yml
  pull_request:
    paths: *inputs
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: coach-${{ startsWith(github.ref, 'refs/heads/land/') && github.sha || github.ref }}
  # A newer push cancels a branch or pull request run; main's runs always finish, or a
  # quick second push leaves production undeployed (2026-11-02: two hours).
  # A land/** run (tools/land.sh) is grouped by its sha and is never cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/land/') }}
jobs:
  starters:
    # Skipped in launch mode (docs/runbooks/landing.md, "Launch mode").
    if: vars.LAUNCH_MODE != 'true'
    runs-on: ubuntu-latest
    # 30, not 10-15: a cold checkout took 5-16 minutes when a land/** run started ~35 jobs at
    # once (2026-11-03), and a timed-out checkout reads as a red landing.
    timeout-minutes: 30
    steps:
      # The trees no job here reads stay out of the checkout, and data/builds comes from the
      # cache (docs/runbooks/landing.md, "Checkout").
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/builds/
            !/data/diffs/
            !/design/reviews/
            !/design/mocks/
            !/docs/superpowers/reviews/
            !/apps/ios/
            !/apps/android/
      - uses: ./.github/actions/data-builds
      # The data pipeline's locked environment, the same pytest data.yml runs.
      - uses: astral-sh/setup-uv@v3
      - name: the data pipeline's environment
        working-directory: data
        run: uv sync
      - name: the starter persona generator and the committed starters
        run: uv run --project data pytest -q tools/coach/test_persona_starter.py
