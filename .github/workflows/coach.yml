# .github/workflows/coach.yml
#
# The coach's starter personas (data/curated/coach/<spec>.md) are generated by
# tools/coach/persona_starter.py from each spec's guide, rotation, raid preset, consumable
# catalogue and the active build's spell constants. tools/coach/test_persona_starter.py checks
# the generator's rulings and that every committed starter is exactly what it generates today.
# Before this workflow nothing ran it, and twelve tests went red unseen as guides, presets and
# the client build moved (round 10 platform). So it runs on every change to any of those
# inputs, not only to tools/: a guide edit that leaves a starter stale fails here, and the fix
# is `python tools/coach/persona_starter.py --all` from the repository root.
name: coach
on:
  push:
    branches: [main]
    paths: &inputs
      - tools/coach/**
      - data/curated/coach/**
      - data/curated/apl/**
      - data/curated/presets.json
      - data/curated/specs.json
      - data/builds/*/spellconst/**
      - sim/request/raid-consumes.json
      - logs/engine/mechanics/consumables/catalogue.json
      - web/src/content/guides/**
      - web/src/data/active-build.json
      - data/pyproject.toml
      - data/uv.lock
      - .github/workflows/coach.yml
  pull_request:
    paths: *inputs
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: coach-${{ github.ref }}
  cancel-in-progress: true
jobs:
  starters:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The data pipeline's locked environment, the same pytest data.yml runs.
      - uses: astral-sh/setup-uv@v3
      - name: the data pipeline's environment
        working-directory: data
        run: uv sync
      - name: the starter persona generator and the committed starters
        run: uv run --project data pytest -q tools/coach/test_persona_starter.py
