# .github/workflows/tools.yml
#
# The shell scripts the client move and the engine follow run, and the workflows that run
# them: tools/tests/test_activation.sh (the activation gate, the move's failure report and
# resume, the blocked-build issue (tools/client-alert.sh), the scripts' executable bits),
# tools/engine/tests/test_scripts.sh (the engine follow hash, pin conditions, review
# branch, pinned build and ranking wait) and
# tools/tests/test_release_apps.sh (the apps' release command),
# tools/tests/test_remeasure.sh (bis.yml's dps-per-point re-measure and its manifest),
# tools/tests/test_wasm_compress.sh (the deployed sim.wasm.gz and .br and their budget gates),
# tools/tests/test_apl_check.py (apl-check and apl-sync ignore the curated-only notes) and
# tools/tests/play-upload.test.ts
# (its Play upload, against a stub of the API), then
# shellcheck over every script and actionlint over every workflow. Plain bash with stubs
# and scratch git repositories: no network, no database, no secrets.
name: tools
on:
  push:
    branches: [main]
    paths: ['tools/**', '.github/workflows/**', '.github/actions/**', '.github/actionlint.yaml']
  pull_request:
    paths: ['tools/**', '.github/workflows/**', '.github/actions/**', '.github/actionlint.yaml']
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: tools-${{ github.ref }}
  # A newer push cancels a branch or pull request run; main's runs always finish, or a
  # quick second push leaves production undeployed (2026-11-02: two hours).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  ACTIONLINT_VERSION: 1.7.12
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: git config --global user.name tools-ci && git config --global user.email ci@foreversixty.gg
      - name: the activation scripts
        run: bash tools/tests/test_activation.sh
      - name: the engine follow scripts
        run: bash tools/engine/tests/test_scripts.sh
      - name: the apps release command
        run: bash tools/tests/test_release_apps.sh
      - name: the dps-per-point re-measure
        run: bash tools/tests/test_remeasure.sh
      - name: the sim.wasm.gz and sim.wasm.br compression and budgets
        run: bash tools/tests/test_wasm_compress.sh
      - name: apl-check and apl-sync, notes curated-only
        run: python3 -m unittest discover -s tools/tests -p 'test_apl*.py'
      # 24 runs the TypeScript directly, with no packages.
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: the Play upload
        run: node --test tools/tests/*.test.ts
      - name: shellcheck
        run: shellcheck tools/*.sh tools/engine/*.sh tools/tests/*.sh tools/engine/tests/*.sh
      - name: actionlint
        run: |
          curl -sSL -o /tmp/actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          # Every workflow, with .github/actionlint.yaml (the xcode-27 runner label and the
          # held data.yml's shellcheck findings).
          /tmp/actionlint
