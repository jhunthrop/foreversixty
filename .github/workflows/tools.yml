# .github/workflows/tools.yml
#
# The shell scripts the client move and the engine follow run, and the workflows that run
# them: tools/tests/test_activation.sh (the activation gate, the move's failure report and
# resume, the blocked-build issue (tools/client-alert.sh), the scripts' executable bits),
# tools/engine/tests/test_scripts.sh (the engine follow hash, pin conditions, review
# branch, pinned build and ranking wait) and
# tools/tests/test_release_apps.sh (the apps' release command),
# tools/tests/test_remeasure.sh (bis.yml's dps-per-point re-measure and its manifest),
# tools/tests/test_bis_land.sh (bis.yml's landing of the picks on main as it is now),
# tools/tests/test_bis_pending.sh (bis.yml's resume: the specs still to rank on these inputs),
# tools/tests/test_wasm_compress.sh (the deployed sim.wasm.gz and .br and their budget gates),
# tools/tests/test_publish_feed.sh (the releases' upload to the site's own release feed),
# tools/tests/test_land.sh (the integrator's land/** landing command and tools/land_workflows.py),
# tools/tests/test_prod_smoke.sh (smoke.yml's launch-mode production smoke),
# tools/tests/test_go_test_shard.sh (api.yml's go test shards),
# tools/tests/test_bis_matrix.sh (bis.yml's rank matrix, one leg per class),
# tools/tests/test_apl_check.py (apl-check and apl-sync ignore the curated-only notes),
# tools/tests/test_revert_check.py (the merge revert check),
# tools/tests/test_land_workflows.py (a disabled_manually workflow never gates a landing) and
# tools/tests/play-upload.test.ts
# (its Play upload, against a stub of the API), then
# shellcheck over every script and actionlint over every workflow. Plain bash with stubs
# and scratch git repositories: no network, no database, no secrets.
#
# On a land/** push, the revert-check job runs tools/revert_check.py on the pushed head:
# when it is a merge, no card note or guide or coach sentence may come back to text our side
# had and changed (a deliberate return is tagged in the merge message, see the tool). The
# card note and guide paths are in the push filter for that job.
name: tools
on:
  push:
    branches: [main, 'land/**']
    paths: ['tools/**', '.github/workflows/**', '.github/actions/**', '.github/actionlint.yaml', 'data/curated/apl/**', 'data/curated/coach/**', 'web/src/content/guides/**']
  pull_request:
    paths: ['tools/**', '.github/workflows/**', '.github/actions/**', '.github/actionlint.yaml']
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: tools-${{ startsWith(github.ref, 'refs/heads/land/') && github.sha || github.ref }}
  # A newer push cancels a branch or pull request run; main's runs always finish, or a
  # quick second push leaves production undeployed (2026-11-02: two hours).
  # A land/** run (tools/land.sh) is grouped by its sha and is never cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/land/') }}
env:
  ACTIONLINT_VERSION: 1.7.12
jobs:
  test:
    runs-on: ubuntu-latest
    # 30, not 10-15: a cold checkout took 5-16 minutes when a land/** run started ~35 jobs at
    # once (2026-11-03), and a timed-out checkout reads as a red landing.
    timeout-minutes: 30
    steps:
      # The tests build their own scratch repositories and read only tools/, the Makefile and
      # .github/: the heavy trees stay out (docs/runbooks/landing.md, "Checkout").
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/builds/
            !/data/diffs/
            !/design/reviews/
            !/design/mocks/
            !/docs/superpowers/reviews/
            !/apps/ios/
            !/apps/android/
      # LAUNCH MODE (docs/runbooks/landing.md, "Launch mode"): shellcheck and actionlint
      # alone; the script tests are skipped.
      - run: git config --global user.name tools-ci && git config --global user.email ci@foreversixty.gg
      - name: the activation scripts
        if: vars.LAUNCH_MODE != 'true'
        run: bash tools/tests/test_activation.sh
      - name: the engine follow scripts
        if: vars.LAUNCH_MODE != 'true'
        run: bash tools/engine/tests/test_scripts.sh
      - name: the apps release command
        if: vars.LAUNCH_MODE != 'true'
        run: bash tools/tests/test_release_apps.sh
      - name: the dps-per-point re-measure
        if: vars.LAUNCH_MODE != 'true'
        run: bash tools/tests/test_remeasure.sh
      - name: the BiS picks landing
        if: vars.LAUNCH_MODE != 'true'
        run: bash tools/tests/test_bis_land.sh
      - name: the BiS ranking's resume
        if: vars.LAUNCH_MODE != 'true'
        run: bash tools/tests/test_bis_pending.sh
      - name: the sim.wasm.gz and sim.wasm.br compression and budgets
        if: vars.LAUNCH_MODE != 'true'
        run: bash tools/tests/test_wasm_compress.sh
      - name: the release feed upload, run in launch mode too since every release depends on it
        run: bash tools/tests/test_publish_feed.sh
      - name: the landing command
        if: vars.LAUNCH_MODE != 'true'
        run: bash tools/tests/test_land.sh
      - name: the launch-mode production smoke
        if: vars.LAUNCH_MODE != 'true'
        run: bash tools/tests/test_prod_smoke.sh
      - name: the api test shards
        if: vars.LAUNCH_MODE != 'true'
        run: bash tools/tests/test_go_test_shard.sh
      - name: the bis rank matrix
        if: vars.LAUNCH_MODE != 'true'
        run: bash tools/tests/test_bis_matrix.sh
      - name: apl-check and apl-sync, notes curated-only
        if: vars.LAUNCH_MODE != 'true'
        run: python3 -m unittest discover -s tools/tests -p 'test_apl*.py'
      - name: the merge revert check
        if: vars.LAUNCH_MODE != 'true'
        run: python3 -m unittest discover -s tools/tests -p 'test_revert*.py'
      - name: land_workflows skips a disabled_manually workflow, fails any other disabled one
        if: vars.LAUNCH_MODE != 'true'
        run: python3 -m unittest discover -s tools/tests -p 'test_land_workflows*.py'
      # 24 runs the TypeScript directly, with no packages.
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: the Play upload
        if: vars.LAUNCH_MODE != 'true'
        run: node --test tools/tests/*.test.ts
      - name: shellcheck
        run: shellcheck tools/*.sh tools/engine/*.sh tools/tests/*.sh tools/engine/tests/*.sh
      - name: actionlint
        run: |
          # GitHub release downloads 504 now and then: retry, then build it from the Go module proxy.
          if curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 -o /tmp/actionlint.tgz \
              "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"; then
            tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          else
            echo "::warning::actionlint ${ACTIONLINT_VERSION} download failed; building it with go install"
            GOBIN=/tmp go install "github.com/rhysd/actionlint/cmd/actionlint@v${ACTIONLINT_VERSION}"
          fi
          # Every workflow, with .github/actionlint.yaml (the xcode-27 runner label and the
          # held data.yml's shellcheck findings).
          /tmp/actionlint
  revert-check:
    if: startsWith(github.ref, 'refs/heads/land/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The whole history without file contents: the tool reads trees for every commit it
      # walks and fetches only the note and guide blobs it compares, in one round trip.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: tools
      - name: no merge brings back a card note or guide sentence we changed
        run: python3 tools/revert_check.py
