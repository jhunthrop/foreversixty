name: android
on:
  push:
    branches: [main]
    paths: ['apps/android/**', 'apps/shared/**', 'apps/VERSION', 'docs/contracts/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android/**', 'apps/shared/**', 'apps/VERSION', 'docs/contracts/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      release:
        description: Build a signed release bundle and upload it to the Play internal track
        type: boolean
        default: false
permissions: { contents: read }
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    working-directory: apps/android
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      # The Android SDK on the runner is the image's; AGP downloads the platform it is missing.
      - name: Unit, contract-fixture and screenshot tests
        run: ./gradlew test :app:verifyRoborazziDebug
      - name: Lint
        run: ./gradlew lint
      - name: Debug APK
        run: ./gradlew assembleDebug
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            apps/android/**/build/reports/
            apps/android/**/build/outputs/roborazzi/
          retention-days: 7

  # Manually dispatched only, and a no-op until the owner adds the secrets below.
  # TODO(owner): in the repo's GitHub secrets, add
  #   PLAY_SERVICE_ACCOUNT_JSON        the Play Developer API service account key (JSON), with
  #                                    "Release to testing tracks" on the app in Play Console
  #   ANDROID_UPLOAD_KEYSTORE_BASE64   the upload keystore, base64 (Play App Signing holds the app key)
  #   ANDROID_UPLOAD_KEYSTORE_PASSWORD
  #   ANDROID_UPLOAD_KEY_ALIAS
  #   ANDROID_UPLOAD_KEY_PASSWORD
  # and set the repository variable ANDROID_PLAY_RELEASE_ENABLED=true. These names are
  # proposals; rename here and nowhere else.
  play-internal:
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.release &&
      vars.ANDROID_PLAY_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: play-internal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the secrets exist
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$PLAY_JSON" ] || [ -z "$KEYSTORE" ]; then
            echo "::error::Play release secrets are missing; see the TODO above the play-internal job"
            exit 1
          fi
      - name: Write the upload keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
      - name: Signed release bundle
        env:
          FOREVER_UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          FOREVER_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          FOREVER_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          FOREVER_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        # Play needs a rising versionCode; the run number always rises.
        run: ./gradlew bundleRelease -Pforever.versionCode=${{ github.run_number }}
      - name: Upload to the Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: gg.foreversixty.app
          releaseFiles: apps/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          # A Play app that has never been reviewed accepts only draft releases; switch to
          # completed once the first internal release has been rolled out from the Console.
          status: draft
      - if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/upload.jks"
