name: android
on:
  push:
    branches: [main, 'land/**']
    paths: ['apps/android/**', 'apps/shared/**', 'web/src/data/specs.json', 'apps/VERSION', 'docs/contracts/**', '.github/workflows/android.yml', '.github/actions/google-services/**', 'design/mocks/app/regions/android-*.json']
  pull_request:
    paths: ['apps/android/**', 'apps/shared/**', 'web/src/data/specs.json', 'apps/VERSION', 'docs/contracts/**', '.github/workflows/android.yml', '.github/actions/google-services/**', 'design/mocks/app/regions/android-*.json']
  # Releases go through apps-release.yml (tools/release-apps.sh), the one release path.
  # record: re-record every screenshot and text golden on this runner and upload them as
  # android-snapshots (the goldens compare exactly, so they are recorded where they are verified):
  #   gh workflow run android.yml --ref <branch> -f record=true
  #   gh run download <run> -n android-snapshots -D apps/android/app/src/test/screenshots
  workflow_dispatch:
    inputs:
      record:
        description: 'Re-record the screenshot and text goldens and upload them'
        type: boolean
        default: false
permissions: { contents: read }
concurrency:
  group: android-${{ startsWith(github.ref, 'refs/heads/land/') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    working-directory: apps/android
jobs:
  build:
    # Skipped in launch mode (docs/runbooks/landing.md, "Launch mode"), except a run started by
    # hand (a record run), which is never a push's check.
    if: vars.LAUNCH_MODE != 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The app, apps/shared, docs/contracts, the mocks' region files and avatars (the parity tests read them)
      # and the active build's data (data/builds, from the cache); the screenshot tests only write
      # under design/reviews (docs/runbooks/landing.md,
      # "Checkout").
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/builds/
            !/data/diffs/
            !/design/reviews/
            !/design/mocks/
            /design/mocks/app/regions/
            /design/mocks/data/avatars/
            !/docs/superpowers/reviews/
            !/apps/ios/
      - uses: ./.github/actions/data-builds
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      # services.gradle.org 504s now and then: fetch the wrapper's distribution with retries
      # before any Gradle step, so a flaky download fails here after 5 tries, not mid-test.
      - name: Fetch Gradle
        run: |
          for i in 1 2 3 4 5; do ./gradlew --version -q && exit 0; echo "::warning::Gradle download failed (try $i)"; sleep 30; done
          exit 1
      # Push: Firebase's client config from the GOOGLE_SERVICES_JSON secret; without it the
      # build passes and has no push. This workflow never signs or uploads (apps-release.yml does).
      - uses: ./.github/actions/google-services
        with:
          config: ${{ secrets.GOOGLE_SERVICES_JSON }}
      # The Android SDK on the runner is the image's; AGP downloads the platform it is missing.
      # One Gradle invocation, so the configuration is computed once and lint's analysis runs
      # alongside the unit and screenshot tests (the configuration cache lets tasks of one project
      # run in parallel); --continue reports every failing task, not just the first.
      - name: Unit, contract-fixture and screenshot tests, lint and the debug APK
        if: inputs.record != true
        run: ./gradlew --continue test :app:verifyRoborazziDebug lint assembleDebug
      # A failing non-screenshot test must not lose the recording: the goldens are uploaded
      # whatever the run's other tests did (as ios.yml's record mode).
      - name: Record the screenshot and text goldens
        if: inputs.record == true
        continue-on-error: true
        run: ./gradlew :app:recordRoborazziDebug
      - name: Upload the recorded goldens
        if: inputs.record == true && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: android-snapshots
          path: apps/android/app/src/test/screenshots/
          retention-days: 7
      - name: Lint and the debug APK
        if: inputs.record == true
        run: ./gradlew --continue lint assembleDebug
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            apps/android/**/build/reports/
            apps/android/**/build/outputs/roborazzi/
          retention-days: 7
