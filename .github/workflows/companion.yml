name: companion
on:
  # No paths filter on push: GitHub applies one filter set to every
  # ref in a push block, and a tag push changes no paths, so a paths
  # filter here would silently never release. Pull requests, where
  # the cost of running matters, are filtered.
  push:
    branches: [main, 'land/**']
    tags: ['companion-v*']
  pull_request:
    paths: ['companion/**', 'logs/**', 'docs/contracts/**', 'apps/shared/formats.json', '.github/workflows/companion.yml', 'tools/package-mac-companion.sh']
  workflow_dispatch:
    inputs:
      release:
        description: Cut a release from this commit even if nothing under companion/ changed
        type: boolean
        default: false
      dry_run:
        description: Build, sign and notarize every installer as the next version, but publish and tag nothing (the builds stay as this run's artifacts)
        type: boolean
        default: false
permissions: { contents: read }
concurrency:
  group: companion-${{ startsWith(github.ref, 'refs/heads/land/') && github.sha || github.ref }}
  # A newer push supersedes a pull request's run; a release run on main or a tag is
  # left to finish, or two pushes in a minute lose the release in between.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # The module is tested as it ships, not through the repo-root
  # workspace: a companion that only builds inside go.work is a
  # companion that does not build for a contributor who clones it.
  GOWORK: "off"
  # Build tag for every job that must not link a desktop toolkit.
  HEADLESS_TAGS: nogui
jobs:
  # ci-minutes lane, 2026-10-15: every push to main used to run the test job
  # (gofmt, vet, the race suite, the cgo window build) even when nothing the
  # companion is built from had changed, which was most of the ~250 runs a
  # month. This job asks the diff first, in seconds, and the test job runs
  # only when it says yes. Tags, dispatches and pull requests skip the
  # question: a tag is a release and must be tested, a dispatch asked for it,
  # and a pull request is already filtered by the paths above.
  changes:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      companion: ${{ steps.filter.outputs.companion }}
    steps:
      # The whole history, for the merge base, but no file contents: a name-only diff reads
      # commits and trees alone, so no blob is fetched and nothing past the repository root
      # is checked out (docs/runbooks/landing.md, "Checkout").
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, filter: 'blob:none', sparse-checkout: .github }
      # The same diff the version job decides a release by, so the two can
      # never disagree about what "touches the companion" means.
      # A new branch (a land/** batch, tools/land.sh) has no `before`: it is diffed against
      # where it leaves main.
      - id: filter
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            BEFORE=$(git merge-base origin/main "$GITHUB_SHA" 2>/dev/null || true)
          fi
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null \
             && ! git diff --name-only "$BEFORE" "$GITHUB_SHA" \
                  | grep -qE '^(companion/|logs/|docs/contracts/|apps/shared/formats\.json|\.github/workflows/companion\.yml|tools/package-mac-companion\.sh)'; then
            echo "companion=false" >> "$GITHUB_OUTPUT"
            echo "nothing the companion is built from changed; the test job is skipped"
          else
            # A real change, or no usable base commit (a force push, or the
            # first push): test rather than guess that nothing changed.
            echo "companion=true" >> "$GITHUB_OUTPUT"
          fi
  test:
    # Runs on tags too: a release is built from the exact tree that
    # passed, not from the commit the tag was cut from.
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result == 'skipped' || needs.changes.outputs.companion == 'true') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults: { run: { working-directory: companion } }
    steps:
      # The module reads companion/, logs/ and docs/contracts: the heavy trees stay out
      # (docs/runbooks/landing.md, "Checkout").
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/builds/
            !/data/diffs/
            !/design/reviews/
            !/design/mocks/
            !/docs/superpowers/reviews/
            !/apps/ios/
            !/apps/android/
      - uses: actions/setup-go@v5
        with: { go-version-file: companion/go.mod, cache-dependency-path: companion/go.sum }
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      # LAUNCH MODE (docs/runbooks/landing.md, "Launch mode"): gofmt, vet and the headless
      # build; the tests, the coverage floor and the window build are skipped. The job still
      # succeeds, so a release from main is unchanged.
      - name: lua5.1 for the addon contract golden test
        if: vars.LAUNCH_MODE != 'true'
        # contracts_test.go loads the rendered inbox under the client's Lua; with CI set it
        # fails, rather than logs, when no interpreter is found.
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: go vet -tags "$HEADLESS_TAGS" ./...
      - name: go build (launch mode)
        if: vars.LAUNCH_MODE == 'true'
        run: go build -tags "$HEADLESS_TAGS" ./...
      - if: vars.LAUNCH_MODE != 'true'
        run: go test -tags "$HEADLESS_TAGS" ./... -race -coverprofile=cover.out -coverpkg=./...
      - name: coverage floor
        if: vars.LAUNCH_MODE != 'true'
        # The window is excluded: cmd, internal/shell and ui are the
        # tray, the webview and three static files, none of which a Go
        # test can exercise without a desktop.
        run: |
          grep -v -E '/(cmd|internal/shell|ui)/' cover.out > cover-core.out
          total=$(go tool cover -func=cover-core.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "coverage outside the window: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t + 0 >= 80) ? 0 : 1 }' || {
            echo "coverage ${total}% is under the 80% floor"
            exit 1
          }
      # The window's formatters (ui/format.js) replay the house formats every surface shares,
      # apps/shared/formats.json; nothing else runs the window's JavaScript tests.
      - uses: actions/setup-node@v4
        if: vars.LAUNCH_MODE != 'true'
        with: { node-version-file: web/.node-version }
      - name: the window's formatters and copy guard
        if: vars.LAUNCH_MODE != 'true'
        run: node --test ui/format.test.js ui/copy.test.js
      - name: the window still compiles
        if: vars.LAUNCH_MODE != 'true'
        # Nothing here runs it; this only proves the cgo build is not
        # broken by a change to the headless side.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev
          go build ./...

  # Releases are automatic. A push to main that touches companion/, logs/ or this
  # workflow releases the next patch version after the newest companion-v* tag, and
  # the release step creates that tag at the commit it built. A tag pushed by hand still
  # works and sets the version explicitly, which is how a minor or major bump is made.
  # A push that touches nothing the companion is built from releases nothing.
  version:
    needs: test
    # `changes` is skipped on tags and dispatches, and a skipped job anywhere
    # up the needs chain skips its dependants unless the condition says
    # otherwise -- so every job below test asks for test's own result instead
    # of inheriting the chain (the 2026-10-15 dispatch released nothing).
    # A land/** batch only proves the tests; its release is cut once main has the sha.
    if: ${{ !cancelled() && needs.test.result == 'success' && github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/heads/land/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: decide
        env:
          BEFORE: ${{ github.event.before }}
          FORCE: ${{ github.event.inputs.release }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/companion-v* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "releasing the pushed tag $GITHUB_REF_NAME"
            exit 0
          fi
          # The base of the "did anything change" diff is the newest release tag, not
          # the push's `before` commit: a release run that a later push cancelled
          # (2026-10-20: fe7893e0's 0.2.6 run, cancelled by a docs push a minute later,
          # and the docs push then diffed only itself and released nothing) is picked
          # up by the next push, because the tree still differs from the last tag.
          last=$(git tag --list 'companion-v*' --sort=-v:refname | head -1)
          changed=false
          if [ "$FORCE" = "true" ] || [ "$DRY_RUN" = "true" ]; then
            changed=true
          elif [ -n "$last" ]; then
            if git diff --name-only "$last" "$GITHUB_SHA" \
                | grep -qE '^(companion/|logs/|\.github/workflows/companion\.yml|tools/package-mac-companion\.sh)'; then
              changed=true
            fi
          else
            # No release yet: release rather than guess that nothing changed.
            changed=true
          fi
          if [ "$changed" != true ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "nothing under companion/ or logs/ changed since $last; no release"
            exit 0
          fi
          if [ -z "$last" ]; then
            next=companion-v0.1.0
          else
            v=${last#companion-v}
            IFS=. read -r maj min pat <<<"$v"
            next="companion-v${maj}.${min}.$((pat+1))"
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run: building $next (previous: ${last:-none}); nothing is published or tagged"
          else
            echo "releasing $next (previous: ${last:-none})"
          fi

  build:
    needs: [test, version]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.version.outputs.release == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS is its own job (build-mac below): one universal app, signed,
          # notarized and packaged, which shares little with these steps.
          - { runner: windows-latest, goos: windows, goarch: amd64 }
          - { runner: ubuntu-22.04, goos: linux, goarch: amd64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # The signing environment carries the federated credential Azure trusts
    # (subject repo:jhunthrop/foreversixty:environment:signing); id-token
    # lets azure/login mint the OIDC token for it. Both are harmless on the
    # targets that never sign.
    environment: signing
    permissions: { contents: read, id-token: write }
    defaults: { run: { shell: bash, working-directory: companion } }
    env:
      TAG: ${{ needs.version.outputs.tag }}
      MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: companion/go.mod, cache-dependency-path: companion/go.sum }

      - name: Linux webview libraries
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev

      - name: Windows C toolchain
        if: matrix.goos == 'windows'
        run: |
          if ! command -v gcc >/dev/null; then
            choco install mingw -y --no-progress
          fi
          gcc --version

      - name: Windows icon and version resource
        # go-winres turns winres.json (the seal as the exe's icon, plus the
        # product, company and version fields Explorer shows) into a .syso
        # that `go build` links in by itself. Never committed: *.syso is
        # ignored, and the version is the tag's.
        if: matrix.goos == 'windows'
        run: |
          version="${TAG#companion-v}"
          go run github.com/tc-hib/go-winres@v0.3.3 make \
            --in cmd/foreversixty-companion/winres/winres.json \
            --out cmd/foreversixty-companion/rsrc \
            --arch "${{ matrix.goarch }}" \
            --file-version "$version" --product-version "$version"
          ls cmd/foreversixty-companion/*.syso

      - name: Build
        run: |
          version="${TAG#companion-v}"
          name="foreversixty-companion_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then name="${name}.exe"; fi
          mkdir -p dist
          ldflags="-s -w"
          ldflags="$ldflags -X github.com/jhunthrop/foreversixty/companion/internal/updater.Version=${version}"
          ldflags="$ldflags -X github.com/jhunthrop/foreversixty/companion/internal/updater.PublicKey=${MINISIGN_PUBLIC_KEY}"
          # Without this the tray app is a console application and
          # Windows opens a cmd window behind it for the life of the
          # process. The cost is that the binary then has no console
          # of its own: -version and -headless still write to stdout,
          # so the README tells Windows players to redirect them.
          if [ "${{ matrix.goos }}" = "windows" ]; then ldflags="$ldflags -H windowsgui"; fi
          CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "$ldflags" -o "dist/${name}" ./cmd/foreversixty-companion
          ls -l dist
          echo "ASSET=${name}" >> "$GITHUB_ENV"

      - name: Smoke test the binary
        # Every target runs natively on its runner. The Windows build has
        # no console, so this checks that it starts and exits cleanly; the
        # version it prints goes nowhere.
        run: ./dist/"${ASSET}" -version

      # Windows is signed through Azure Artifact Signing in Commish LLC's
      # name: Microsoft holds the key, the runner authenticates with the
      # federated credential above, and the certificate profile named by
      # AZURE_SIGNING_PROFILE is what the signature carries. The variable
      # is only set once the profile exists (identity validation has to
      # pass first), so until then every release ships unsigned and says so.
      - name: Azure login for signing
        if: matrix.goos == 'windows' && vars.AZURE_SIGNING_PROFILE != ''
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The companion is signed first, because the setup program carries it: the setup is
      # built around the signed exe, then signed itself by the same profile.
      - name: Sign for Windows
        if: matrix.goos == 'windows' && vars.AZURE_SIGNING_PROFILE != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\companion\dist\${{ env.ASSET }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # foreversixty-companion-setup.exe: the download /setup offers (saved as ForeverSixtySetup.exe).
      # It is the signed companion itself under a setup name: run from anywhere but the install
      # folder it shows its own install window and installs itself (companion/internal/install,
      # setup.go). The bare exe beside it stays in the release for the updater.
      - name: The Windows setup
        if: matrix.goos == 'windows'
        run: cp "dist/${ASSET}" dist/foreversixty-companion-setup.exe

      - name: Check the Windows signatures
        # A release never carries a binary the OS would call unsigned: each signature must
        # verify and name the company.
        if: matrix.goos == 'windows' && vars.AZURE_SIGNING_PROFILE != ''
        shell: pwsh
        run: |
          foreach ($file in @("dist/$env:ASSET", "dist/foreversixty-companion-setup.exe")) {
            $sig = Get-AuthenticodeSignature $file
            "${file}: status $($sig.Status); signer $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "$file is not validly signed: $($sig.StatusMessage)" }
            if ($sig.SignerCertificate.Subject -notmatch 'Commish LLC') { throw "unexpected signer on ${file}: $($sig.SignerCertificate.Subject)" }
          }
          $info = (Get-Item "dist/$env:ASSET").VersionInfo
          "version info: $($info.ProductName) / $($info.FileDescription) / $($info.CompanyName) / $($info.LegalCopyright) / $($info.ProductVersion)"

      - name: Unsigned Windows build
        if: matrix.goos == 'windows' && vars.AZURE_SIGNING_PROFILE == ''
        run: echo "::notice::AZURE_SIGNING_PROFILE is not set, so this Windows build is unsigned."

      # A dry run plays a player on the runner: install, the companion's first run, the setup
      # again over the running install (an upgrade), the light theme, then Apps & Features'
      # uninstall, logging what each left behind. The screens are kept as the run's
      # dryrun-windows-captures artifact (never companion-*, so a release could not pick them up).
      - name: Try the setup on the runner (dry run)
        if: matrix.goos == 'windows' && github.event.inputs.dry_run == 'true'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory captures | Out-Null
          function Snap([string]$name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD\captures\$name.png")
          }
          # The window's one button, clicked as a player would: keys sent to the window never
          # reach the web view inside it. The button sits at the same place in every mode.
          Add-Type -TypeDefinition @"
          using System; using System.Runtime.InteropServices;
          public static class Mouse {
            public struct Rect { public int Left, Top, Right, Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out Rect r);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint x, uint y, uint d, UIntPtr e);
          }
          "@
          function Press([System.Diagnostics.Process]$p) {
            $p.Refresh()
            $h = $p.MainWindowHandle
            $null = [Mouse]::SetForegroundWindow($h)
            $r = New-Object Mouse+Rect
            $null = [Mouse]::GetWindowRect($h, [ref]$r)
            $null = [Mouse]::SetCursorPos($r.Left + 92, $r.Top + 315)
            [Mouse]::mouse_event(2, 0, 0, 0, [UIntPtr]::Zero); [Mouse]::mouse_event(4, 0, 0, 0, [UIntPtr]::Zero)
          }
          function State([string]$when) {
            $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).'Forever Sixty'
            $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ForeverSixty' -ErrorAction SilentlyContinue
            $lnk = Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Forever Sixty.lnk"
            $running = @(Get-Process foreversixty-companion -ErrorAction SilentlyContinue).Count
            "${when}: exe $(Test-Path "$dir\foreversixty-companion.exe"); shortcut $lnk; startup '$run'; running $running"
            if ($entry) { $entry | Format-List DisplayName, DisplayVersion, Publisher, DisplayIcon, EstimatedSize, UninstallString, URLInfoAbout }
          }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Forever Sixty'

          $setup = Start-Process dist\foreversixty-companion-setup.exe -PassThru
          Start-Sleep 8; Snap 'win-1-setup'
          $clicked = Get-Date; Press $setup
          Start-Sleep -Milliseconds 250; Snap 'win-2-installing'
          $setup.WaitForExit(30000) | Out-Null
          "setup finished $([int]((Get-Date) - $clicked).TotalMilliseconds) ms after the click"
          Start-Sleep 12; Snap 'win-3-first-run'
          State 'after install'

          $upgrade = Start-Process dist\foreversixty-companion-setup.exe -PassThru
          Start-Sleep 8; Snap 'win-4-upgrade'
          Press $upgrade; $upgrade.WaitForExit(30000) | Out-Null
          Start-Sleep 10
          State 'after the upgrade'

          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' AppsUseLightTheme 1
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' SystemUsesLightTheme 1
          $light = Start-Process dist\foreversixty-companion-setup.exe -PassThru
          Start-Sleep 8; Snap 'win-5-setup-light-theme'
          Stop-Process -Id $light.Id
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' AppsUseLightTheme 0
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' SystemUsesLightTheme 0

          $remove = Start-Process "$dir\foreversixty-companion.exe" -ArgumentList '-uninstall' -PassThru
          Start-Sleep 8; Snap 'win-6-uninstall'
          Press $remove
          Start-Sleep 1; Snap 'win-7-removed'
          $remove.WaitForExit(30000) | Out-Null
          Start-Sleep 8
          State 'after the uninstall'
          if (Test-Path "$dir\foreversixty-companion.exe") { throw "the uninstall left the companion behind" }

      - name: Keep the setup's screens (dry run)
        if: always() && matrix.goos == 'windows' && github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dryrun-windows-captures
          path: companion/captures/*
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: companion-${{ matrix.goos }}-${{ matrix.goarch }}
          path: companion/dist/*
          if-no-files-found: error

  # The macOS companion: one universal app (Apple silicon and Intel), signed with the
  # Developer ID certificate in Commish LLC's name, notarized by Apple with the App Store
  # Connect API key and stapled, then published as a disk image for /setup and a zipped
  # app for the updater (tools/package-mac-companion.sh). A macOS runner bills at ten
  # times the Linux rate, so this job runs only when a release is cut: a companion-v* tag,
  # a dispatch, or a push to main that releases. It never runs for the test job, a land
  # branch or a pull request. Every release carries the Mac build, because the feed's
  # latest.json names only the newest release's files; one without it would take the Mac
  # download and the Mac updater offline until the next.
  #
  # Until the certificate is in the repository (APPLE_CERTIFICATE_P12), the app is signed
  # ad hoc, nothing is notarized, and the build is kept as a run artifact for testing; the
  # release publishes no Mac build. docs/runbooks/companion-release.md has the owner's
  # one-time certificate steps.
  build-mac:
    needs: [test, version]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.version.outputs.release == 'true' }}
    # macos-latest, the standard Apple silicon image: macos-14 is gone ("The configuration
    # 'macos-14-arm64-us-default' is not supported", 0.2.37's first run, 2026-11-07). Only Xcode's
    # command line tools are used (clang, lipo, codesign, notarytool, stapler, hdiutil), so any
    # image's Xcode does.
    runs-on: macos-latest
    timeout-minutes: 60
    defaults: { run: { shell: bash, working-directory: companion } }
    env:
      TAG: ${{ needs.version.outputs.tag }}
      MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      # Optional: the certificate's name, to pin it. Unset, the one Developer ID
      # Application identity in the imported .p12 is used.
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
        with:
          # logs/ is the companion's replaced module (companion/go.mod).
          sparse-checkout: |
            companion
            logs
            tools
            web/src/data/companion.json
      - uses: actions/setup-go@v5
        with: { go-version-file: companion/go.mod, cache-dependency-path: companion/go.sum }

      - name: Build the universal binary
        # Intel is cross-compiled on the Apple silicon runner (Xcode's clang is a universal
        # compiler; GitHub's Intel runners are retired), and lipo joins the two. The minimum
        # system matches the Info.plist's: Go 1.25 runs on macOS 12 and later.
        run: |
          version="${TAG#companion-v}"
          ldflags="-s -w"
          ldflags="$ldflags -X github.com/jhunthrop/foreversixty/companion/internal/updater.Version=${version}"
          ldflags="$ldflags -X github.com/jhunthrop/foreversixty/companion/internal/updater.PublicKey=${MINISIGN_PUBLIC_KEY}"
          mkdir -p dist
          for goarch in arm64 amd64; do
            arch=$goarch; [ "$goarch" = amd64 ] && arch=x86_64
            flags="-arch $arch -mmacosx-version-min=12.0"
            CGO_ENABLED=1 GOOS=darwin GOARCH=$goarch \
              CGO_CFLAGS="$flags" CGO_CXXFLAGS="$flags" CGO_LDFLAGS="$flags" \
              go build -trimpath -ldflags "$ldflags" -o "dist/companion-$goarch" ./cmd/foreversixty-companion
          done
          lipo -create -output dist/foreversixty-companion dist/companion-arm64 dist/companion-amd64
          lipo -info dist/foreversixty-companion
          # Natively, then under Rosetta: both halves start.
          ./dist/foreversixty-companion -version
          arch -x86_64 ./dist/foreversixty-companion -version

      - name: Import the Developer ID certificate
        if: env.APPLE_CERTIFICATE_P12 != ''
        # Into a keychain of the job's own, which the last step deletes. The identity is
        # read from the certificate itself, so no secret has to repeat its name.
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_password=$(uuidgen)
          security create-keychain -p "$kc_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kc_password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -f pkcs12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$kc_password" "$keychain" >/dev/null
          existing=$(security list-keychains -d user | tr -d '"')
          # shellcheck disable=SC2086 # one keychain path per word, none with a space
          security list-keychains -d user -s "$keychain" $existing
          identities=$(security find-identity -v -p codesigning "$keychain" | grep 'Developer ID Application' || true)
          echo "$identities"
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            grep -qF "\"$APPLE_SIGNING_IDENTITY\"" <<<"$identities" || {
              echo "::error::the certificate does not carry APPLE_SIGNING_IDENTITY ($APPLE_SIGNING_IDENTITY)"
              exit 1
            }
            identity=$APPLE_SIGNING_IDENTITY
          else
            [ "$(grep -c . <<<"$identities")" = 1 ] || {
              echo "::error::APPLE_CERTIFICATE_P12 must hold exactly one Developer ID Application identity"
              exit 1
            }
            identity=$(sed -E 's/.*"(.*)".*/\1/' <<<"$identities")
          fi
          echo "signing as: $identity"
          {
            echo "MAC_SIGNING_IDENTITY=$identity"
            echo "MAC_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"

      - name: The App Store Connect key for notarization
        if: env.APPLE_CERTIFICATE_P12 != ''
        # The key is stored either as the .p8 file's text or base64 of it; both work.
        run: |
          key="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          if grep -q 'BEGIN PRIVATE KEY' <<<"$ASC_KEY_P8"; then
            printf '%s\n' "$ASC_KEY_P8" > "$key"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          {
            echo "NOTARY_KEY_FILE=$key"
            echo "NOTARY_KEY_ID=$ASC_KEY_ID"
            echo "NOTARY_ISSUER=$ASC_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: No certificate yet
        if: env.APPLE_CERTIFICATE_P12 == ''
        # Once /setup offers the Mac build, a release without it would break that link, so a
        # missing certificate then fails the release instead of quietly dropping the Mac app.
        run: |
          if jq -e '.downloads[] | select(.asset | test("darwin"))' ../web/src/data/companion.json >/dev/null; then
            echo "::error::/setup offers a Mac build (web/src/data/companion.json) but APPLE_CERTIFICATE_P12 is not set"
            exit 1
          fi
          echo "::notice::APPLE_CERTIFICATE_P12 is not set, so the Mac app is signed ad hoc, \
          not notarized, and not published; it is kept as this run's unsigned-companion-darwin artifact."

      - name: create-dmg for the disk image's window
        run: brew install create-dmg

      - name: Package the app
        run: ../tools/package-mac-companion.sh "${TAG#companion-v}" dist/foreversixty-companion dist/mac

      - name: Publish the signed Mac build to the release
        if: env.APPLE_CERTIFICATE_P12 != ''
        uses: actions/upload-artifact@v4
        with:
          name: companion-darwin-universal
          path: companion/dist/mac/*
          if-no-files-found: error

      - name: Keep the unsigned Mac build for testing
        if: env.APPLE_CERTIFICATE_P12 == ''
        # Not named companion-*, so the release never picks it up.
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-companion-darwin
          path: companion/dist/mac/*
          retention-days: 7

      - name: Remove the keychain and the key
        if: always()
        run: |
          if [ -n "${MAC_KEYCHAIN:-}" ]; then security delete-keychain "$MAC_KEYCHAIN" || true; fi
          rm -f "${NOTARY_KEY_FILE:-}"

  release:
    # The Mac build must pass too, signed or not: a release without its Mac app would
    # take the Mac download offline (see build-mac).
    needs: [build, build-mac, version]
    # A dry run (workflow_dispatch with dry_run) stops before this job: its builds stay as the
    # run's artifacts, and no tag, release or feed entry is made.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build-mac.result == 'success' && needs.version.outputs.release == 'true' && github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: { contents: write }
    env:
      TAG: ${{ needs.version.outputs.tag }}
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
      MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
      MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      # companion-* only: the unsigned Mac build of a run without the certificate stays out.
      - uses: actions/download-artifact@v4
        with: { path: staged, pattern: 'companion-*', merge-multiple: true }
      - run: ls -l staged

      - name: Sign the assets with minisign
        if: env.MINISIGN_SECRET_KEY != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          for f in staged/*; do
            case "$f" in *.minisig) continue;; esac
            printf '%s\n' "$MINISIGN_PASSWORD" | \
              minisign -S -s "$RUNNER_TEMP/minisign.key" -m "$f" \
                -t "Forever Sixty companion ${TAG}"
          done
          rm -f "$RUNNER_TEMP/minisign.key"
          ls -l staged

      - name: Unsigned release
        if: env.MINISIGN_SECRET_KEY == ''
        run: |
          echo "::notice::MINISIGN_SECRET_KEY is not set, so this release carries no \
          signatures and installed companions will not update themselves to it."

      - name: Publish the public key
        if: env.MINISIGN_PUBLIC_KEY != ''
        run: printf '%s\n' "$MINISIGN_PUBLIC_KEY" > staged/MINISIGN_PUBLIC_KEY.txt

      - name: No public key to publish
        if: env.MINISIGN_PUBLIC_KEY == ''
        run: |
          echo "::notice::MINISIGN_PUBLIC_KEY is not set, so this release does not publish \
          MINISIGN_PUBLIC_KEY.txt; these binaries were built without a compiled-in key and \
          will not verify or self-update."

      - name: Publish
        run: |
          # --target makes gh create the tag at this commit when it does not exist yet,
          # which is every automatic release; a hand-pushed tag already exists and is used.
          # --latest keeps this the release GitHub serves at releases/latest: the
          # site's download links and the companion's own updater both resolve
          # through it, and the addon and nightly data releases in the same repo
          # publish with make_latest off so they never take it (2026-10-19: the
          # data-v release had, and every companion link on the site was a 404).
          gh release create "$TAG" staged/* \
            --latest \
            --target "$GITHUB_SHA" \
            --title "Companion ${TAG#companion-v}" \
            --notes "Desktop companion ${TAG#companion-v} for macOS, Windows and Linux. \
          Each binary is published beside its minisign signature; companion/README.md has the \
          public key and the command to check one."

      - uses: actions/setup-node@v4
        if: env.MINISIGN_SECRET_KEY != ''
        with: { node-version-file: web/.node-version }
      - name: publish to the site's release feed
        # Beside the GitHub release just made, signed builds only.
        # The same signed files go to foreversixty.gg/dl/companion/ (tools/publish-feed.sh,
        # web/src/lib/downloads), which /setup links to and the companion updates from, so
        # nothing depends on this repository's releases once it is private
        # (docs/runbooks/repo-private.md). Only a signed release reaches the feed.
        if: env.MINISIGN_SECRET_KEY != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: tools/publish-feed.sh companion "$TAG" staged/*
