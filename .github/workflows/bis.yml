# .github/workflows/bis.yml
# Nightly: rank leveling BiS for every written spec (sim/cmd/leveling-bis,
# docs/superpowers/specs/2026-09-28-leveling-bis-design.md - "built once
# per spec and band, never per character") and commit the result to main,
# the same commit/push-with-skip-when-unchanged pattern data.yml's own
# `fetch` job uses for data/builds/*/ (addon-data-release.yml, the other
# nightly job in this repo, does not actually commit to main - it commits
# only to a throwaway packaging checkout for the release zip - so this
# follows data.yml's shape instead; see the lane report).
#
# The ranking is event driven (docs/runbooks/landing.md, "The refresh chain"):
#
#   workflow_run -- a dispatched data.yml run finished green on main, so its fetch job
#                   committed new data for a build (a hand refresh); a push-triggered
#                   data run (the test and addon-data jobs) starts nothing here, the
#                   push itself carried the change and the nightly's inputs hash sees it;
#   push         -- sim/enginever/version.go moved on main by a person's push: a hand pin
#                   from a sim lane, whose fixes reach the picks only through a re-rank.
#                   engine.yml's own pin is pushed with GITHUB_TOKEN, which starts no push
#                   run, so that job dispatches this workflow itself, with force;
#   dispatch     -- by hand, or by engine.yml's green pin and tools/activate-build.sh (the
#                   client move), both with force;
#   schedule     -- 06:23 UTC, the safety net: an off-minute (avoids the top-of-hour
#                   pile-up GitHub Actions' own scheduler docs warn about) and after the
#                   client watcher (03:41) and the engine follow (05:07) have room to land.
#
# Every start but a forced dispatch ranks only when the inputs hash below moved, so a
# chained run that finds nothing new skips the ranking after the crawl. The `bis`
# concurrency group keeps two rankings from ever overlapping: a start while one runs
# queues behind it (and replaces any start already queued). This workflow's own commits
# are pushed with GITHUB_TOKEN, which starts no workflow: they never loop back into
# data.yml's push run or this one.
#
# Shape (2026-11-12): the ranking fans out across machines, because the engine already
# uses every core of one and a full -all run (239 minutes on a fast 4-vCPU host, 1.3 to
# 1.5x that on a slow one) outgrew a single job (run 43269156099 timed out at 330).
#
# Nothing finished is ever thrown away (2026-11-13, after a lost runner and a dead commit
# job cost whole rankings): every spec lands as soon as its leg ends, and a later run
# resumes from what landed.
#
#   prepare  -- main's head, the crawl commit, the engine verdict, the inputs hash
#               (tools/bis-inputs-hash.sh), and the matrix (tools/bis-matrix.sh: one leg per
#               class, every written spec). When some but not all specs on main carry the
#               hash (bis/<spec>.inputs), the run is a resume: no crawl, so the hash holds;
#               when all do, nothing is ranked (unless forced);
#   rank     -- the matrix. Each leg ranks its specs one step each
#               (.github/actions/rank-spec): a spec whose picks on the branch carry the hash
#               is skipped, every other is ranked and uploaded as bis-picks-<class>-<spec>
#               the moment it finishes. The leg then lands what it finished, red or green,
#               on the branch as it is NOW (tools/bis-land.sh: fetch, copy the picks and
#               their markers over, render the addon data there, fast-forward push, retried
#               from a fresh fetch when another leg pushed first). Picks for a build main no
#               longer has active do not land;
#   finish   -- after every leg: the sanity checks, the deploy when any leg landed, and the
#               red verdict naming the legs that did not finish green;
#   remeasure -- only on the first ranking after a client move (the build's
#               dps-per-point.carried-from) whose every leg finished green: one leg per class
#               re-measures its specs' dps-per-point on the landed picks;
#   remeasure-land -- merges the legs' figures over the carry and lands them (the marker
#               deleted, the manifest and Data.lua in step) when every leg is green. A dead
#               or red re-measure never costs a ranking (run 43445589374 lost its runner 57
#               minutes into a single-process re-measure and every class's picks with it);
#   land-run -- the land_run input: a past run's kept artifacts landed through the same
#               path, the one-click recovery of any finished work;
#   stalled  -- the red run for a ranking stalled on the engine for a second night.
#
# The wall clock is the slowest class plus the two ends: the priests (Holy 44 to 67
# minutes, Discipline 34 to 52) make the longest leg, about 80 minutes fast and 120 slow,
# so a night is about 100 to 140 minutes instead of 240 to 360.
#
# Off main (a dispatch on a lane branch, the proof run of a workflow change) nothing is
# deployed and the crawl is not committed; the landings are checked with `git push
# --dry-run`, or pushed to the lane branch itself with land_on_branch, so the whole
# rank-land-resume path runs on a couple of quick specs (the `specs` input).
name: bis
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rank even if nothing the ranker reads has changed since the last picks
        type: boolean
        default: false
      specs:
        description: "Rank only these specs (comma-separated slugs, e.g. rogue-assassination,hunter-marksmanship); empty ranks every written spec."
        type: string
        default: ''
      land_run:
        description: "Land a past bis run's picks (its run id) on this branch and deploy; nothing is ranked. Recovers the finished specs of a run that failed."
        type: string
        default: ''
      land_on_branch:
        description: "Off main only: push the landings to this branch instead of a dry run (a proof run of the landing and resume path)."
        type: boolean
        default: false
      fail_spec:
        description: "Proof runs only: this spec fails before ranking, as a lost spec would."
        type: string
        default: ''
  push:
    branches: [main]
    paths: ['sim/enginever/version.go']
  workflow_run:
    workflows: [data]
    types: [completed]
    branches: [main]
permissions: { contents: read }
# A workflow_run start that the job below skips (a push-triggered data run, or a red one)
# must not enter the `bis` group: with cancel-in-progress off, a new pending start replaces
# the one already queued, so such a start cancelled a queued pin ranking (2026-11-12,
# run 43257973261). It gets a group of its own and skips alone. A start off main (a lane
# branch's proof run) gets the branch's own group: it neither waits behind main's ranking
# nor replaces a start queued there.
concurrency:
  group: ${{ github.event.inputs.land_run && format('bis-land-{0}', github.run_id) || (github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion != 'success' || github.event.workflow_run.event != 'workflow_dispatch')) && format('bis-skip-{0}', github.run_id) || (github.ref != 'refs/heads/main' && format('bis-{0}', github.ref_name)) || 'bis' }}
  cancel-in-progress: false
env:
  # Only main is ever deployed; see "Off main" above.
  PUBLISH: ${{ github.ref == 'refs/heads/main' }}
  # Where the landings push: main, or a lane branch whose proof run asked for it.
  LAND_PUSH: ${{ github.ref == 'refs/heads/main' || github.event.inputs.land_on_branch == 'true' }}
jobs:
  prepare:
    # A data run counts only when it finished green and was a dispatch (the fetch job
    # commits on a dispatch, never on a push); every other start runs as before.
    if: >-
      !github.event.inputs.land_run && (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    # The crawl is a few minutes; a night that fills in a quest level also fetches the raw
    # tables and rebuilds loot.json in full.
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      build: ${{ steps.identity.outputs.build }}
      sha: ${{ steps.identity.outputs.sha }}
      verdict: ${{ steps.engine.outputs.verdict }}
      line: ${{ steps.engine.outputs.line }}
      hash: ${{ steps.inputs.outputs.hash }}
      skip: ${{ steps.inputs.outputs.skip }}
      # The sha every leg checks out: main's head after tonight's crawl commit, so all of
      # them rank one tree.
      head: ${{ steps.inputs.outputs.head }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      # Every class in data/curated/specs.json (the re-measure covers every spec, written
      # rotation or not), and whether the build's dps-per-point.json is still a carry.
      classes: ${{ steps.matrix.outputs.classes }}
      remeasure: ${{ steps.matrix.outputs.remeasure }}
    steps:
      # main's head as it is now, not the sha the event names: a workflow_run names the
      # default branch's head when the data run finished, a push names the pushed commit,
      # and the ranking reads (and commits over) whatever main holds when it starts. (The
      # ref's name, so a dispatch on a lane branch reads that branch.)
      - uses: actions/checkout@v4
        with: { ref: '${{ github.ref_name }}' }
      # The active build and the pinned engine sha, for the commit
      # message below - read the same way sim.yml's "the pinned engine
      # sha" step and the Makefile's own ACTIVE_BUILD do, not
      # hand-maintained here.
      - name: build and engine identity
        id: identity
        run: |
          build=$(sed -n 's/.*"build"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' web/src/data/active-build.json)
          test -n "$build" || { echo "web/src/data/active-build.json names no build"; exit 1; }
          sha=$(sed -n 's/.*Version = "\(.*\)"/\1/p' sim/enginever/version.go)
          test -n "$sha" || { echo "sim/enginever/version.go has no Version"; exit 1; }
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # 2026-09-28 quest-levels lane: fill in the quest ids
      # cmangos/classic-db does not have (Forever-new quests --
      # data/pipeline/quest_levels.py's own doc) from wowhead, a FEW at
      # a time (--max-pages 200) and from THIS runner's own address, not
      # a contributor's -- wowhead throttles hard (see
      # pipeline.wowhead_quests's doc), so this fills in over successive
      # nights rather than trying to finish in one run. Always exits 0
      # (never fails the job): any id still missing after the budget
      # just falls back to item_level_proxy at `loot` time, same as
      # today, and the NEXT night's run resumes from the warm cache.
      #
      # The engine fork is cloned at the PINNED sha (actions/checkout
      # treats a short sha as a branch name and fails to fetch it), the
      # same pattern data.yml's own `loot` step uses -- both `quest-
      # levels` and `loot` need the ids/database only a real local
      # checkout has, which `pin-engine`'s go.mod replace does not
      # provide.
      - name: the engine fork at the pin
        run: |
          git clone --quiet --filter=blob:none https://github.com/jhunthrop/wowsims-forever .engine
          git -C .engine checkout --quiet "${{ steps.identity.outputs.sha }}"
      # Never rank with a mismatched engine (2026-10-30 rehearsal): an engine stamped for
      # another client build reads this build's talent strings by the old trees' indexes,
      # so its picks would be quietly wrong. Until engine.yml pins an engine that follows
      # the active build, the picks and dps-per-point carried by tools/activate-build.sh
      # stay live; that pin's green push dispatches this workflow with force. The crawl
      # below still runs: it reads no engine stamp.
      # A second night of waiting (the follow went to review and nobody finished it), or
      # a stamp that cannot be read, is "stalled": the job still commits tonight's crawl,
      # then fails visibly at its last step (tools/engine/ranking-wait.sh, review M1).
      - name: the pinned engine follows the active build
        id: engine
        env:
          BUILD: ${{ steps.identity.outputs.build }}
          SHA: ${{ steps.identity.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # When active-build.json last changed: the checkout is shallow, so ask GitHub. A
          # failed lookup is "unknown", which stalls a mismatched engine (a red run naming
          # the lookup) and never reads as "now" (tools/engine/ranking-verdict.sh).
          moved=$(gh api "repos/$GITHUB_REPOSITORY/commits?path=web/src/data/active-build.json&per_page=1" --jq '.[0].commit.committer.date' 2>/dev/null) || moved=""
          if [ -n "$moved" ] && moved=$(date -u -d "$moved" +%s 2>/dev/null); then :; else
            echo "::warning::could not read when active-build.json last changed"
            moved=unknown
          fi
          # Captured, not read from a process substitution, so a failing verdict fails here.
          out=$(tools/engine/ranking-verdict.sh . .engine "$BUILD" "$moved")
          verdict=${out%%$'\t'*}
          line=${out#*$'\t'}
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          if [ "$verdict" = rank ]; then
            echo "follows=true" >> "$GITHUB_OUTPUT"
            echo "the pinned engine $SHA: $line"
          else
            echo "follows=false" >> "$GITHUB_OUTPUT"
            echo "line=$line" >> "$GITHUB_OUTPUT"
            echo "::warning title=ranking waits for engine follow::$line (engine $SHA)"
            echo "- $line (engine $SHA)" >> "$GITHUB_STEP_SUMMARY"
          fi
      # One leg per class, every spec with a written rotation (tools/bis-matrix.sh; the
      # `specs` input narrows it, and a name with no written rotation fails here, before
      # any leg starts). Computed before the skip decision so the rank job's matrix is
      # never an empty expression.
      - name: the rank matrix
        id: matrix
        env:
          SPECS: ${{ github.event.inputs.specs }}
          BUILD: ${{ steps.identity.outputs.build }}
        run: |
          matrix=$(tools/bis-matrix.sh . "$SPECS")
          echo "$matrix" | jq .
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "classes=$(jq -c '[.[].class_slug] | unique' data/curated/specs.json)" >> "$GITHUB_OUTPUT"
          # A partial ranking (the specs input) never re-measures: the figures are measured
          # on every spec's picks at once, and the marker goes only when all of them are.
          if [ -f "data/builds/$BUILD/dps-per-point.carried-from" ] && [ "$SPECS" = "" ]; then
            echo "remeasure=true" >> "$GITHUB_OUTPUT"
          else
            echo "remeasure=false" >> "$GITHUB_OUTPUT"
          fi
      # The ranking keeps its progress (2026-11-13: rankings were lost to a dead runner and a
      # dead commit job, days of work): every landed spec carries the hash of the inputs it
      # was ranked on (tools/bis-inputs-hash.sh) as bis/<spec>.inputs. When some but not all
      # of this run's specs carry tonight's hash, this run is the resume of a ranking that
      # stopped part way: it skips the crawl (a crawl commit would move the hash and throw the
      # finished specs away) and each leg ranks only what is missing. A forced run ranks all.
      - name: resume a ranking that stopped part way
        id: resume
        env:
          BUILD: ${{ steps.identity.outputs.build }}
          FORCE: ${{ github.event.inputs.force }}
          MATRIX: ${{ steps.matrix.outputs.matrix }}
        run: |
          hash=$(tools/bis-inputs-hash.sh "$BUILD")
          all=$(echo "$MATRIX" | jq -r '[.include[].specs] | join(",")')
          pending=$(tools/bis-pending.sh "$BUILD" "$hash" "$MATRIX")
          if [ "$FORCE" != true ] && [ -n "$pending" ] && [ "$pending" != "$all" ]; then
            echo "::notice title=resuming the ranking::inputs $hash; still to rank: $pending"
            echo "resume=true" >> "$GITHUB_OUTPUT"
          else
            echo "resume=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v3
      - name: fill in quest levels and item sources from wowhead, then regenerate loot.json
        if: steps.resume.outputs.resume != 'true'
        working-directory: data
        run: |
          uv sync
          summary=$(uv run python -m pipeline quest-levels --build "${{ steps.identity.outputs.build }}" --engine ../.engine --max-pages 200 | tee /dev/stderr | grep -E '^quest-levels: [0-9]+/' | tail -1)
          quests_fetched=$(echo "$summary" | sed -E 's/^quest-levels: ([0-9]+)\/.*/\1/')
          # night-item-sources lane, 2026-09-28: the same fill-in, for items
          # the fork database names NO source for at all (pipeline.item_sources'
          # own doc). Needs no raw/ CSVs or engine checkout -- it reads the
          # already-committed items/<class>.json and loot.json for this build --
          # so it runs unconditionally, same as quest-levels above.
          items_summary=$(uv run python -m pipeline item-sources --build "${{ steps.identity.outputs.build }}" --max-pages 200 | tee /dev/stderr)
          items_fetched=$(echo "$items_summary" | sed -E 's/^item-sources: wowhead resolved a page for ([0-9]+)\/.*/\1/')
          # src-classicdb lane, 2026-09-29: `loot-merge` re-derives loot.json
          # from every COMMITTED input (engine fork, zones.json, items.json,
          # quest-levels.json, item-sources.json, raw/classicdb/sources.json)
          # with NO raw/ CSVs at all -- unlike the gated full rebuild below,
          # it never needs `fetch` or its ItemSparse completeness gate, so it
          # runs every night unconditionally, picking up tonight's quest-level
          # and item-source fill-ins (and any re-itemisation the pipeline can
          # newly resolve) even on a night the gated rebuild cannot run.
          uv run python -m pipeline loot-merge --build "${{ steps.identity.outputs.build }}" --engine ../.engine
          # loot.json is then rebuilt IN FULL from the client's raw tables,
          # which are not committed (data.yml's fetch job downloads them from
          # wago.tools) -- this supersedes the merge-only pass above with the
          # complete one (real ItemSparse-derived PvP ranks, real Map.csv
          # instance zones) whenever raw tables are healthy enough to fetch.
          # Only a night that filled in at least one quest level or item
          # source pays for that download; every other night the merge-only
          # pass above is already what a full rebuild would additionally add.
          # `fetch` and `loot` each carry a completeness gate over ItemSparse.csv
          # (pipeline/csvio.py's check_item_sparse_completeness -- night-fetch-guard,
          # 2026-09-29: wago.tools silently served a truncated ItemSparse export that
          # would have halved every class's committed items/<class>.json). The gate
          # checks BEFORE writing, so a trip leaves the merge-only loot.json from
          # above in place rather than reverting to last night's. It is reported as
          # a workflow warning and the full rebuild is skipped rather than failing
          # the job: the wowhead caches fetched above are still committed (so the
          # crawl keeps its place) and the picks below still run on the merge-only
          # loot.json. The first night wago is complete again, the full rebuild
          # happens on its own.
          if [ "${quests_fetched:-0}" -gt 0 ] || [ "${items_fetched:-0}" -gt 0 ]; then
            if uv run python -m pipeline fetch --product wow_classic_era --build "${{ steps.identity.outputs.build }}" \
               && uv run python -m pipeline loot --build "${{ steps.identity.outputs.build }}" --engine ../.engine; then
              echo "loot.json rebuilt in full"
            else
              echo "::warning title=full loot rebuild skipped::the raw-table completeness gate tripped (see the log); the merge-only loot.json from loot-merge is kept"
            fi
          else
            echo "no quest level or item source filled in tonight; loot-merge's own loot.json stands"
          fi
      - name: commit quest-levels.json, item-sources.json and loot.json if they changed
        if: steps.resume.outputs.resume != 'true'
        id: crawl
        run: |
          paths=("data/builds/${{ steps.identity.outputs.build }}/raw/quests/quest-levels.json"
                 "data/builds/${{ steps.identity.outputs.build }}/raw/items/item-sources.json"
                 "data/builds/${{ steps.identity.outputs.build }}/loot.json"
                 "data/builds/${{ steps.identity.outputs.build }}/manifest.json")
          if [ "$PUBLISH" != true ]; then
            echo "off main: the crawl is not committed; it would commit:"
            git status --short -- "${paths[@]}"
            exit 0
          fi
          git config user.name "forever-bis-bot"
          git config user.email "bot@foreversixty.gg"
          git add "${paths[@]}"
          if ! git commit -m "chore(data): nightly quest-level and item-source fill-in for ${{ steps.identity.outputs.build }}"; then
            echo "nothing to commit"
            exit 0
          fi
          pushed=false
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME"; then
              git push && { pushed=true; break; }
            elif [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              # The rebase stopped on one of THIS commit's own generated files
              # (loot.json regenerated on main while the crawl ran, 2026-09-29):
              # tonight's regeneration wins, finish the rebase, restore the
              # autostash (the engine replace the picks step needs).
              git checkout --theirs -- "data/builds/${{ steps.identity.outputs.build }}" 2>/dev/null || true
              git add "data/builds/${{ steps.identity.outputs.build }}" 2>/dev/null || true
              GIT_EDITOR=true git rebase --continue || git rebase --abort
              if git stash list | grep -q autostash; then git stash pop || true; fi
              git push && { pushed=true; break; }
            fi
            echo "push attempt $attempt failed; retrying"
            sleep 20
          done
          # The legs check out the sha this job pushed, so a crawl commit that never
          # reached main would rank a tree no other job can see: fail here instead
          # (the single job kept going; the next night redoes tonight's pages from
          # the warm cache in raw/).
          if [ "$pushed" != true ]; then
            echo "::error title=crawl commit not pushed::five attempts to push tonight's quest-level and item-source fill-in failed; nothing was ranked"
            exit 1
          fi
      # After tonight's crawl, the hash again: a crawl commit is new input, so every spec
      # whose marker predates it ranks again.
      - name: tonight's ranking inputs, against the picks on the branch
        id: inputs
        env:
          BUILD: ${{ steps.identity.outputs.build }}
          FORCE: ${{ github.event.inputs.force }}
          ENGINE_FOLLOWS: ${{ steps.engine.outputs.follows }}
          MATRIX: ${{ steps.matrix.outputs.matrix }}
        run: |
          hash=$(tools/bis-inputs-hash.sh "$BUILD")
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          pending=$(tools/bis-pending.sh "$BUILD" "$hash" "$MATRIX")
          echo "tonight: $hash  specs still to rank: ${pending:-none}"
          if [ "$ENGINE_FOLLOWS" != "true" ]; then
            # Force does not override this: the engine step above says why.
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$FORCE" != "true" ] && [ -z "$pending" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::every spec's picks were ranked on these inputs; skipping the ranking"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
  rank:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # The priests, the longest leg, run about 80 minutes on a fast host and 120 on a slow
    # one, plus checkout, embeds and the landing's render. A hung spec is killed by
    # leveling-bis's own 80-minute per-spec cap, or its step's 100.
    timeout-minutes: 200
    permissions:
      contents: write
    strategy:
      # One red class must not cancel the others: each leg lands its own picks.
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: rank ${{ matrix.class }}
    env:
      BUILD: ${{ needs.prepare.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ needs.prepare.outputs.head }}' }
      - uses: actions/setup-go@v5
        with: { go-version-file: sim/go.mod, cache-dependency-path: sim/go.sum }
      - uses: ./.github/actions/pin-engine
      # //go:embed resolves at compile time, so the active build's item
      # database has to be in place before `go run` - same as sim.yml's
      # `rotations`/`artifacts` jobs and this repo's own common-site.md
      # rule ("cd sim && go test ./request needs the embeds").
      - run: make simdb
      - uses: astral-sh/setup-uv@v3
      # One step per spec, so each spec's picks are kept the moment it finishes
      # (.github/actions/rank-spec: skipped when the branch already holds them on these
      # inputs, else ranked and uploaded as bis-picks-<class>-<spec>). Four slots: the
      # largest class (druid) has four written specs.
      - name: this leg's specs, one per slot
        id: slots
        env: { SPECS: '${{ matrix.specs }}' }
        run: |
          IFS=, read -r -a specs <<< "$SPECS"
          if [ "${#specs[@]}" -gt 4 ]; then
            echo "::error title=too many specs in one leg::${#specs[@]} specs ($SPECS); bis.yml's rank job has four slots"
            exit 1
          fi
          for i in "${!specs[@]}"; do echo "s$i=${specs[$i]}" >> "$GITHUB_OUTPUT"; done
      - name: rank ${{ steps.slots.outputs.s0 }}
        if: ${{ !cancelled() && steps.slots.outputs.s0 != '' }}
        timeout-minutes: 100
        uses: ./.github/actions/rank-spec
        with:
          spec: ${{ steps.slots.outputs.s0 }}
          class: ${{ matrix.class }}
          build: ${{ needs.prepare.outputs.build }}
          hash: ${{ needs.prepare.outputs.hash }}
          force: ${{ github.event.inputs.force == 'true' }}
          fail: ${{ github.event.inputs.fail_spec }}
      - name: rank ${{ steps.slots.outputs.s1 }}
        if: ${{ !cancelled() && steps.slots.outputs.s1 != '' }}
        timeout-minutes: 100
        uses: ./.github/actions/rank-spec
        with:
          spec: ${{ steps.slots.outputs.s1 }}
          class: ${{ matrix.class }}
          build: ${{ needs.prepare.outputs.build }}
          hash: ${{ needs.prepare.outputs.hash }}
          force: ${{ github.event.inputs.force == 'true' }}
          fail: ${{ github.event.inputs.fail_spec }}
      - name: rank ${{ steps.slots.outputs.s2 }}
        if: ${{ !cancelled() && steps.slots.outputs.s2 != '' }}
        timeout-minutes: 100
        uses: ./.github/actions/rank-spec
        with:
          spec: ${{ steps.slots.outputs.s2 }}
          class: ${{ matrix.class }}
          build: ${{ needs.prepare.outputs.build }}
          hash: ${{ needs.prepare.outputs.hash }}
          force: ${{ github.event.inputs.force == 'true' }}
          fail: ${{ github.event.inputs.fail_spec }}
      - name: rank ${{ steps.slots.outputs.s3 }}
        if: ${{ !cancelled() && steps.slots.outputs.s3 != '' }}
        timeout-minutes: 100
        uses: ./.github/actions/rank-spec
        with:
          spec: ${{ steps.slots.outputs.s3 }}
          class: ${{ matrix.class }}
          build: ${{ needs.prepare.outputs.build }}
          hash: ${{ needs.prepare.outputs.hash }}
          force: ${{ github.event.inputs.force == 'true' }}
          fail: ${{ github.event.inputs.fail_spec }}
      # The leg lands its finished specs on the branch as it is now, red or green: a spec
      # that failed or a later spec that never ran costs only itself. tools/bis-land.sh
      # renders the derived files (addon-data.json, Data.lua) on each landing and pushes as a
      # fast-forward; legs finishing together race only on the push, and a rejected push
      # starts again from a fresh fetch (a concurrency group would not serialize them: it
      # keeps one pending job and cancels the rest).
      - name: land this leg's finished picks on ${{ github.ref_name }}
        if: ${{ !cancelled() }}
        env:
          SPECS: ${{ github.event.inputs.specs }}
          BRANCH: ${{ github.ref_name }}
          PIN: ${{ needs.prepare.outputs.sha }}
          RANKED_HEAD: ${{ needs.prepare.outputs.head }}
          LAND_ATTEMPTS: '12'
          CLASS: ${{ matrix.class }}
        run: |
          if ! compgen -G "$RUNNER_TEMP/leg/*.json" >/dev/null; then
            echo "no spec of this leg finished on this run; nothing to land"
            exit 0
          fi
          git config user.name "forever-bis-bot"
          git config user.email "bot@foreversixty.gg"
          trailer="Inputs: ${{ needs.prepare.outputs.hash }} ($CLASS leg)"
          if [ "$SPECS" != "" ]; then trailer="$trailer (partial: $SPECS)"; fi
          # Legs finishing together: spread their retries.
          LAND_SLEEP=$((15 + RANDOM % 30)) PUBLISH="$LAND_PUSH" tools/bis-land.sh "$BUILD" "$PIN" "$RUNNER_TEMP/leg" "$trailer"
  # The cross-class steps, after every leg has landed what it finished: the sanity checks
  # over the picks the site reads, the deploy (whenever any leg landed), and the run's red
  # verdict naming the legs that did not finish green.
  finish:
    needs: [prepare, rank]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    env:
      BUILD: ${{ needs.prepare.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.ref_name }}' }
      - uses: actions/setup-go@v5
        with: { go-version-file: sim/go.mod, cache-dependency-path: sim/go.sum }
      - uses: ./.github/actions/pin-engine
      - run: make simdb
      # Off main without land_on_branch the picks were not pushed: the run's artifacts go
      # over the checkout so the checks still read tonight's picks.
      - name: tonight's picks from every leg
        uses: actions/download-artifact@v4
        with:
          pattern: bis-picks-*
          merge-multiple: true
          path: ${{ runner.temp }}/picks
      - name: the picks over the checkout
        run: |
          if compgen -G "$RUNNER_TEMP/picks/*" >/dev/null; then cp "$RUNNER_TEMP"/picks/* "data/builds/$BUILD/bis/"; fi
          git status --short -- "data/builds/$BUILD/bis"
      # night-bis-sanity lane, 2026-09-29: the published files are checked for the defects
      # the class audits found by eye (an item above the band, the other side's rep, a
      # two-hander with an off hand, one ring in both slots), with the known-good items
      # (rank-guardrails lane) and the launch-phase checks (bis-phase-gate lane).
      # Warning-only so a data finding never blocks a landing; the active build only.
      - name: sanity-check tonight's picks
        continue-on-error: true
        working-directory: sim
        run: FOREVER_BIS_SANITY=1 go test ./cmd/leveling-bis -run 'TestPublishedBISFilesPassSanityChecks|TestKnownGoodItemsAreSeenAndRanked|TestNoBannedItemIsAPublishedBand60Pick|TestTheBand60PicksComeOnlyFromContentOpenAtLaunch' -count=1
      - name: did any leg land
        id: landed
        env: { HEAD_SHA: '${{ needs.prepare.outputs.head }}' }
        run: |
          git fetch --quiet --depth=1 origin "$HEAD_SHA"
          if [ "$(git rev-parse "HEAD:data/builds/$BUILD/bis")" != "$(git rev-parse "$HEAD_SHA:data/builds/$BUILD/bis")" ]; then
            echo "landed=true" >> "$GITHUB_OUTPUT"
          else
            echo "landed=false" >> "$GITHUB_OUTPUT"
          fi
      - if: env.PUBLISH == 'true' && steps.landed.outputs.landed == 'true'
        uses: ./.github/actions/deploy-picks
        with: { token: '${{ github.token }}' }
      - name: every leg finished green
        if: needs.rank.result != 'success'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          red=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
                  --jq '.jobs[] | select(.name | startswith("rank ")) | select(.conclusion != "success") | "\(.name): \(.conclusion // "unfinished")"')
          echo "::error title=ranking incomplete::not every leg finished green; their finished specs landed, the rest rank on the next run (resume). ${red//$'\n'/; }"
          exit 1
  # tools/activate-build.sh carries the previous build's dps-per-point.json unchanged (the
  # addon's "+N DPS" and the API's loot values read it) and writes
  # dps-per-point.carried-from beside it. The first full ranking on the new build whose
  # every leg finished green re-measures it on the new picks, here, after they have
  # landed: one leg per class, each
  # its own process on its own runner (the single-process run of every spec and band lost
  # its runner after 57 minutes in run 43445589374). A build with no marker is never
  # re-measured.
  remeasure:
    needs: [prepare, rank, finish]
    if: >-
      always() && needs.rank.result == 'success' && needs.finish.result == 'success' &&
      needs.prepare.outputs.remeasure == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        class: ${{ fromJSON(needs.prepare.outputs.classes) }}
    name: remeasure ${{ matrix.class }}
    env:
      BUILD: ${{ needs.prepare.outputs.build }}
    steps:
      # The branch with every leg's landed picks (a resumed spec's are there from an earlier
      # run); this run's artifacts go over it too, for a branch run that did not push.
      - uses: actions/checkout@v4
        with: { ref: '${{ github.ref_name }}' }
      - uses: actions/setup-go@v5
        with: { go-version-file: sim/go.mod, cache-dependency-path: sim/go.sum }
      - uses: ./.github/actions/pin-engine
      - run: make simdb
      - name: tonight's picks from every leg
        uses: actions/download-artifact@v4
        with:
          pattern: bis-picks-*
          merge-multiple: true
          path: ${{ runner.temp }}/picks
      - name: re-measure the ${{ matrix.class }} specs on tonight's picks
        timeout-minutes: 100
        env: { CLASS: '${{ matrix.class }}' }
        run: |
          if compgen -G "$RUNNER_TEMP/picks/*" >/dev/null; then cp "$RUNNER_TEMP"/picks/* "data/builds/$BUILD/bis/"; fi
          specs=$(jq -r --arg c "$CLASS" '[.[] | select(.class_slug == $c) | .spec] | join(",")' data/curated/specs.json)
          go run ./sim/cmd/dps-per-point -repo-root . -specs "$specs"
          # Only this class's entries go up; the land job merges them over the carry.
          mkdir -p "$RUNNER_TEMP/dpp"
          jq --arg c "$CLASS" 'with_entries(select(.key | startswith($c + "-")))' \
            "data/builds/$BUILD/dps-per-point.json" > "$RUNNER_TEMP/dpp/$CLASS.json"
          jq -c 'keys' "$RUNNER_TEMP/dpp/$CLASS.json"
      - uses: actions/upload-artifact@v4
        with:
          name: dpp-${{ matrix.class }}
          path: ${{ runner.temp }}/dpp
          retention-days: 14
          if-no-files-found: error
  # Every class re-measured green: the figures merged over main's carry and landed through
  # tools/bis-land.sh (the same picks again, so only the figures, the marker, the manifest
  # and the derived addon data change). One red leg keeps the whole carry and the marker,
  # so the next full ranking measures again.
  remeasure-land:
    needs: [prepare, remeasure]
    if: always() && needs.remeasure.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    env:
      BUILD: ${{ needs.prepare.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.ref_name }}' }
      - uses: astral-sh/setup-uv@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: bis-picks-*
          merge-multiple: true
          path: ${{ runner.temp }}/runpicks
      - uses: actions/download-artifact@v4
        with:
          pattern: dpp-*
          merge-multiple: true
          path: ${{ runner.temp }}/dpp
      # The carry with every class's entries replaced, in dps-per-point's own layout (one
      # spec per line, sorted).
      - name: merge the classes' figures over the carry
        run: |
          jq -r -s 'reduce .[1:][] as $class (.[0]; . + $class)
                    | to_entries | sort_by(.key)
                    | "{\n" + (map("  \(.key | tojson): \(.value | tojson)") | join(",\n")) + "\n}"' \
            "data/builds/$BUILD/dps-per-point.json" "$RUNNER_TEMP"/dpp/*.json > "$RUNNER_TEMP/dps-per-point.json"
          diff "data/builds/$BUILD/dps-per-point.json" "$RUNNER_TEMP/dps-per-point.json" | head -40 || true
      - name: land the re-measured figures on ${{ github.ref_name }}
        id: land
        env:
          BRANCH: ${{ github.ref_name }}
          PIN: ${{ needs.prepare.outputs.sha }}
          LAND_SUBJECT: 'chore(bis): re-measured dps-per-point for ${{ needs.prepare.outputs.build }}'
        run: |
          git config user.name "forever-bis-bot"
          git config user.email "bot@foreversixty.gg"
          # The branch's picks, with this run's over them: bis-land re-copies the same picks.
          cp "data/builds/$BUILD/bis"/*.json "data/builds/$BUILD/bis"/*.md "$RUNNER_TEMP/picks/"
          if compgen -G "$RUNNER_TEMP/runpicks/*" >/dev/null; then cp "$RUNNER_TEMP"/runpicks/* "$RUNNER_TEMP/picks/"; fi
          PUBLISH="$LAND_PUSH" FIGURES="$RUNNER_TEMP/dps-per-point.json" \
            tools/bis-land.sh "$BUILD" "$PIN" "$RUNNER_TEMP/picks" "Re-measured in run $GITHUB_RUN_ID"
      - if: success() && env.PUBLISH == 'true' && steps.land.outputs.landed == 'true'
        uses: ./.github/actions/deploy-picks
        with: { token: '${{ github.token }}' }
  # land_run: a past run's finished picks onto the branch as it is now, through the same
  # landing as the legs (tools/bis-land.sh), then the deploy. Every artifact the run kept is
  # landed: the per-spec bis-picks-<class>-<spec> of this workflow and the per-class
  # bis-picks-<class> of the runs before it. Picks for a build that is no longer active
  # never land (bis-land.sh says so and exits 0).
  land-run:
    if: github.event.inputs.land_run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.ref_name }}' }
      - uses: astral-sh/setup-uv@v3
      - name: the run's picks
        id: picks
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.inputs.land_run }}
        run: |
          [[ $RUN =~ ^[0-9]+$ ]] || { echo "::error::land_run must be a run id, not '$RUN'"; exit 1; }
          workflow=$(gh run view "$RUN" --json workflowName -q .workflowName)
          [ "$workflow" = bis ] || { echo "::error::run $RUN is a $workflow run, not a bis run"; exit 1; }
          gh run download "$RUN" -p 'bis-picks-*' -D "$RUNNER_TEMP/artifacts"
          mkdir -p "$RUNNER_TEMP/picks"
          find "$RUNNER_TEMP/artifacts" -type f \( -name '*.json' -o -name '*.md' -o -name '*.inputs' \) -exec cp {} "$RUNNER_TEMP/picks/" \;
          ls "$RUNNER_TEMP/picks"
          builds=$(jq -r '.build' "$RUNNER_TEMP"/picks/*.json | sort -u)
          [ "$(wc -l <<<"$builds")" -eq 1 ] || { echo "::error::run $RUN's picks name more than one build: $builds"; exit 1; }
          head=$(gh run view "$RUN" --json headSha -q .headSha)
          pin=$(gh api "repos/$GITHUB_REPOSITORY/contents/sim/enginever/version.go?ref=$head" -H 'Accept: application/vnd.github.raw' | sed -n 's/.*Version = "\(.*\)"/\1/p')
          [ -n "$pin" ] || { echo "::error::no engine pin at run $RUN's head $head"; exit 1; }
          echo "build=$builds" >> "$GITHUB_OUTPUT"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - name: land them on ${{ github.ref_name }}
        id: land
        env:
          BRANCH: ${{ github.ref_name }}
          RUN: ${{ github.event.inputs.land_run }}
          BUILD: ${{ steps.picks.outputs.build }}
          PIN: ${{ steps.picks.outputs.pin }}
        run: |
          git config user.name "forever-bis-bot"
          git config user.email "bot@foreversixty.gg"
          PUBLISH="$LAND_PUSH" tools/bis-land.sh "$BUILD" "$PIN" "$RUNNER_TEMP/picks" "Landed from run $RUN"
      - if: success() && env.PUBLISH == 'true' && steps.land.outputs.landed == 'true'
        uses: ./.github/actions/deploy-picks
        with: { token: '${{ github.token }}' }
  # Last, so tonight's crawl still landed: a ranking stalled on the engine for a second
  # night is a red run, not another green notice (the prepare job's verdict step).
  stalled:
    needs: prepare
    if: always() && needs.prepare.outputs.verdict == 'stalled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: fail when the ranking has stalled on the engine
        env: { LINE: '${{ needs.prepare.outputs.line }}' }
        run: |
          echo "::error title=ranking stalled on the engine follow::$LINE"
          exit 1
