name: ios
on:
  push:
    branches: [main, 'land/**']
    paths: ['apps/ios/**', 'apps/shared/**', 'web/src/data/specs.json', 'apps/VERSION', 'docs/contracts/**', '.github/workflows/ios.yml', 'tools/ios-ci-simulator.sh', 'tools/ios-ci-free-disk.sh']
  pull_request:
    paths: ['apps/ios/**', 'apps/shared/**', 'web/src/data/specs.json', 'apps/VERSION', 'docs/contracts/**', '.github/workflows/ios.yml', 'tools/ios-ci-simulator.sh', 'tools/ios-ci-free-disk.sh']
  workflow_dispatch:
    inputs:
      record:
        description: 'Re-record the snapshot goldens that fail here and upload them (make -C apps/ios snapshots)'
        type: boolean
        default: false
permissions: { contents: read }
concurrency:
  group: ios-${{ startsWith(github.ref, 'refs/heads/land/') && github.sha || github.ref }}
  # A newer push cancels a branch or pull request run; main's runs always finish, or a
  # quick second push leaves production undeployed (2026-11-02: two hours).
  # A land/** run (tools/land.sh) is grouped by its sha and is never cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/land/') }}
env:
  # CI and the lanes build with ONE toolchain: the lanes' Xcode (apps/ios/Makefile warns on a
  # mismatch) on the iOS 26.5 simulator (tools/mobile-device.sh). The snapshot goldens
  # (AppTests/**/__Snapshots__) are rendered by that pair: iOS 27 changes navigation bar heights and
  # line metrics by whole rows, and another Xcode renders key-window snapshots differently (Xcode
  # 26.6 failed five goldens Xcode 27.1 recorded, 2026-11-02). The xcode-27 image has Xcode 27.1 but
  # no iOS 26.5 simulator, so the job installs it. Moving either means re-recording every golden
  # (`make -C apps/ios snapshots`) and moving the lanes with it.
  XCODE_VERSION: '27.1'
  XCODEGEN_VERSION: '2.46.0'
  IOS_RUNTIME_VERSION: '26.5'
  IOS_RUNTIME_BUILD: '23F77'
jobs:
  build-test:
    # Skipped in launch mode (docs/runbooks/landing.md, "Launch mode"), except a run started by
    # hand (a record run, `make -C apps/ios snapshots`), which is never a push's check.
    if: vars.LAUNCH_MODE != 'true' || github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    # The simulator boots while the app builds (tools/ios-ci-simulator.sh boot-start), so a run is
    # checkout, build and test; the headroom covers a cold cache and a boot retry. A record run
    # rewrites every golden it renders, and twice on 2026-11-10 (runs 42916220914, 42934432174) a
    # slow runner spent ~20 minutes before the tests began, so record runs get 90.
    timeout-minutes: ${{ inputs.record && 90 || 60 }}
    defaults:
      run:
        working-directory: apps/ios
    steps:
      # Without design/reviews and data/builds (~5.5 GB of the tree, two to five minutes of the
      # full checkout); the tests read the mocks' regions and avatars, and data/builds comes from
      # the cache (docs/runbooks/landing.md, "Checkout").
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/builds/
            !/data/diffs/
            !/design/reviews/
            !/design/mocks/
            /design/mocks/app/regions/
            /design/mocks/data/avatars/
            !/docs/superpowers/reviews/
            !/apps/android/
            /apps/android/app/src/test/resources/
      - uses: ./.github/actions/data-builds
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      # Record runs filled the disk mid-test (runs 42908207505, 42912202294, 42916220914, 42925826117:
      # "No space left on device"). The image's other simulator runtimes, Xcodes and toolchains go
      # first, keeping the pinned runtime: ~28 GB free becomes ~116 GB in two minutes (run 42925501706).
      - name: Free disk space
        working-directory: .
        run: bash tools/ios-ci-free-disk.sh "$IOS_RUNTIME_BUILD"
      # The runtime build, not just its version: 26.5 resolves to 23F73 while the lanes run 23F77.
      # tools/ios-ci-simulator.sh picks (or downloads) that runtime and makes its own iPhone 17 on
      # it (id=, never a name: installing a runtime creates default devices too), then boots it in
      # the background while the app builds. A freshly downloaded runtime tested on too early was
      # lost mid-run ("cannot determine the runtime bundle", run 42503034639).
      - name: Start the iOS ${{ env.IOS_RUNTIME_VERSION }} (${{ env.IOS_RUNTIME_BUILD }}) simulator
        working-directory: .
        run: |
          destination=$(bash tools/ios-ci-simulator.sh create "$IOS_RUNTIME_VERSION" "$IOS_RUNTIME_BUILD")
          bash tools/ios-ci-simulator.sh boot-start "${destination##*id=}"
      - name: Cache XcodeGen
        id: xcodegen
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/xcodegen
          key: xcodegen-${{ runner.os }}-${{ env.XCODEGEN_VERSION }}
      - name: Install XcodeGen
        env:
          CACHE_HIT: ${{ steps.xcodegen.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" != true ]; then
            # GitHub release downloads 504 now and then: retry, then fall back to Homebrew.
            if ! curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 -o "$RUNNER_TEMP/xcodegen.zip" \
                "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"; then
              echo "::warning::XcodeGen ${XCODEGEN_VERSION} download failed; installing from Homebrew"
              brew install xcodegen
              exit 0
            fi
            unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          fi
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate the project
        run: xcodegen generate
      # The packages are pinned to exact versions in project.yml's packages section, so the SwiftPM
      # key is that section (not the whole file, which every lane edits) and the resolving Xcode.
      # The compilation cache starts afresh each month, so it cannot grow without bound.
      - name: Key the build caches
        id: keys
        run: |
          echo "packages=$(sed -n '/^packages:/,/^targets:/p' project.yml | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      # ~1 GB of package clones and the Sentry binary (~4 minutes to fetch): restored everywhere,
      # saved by main only (the cache is near its 10 GB limit, and every branch can read main's).
      - name: Restore SwiftPM checkouts
        id: spm
        uses: actions/cache/restore@v4
        with:
          path: apps/ios/build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ steps.keys.outputs.packages }}
      # Xcode's compilation cache, content-addressed, so a fresh checkout's new mtimes do not miss:
      # the SDK and package modules and every unchanged module's compile jobs. Saved by main only.
      - name: Restore the compilation cache
        id: cas
        uses: actions/cache/restore@v4
        with:
          path: apps/ios/build/CompilationCache
          key: ios-cas-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ steps.keys.outputs.month }}-${{ github.sha }}
          restore-keys: ios-cas-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ steps.keys.outputs.month }}-
      # Simulator only: no Apple Developer account yet, so the build is ad-hoc signed ("-",
      # project.yml) and needs no certificate or team. Built once, for the job's simulator (its
      # architecture only), while it boots; the tests then run without building.
      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project ForeverSixty.xcodeproj \
            -scheme ForeverSixty \
            -destination "$SIMULATOR" \
            -derivedDataPath build/DerivedData \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_CAS_PATH="$PWD/build/CompilationCache"
      - name: Save SwiftPM checkouts
        if: github.ref == 'refs/heads/main' && steps.spm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/ios/build/DerivedData/SourcePackages
          key: ${{ steps.spm.outputs.cache-primary-key }}
      - name: Save the compilation cache
        if: github.ref == 'refs/heads/main' && steps.cas.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/ios/build/CompilationCache
          key: ${{ steps.cas.outputs.cache-primary-key }}
      - name: Wait for the simulator
        working-directory: .
        run: bash tools/ios-ci-simulator.sh boot-wait
      # In record mode the failing snapshots are rewritten in place (swift-snapshot-testing's
      # SNAPSHOT_TESTING_RECORD, passed to the test runner) and uploaded for the Makefile to pull.
      - name: Test
        continue-on-error: ${{ inputs.record == true }}
        env:
          TEST_RUNNER_SNAPSHOT_TESTING_RECORD: ${{ inputs.record == true && 'failed' || 'missing' }}
          # The runner is ~3x slower than a local Mac; SearchLogicTests' keystroke budget scales by it.
          TEST_RUNNER_SEARCH_BUDGET_SCALE: '3'
        # The booted simulator has lost its runtime between steps (run 42515970747), so the device is
        # ensured again here, and a run that cannot find it (exit 70, before any test runs) gets one
        # more ensure and try.
        run: |
          for attempt in 1 2; do
            destination=$(bash ../../tools/ios-ci-simulator.sh ensure "$IOS_RUNTIME_VERSION" "$IOS_RUNTIME_BUILD" "$SIMULATOR_UDID")
            SIMULATOR_UDID=${destination##*id=}
            rm -rf build/ForeverSixty.xcresult
            status=0
            xcodebuild test-without-building \
              -project ForeverSixty.xcodeproj \
              -scheme ForeverSixty \
              -destination "$destination" \
              -derivedDataPath build/DerivedData \
              -resultBundlePath build/ForeverSixty.xcresult || status=$?
            if [ "$status" -ne 70 ] || [ "$attempt" -eq 2 ]; then exit "$status"; fi
            echo "::warning::xcodebuild could not use $destination (exit 70); ensuring the simulator and retrying"
          done
      - name: Upload the recorded snapshots
        if: inputs.record == true
        uses: actions/upload-artifact@v4
        with:
          name: ios-snapshots
          # Every suite's goldens (AppTests/__Snapshots__ and feature folders such as
          # AppTests/Raids/__Snapshots__); the hierarchy under AppTests/ is kept for the Makefile.
          path: apps/ios/AppTests/**/__Snapshots__/**
          retention-days: 7
      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            apps/ios/build/ForeverSixty.xcresult
            apps/ios/AppTests/**/__Snapshots__/**
          retention-days: 7
