# .github/workflows/data.yml
name: data
on:
  push:
    branches: [main]
    paths: ['data/**', 'sim/specs/**', 'sim/enginever/version.go', 'sim/request/IDS.md', 'web/src/lib/sim/specs.ts', 'web/src/data/phases.json', 'addon/**', '.github/workflows/data.yml']
  pull_request:
    paths: ['data/**', 'sim/specs/**', 'sim/enginever/version.go', 'sim/request/IDS.md', 'web/src/lib/sim/specs.ts', 'web/src/data/phases.json', 'addon/**', '.github/workflows/data.yml']
  workflow_dispatch:
    inputs:
      product: { description: 'wago.tools product key', required: true, default: 'wow_classic_era' }
      build: { description: 'build string (blank = latest)', required: false }
      allow_shrink:
        description: 'deliberate re-baseline: let normalize/loot write a catalogue smaller than the committed one (e.g. after dropping QA rows)'
        required: false
        default: false
        type: boolean
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: data } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run ruff check .
      # loot-contract-drift, 2026-09-30: the full suite, right after lint and
      # before the slower --check/build-dependent steps below, so a contract
      # test that drifts from the pipeline's shape (or vice versa) fails fast
      # instead of landing unnoticed -- four tests/test_loot_build.py cases
      # did exactly that after data-followups-9 (fc65ac2d) changed vendor/
      # raid/quest source shapes without this gate ever running. No
      # FOREVER_ENGINE_PATH here (a wowsims-forever checkout is not
      # available in this job): tests/test_genproto.py, test_loot_
      # classicdb.py, test_simdb_build.py and test_simdb_fork_parity.py all
      # `pytest.skip` cleanly when it is unset rather than failing.
      - run: uv run pytest -q --no-cov
      # sim/specs/specs.go and web/src/lib/sim/specs.ts are generated from
      # curated/specs.json and committed. `specs` is not a per-build emitter,
      # so the fetch job never runs it; this is the gate that catches an edit
      # to either generated file, or to the curated list, that was never
      # regenerated.
      - run: uv run python -m pipeline specs --check
      # phases, like specs, is not a per-build emitter, so the fetch job
      # never runs it. This is the gate that web/src/data/phases.json was
      # re-emitted after curated/phases.json moved -- and that nobody
      # edited the generated copy by hand.
      - run: uv run python -m pipeline phases --check
      # addon-data.json and addon/ForeverSixty/Data.lua are generated from the
      # build directory and curated/stat-weights.json and committed, so the
      # addon is installable from a checkout with no build step. This is the
      # gate that neither was hand-edited and that a curated weight change was
      # re-emitted.
      - run: uv run python -m pipeline weights --build 1.60.1.70009 --check
      - run: uv run python -m pipeline addon-data --build 1.60.1.70009 --check
      # test_addondata.py gates the generated Data.lua on a real `load()`, so the
      # suite needs an interpreter; ubuntu-latest ships none and the test skips
      # itself without one. A plain apt install rather than a third-party action:
      # one binary is not worth a new supply-chain dependency.
      - name: Install Lua for the Data.lua load gate
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: uv run pytest
  fetch:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: data } }
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - name: Fetch build
        env:
          PRODUCT: ${{ inputs.product }}
          BUILD_IN: ${{ inputs.build }}
          ALLOW_SHRINK: ${{ inputs.allow_shrink }}
        run: |
          # A deliberate re-baseline (dropping rows on purpose) passes --allow-shrink
          # to every gated stage below; the default keeps the no-shrink gates armed.
          if [ "$ALLOW_SHRINK" = "true" ]; then echo "SHRINK=--allow-shrink" >> "$GITHUB_ENV"; else echo "SHRINK=" >> "$GITHUB_ENV"; fi
          ARGS=(--product "$PRODUCT")
          [ -n "$BUILD_IN" ] && ARGS+=(--build "$BUILD_IN")
          BUILD=$(uv run python -m pipeline fetch "${ARGS[@]}" | tail -1)
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "PRODUCT=$PRODUCT" >> "$GITHUB_ENV"
      # Wowhead's Forever gear planner carries the items Blizzard ships as hotfixes,
      # which never reach the client files wago exports (4,712 of 11,239 items on
      # 2026-09-27). normalize, icons and simdb merge it in when it is present in raw/.
      - run: uv run python -m pipeline fetch-wowhead --build "$BUILD"
      # Blizzard ships most Forever talent-tree changes as hotfixes, which the DB2 tables
      # above never carry. Wowhead's talent payload is read off the live game: normalize
      # takes the talent trees from it when raw/wowhead-talents.json exists, and falls
      # back to the trait tables when it does not.
      - run: uv run python -m pipeline fetch-wowhead-talents --build "$BUILD"
      - name: Restore the icon cache
        uses: actions/cache@v4
        with:
          path: data/.icon-cache
          key: icon-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: icon-cache-${{ runner.os }}-
      # loot.json, enchants.json and suffixes.json come out of the engine
      # fork's own item database, which is not in this repository: nothing
      # in a DB2 export says which boss drops an item. The fork is cloned
      # at the PINNED sha, the way sim.yml's `rotations` job does it
      # (actions/checkout treats a short sha as a branch name and fails to
      # fetch it), so the committed files name one engine build.
      - name: the pinned engine sha
        id: pin
        working-directory: .
        run: |
          sha=$(sed -n 's/.*Version = "\(.*\)"/\1/p' sim/enginever/version.go)
          test -n "$sha" || { echo "sim/enginever/version.go has no Version"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: the engine fork at the pin
        working-directory: .
        run: |
          git clone --quiet --filter=blob:none https://github.com/jhunthrop/wowsims-forever .engine
          git -C .engine checkout --quiet "${{ steps.pin.outputs.sha }}"
      # classicdb-fidelity, 2026-09-30: normalize reads the fork's item database for the
      # icon names of classic-db-only rows, so the fork checkout moves ahead of it.
      - run: uv run python -m pipeline normalize --build "$BUILD" --engine ../.engine $SHRINK
      # simconst (spellconst/ from the raw spell tables) and levels (levels.json
      # and spellranks.json) come straight after normalize: icons writes the
      # rotation spell icons from spellranks.json and addon-data renders the
      # rotations from both, so on a build directory that has never been
      # built before (2026-10-08, the first 1.60.1.70291 fetch) icons fails
      # with "missing spellranks.json" if they run later. levels needs the raw
      # wowhead payload fetch-wowhead wrote above; a build with no wowhead
      # payload still gets spellranks.json.
      - run: uv run python -m pipeline simconst --build "$BUILD"
      - run: uv run python -m pipeline levels --build "$BUILD"
      - run: uv run python -m pipeline icons --build "$BUILD"
      - run: uv run python -m pipeline tree-art --build "$BUILD"
      # Re-run the offline normalize so manifest.json also covers the icons and tree art
      # the steps above just wrote.
      - run: uv run python -m pipeline normalize --build "$BUILD" --engine ../.engine $SHRINK
      # The fetched build's copy of the curated stat weights, and the addon's
      # data. Without these a new build lands with neither file. They read only
      # classes.json, talents/ and curated/, so they run straight after
      # normalize; the later stages' manifest refreshes then list both files.
      #
      # `addon-data` also renders addon/ForeverSixty/Data.lua, and that render
      # is DELIBERATELY NOT COMMITTED here (the commit step adds builds/ and
      # diffs/ only). Data.lua is a single unversioned file that tracks the
      # ACTIVE build, and pipeline/addonlua.py stamps whichever build the CLI
      # was given into it -- but what activates a build is a human editing
      # web/src/data/active-build.json, which this bot does not touch. Commit
      # it here and the addon ships a build the site is not serving, and the
      # `test` job's `addon-data --build 1.60.1.70009 --check` gate reports it
      # as drift and fails on the bot's own push. Letting the runner discard
      # the render is the correct outcome. Do not add `git add ../addon`.
      - run: uv run python -m pipeline weights --build "$BUILD"
      - run: uv run python -m pipeline addon-data --build "$BUILD"
      # Before simdb: it writes items.json's `suffixes` and
      # `faction_restriction`, which pipeline/simdb/items.py reads into
      # SimItem. Both refresh the same manifest, and the diff step at the
      # end sees the finished directory either way.
      - run: uv run python -m pipeline loot --build "$BUILD" --engine ../.engine $SHRINK
      # simdb reads the same raw inputs normalize does and refreshes
      # manifest.json, so it runs after the normalize that covers icons and
      # tree art rather than before it; simconst and levels ran before icons
      # (above) because icons and addon-data read what they write.
      - run: uv run python -m pipeline simdb --build "$BUILD"
      - run: uv run python -m pipeline gametables --build "$BUILD"
      - run: |
          PREV=$(ls builds | grep -vx "$BUILD" | sort -V | tail -1)
          if [ -n "$PREV" ]; then uv run python -m pipeline diff --from "$PREV" --to "$BUILD"; fi
      - run: |
          git config user.name "forever-data-bot"
          git config user.email "bot@foreversixty.gg"
          git add builds
          git add diffs
          git commit -m "data: build $BUILD ($PRODUCT)" || echo "nothing to commit"
          git push
