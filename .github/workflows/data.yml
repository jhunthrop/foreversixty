# .github/workflows/data.yml
name: data
on:
  push:
    branches: [main]
    paths: ['data/**', 'sim/specs/**', 'sim/enginever/version.go', 'sim/request/IDS.md', 'web/src/lib/sim/specs.ts', 'web/src/data/phases.json', 'addon/**', '.github/workflows/data.yml']
  pull_request:
    paths: ['data/**', 'sim/specs/**', 'sim/enginever/version.go', 'sim/request/IDS.md', 'web/src/lib/sim/specs.ts', 'web/src/data/phases.json', 'addon/**', '.github/workflows/data.yml']
  workflow_dispatch:
    inputs:
      product: { description: 'wago.tools product key', required: true, default: 'wow_classic_era' }
      build: { description: 'build string (blank = latest)', required: false }
      allow_shrink:
        description: 'deliberate re-baseline: let normalize/loot write a catalogue smaller than the committed one (e.g. after dropping QA rows)'
        required: false
        default: false
        type: boolean
  # client.yml (the client watcher) calls this workflow the morning a new Forever build
  # appears on wago.tools, with the product and build it found; the fetch job below is
  # the same one a hand dispatch runs.
  workflow_call:
    inputs:
      product: { type: string, required: true }
      build: { type: string, required: false, default: '' }
      allow_shrink: { type: boolean, required: false, default: false }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: data } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run ruff check .
      # loot-contract-drift, 2026-09-30: the full suite, right after lint and
      # before the slower --check/build-dependent steps below, so a contract
      # test that drifts from the pipeline's shape (or vice versa) fails fast
      # instead of landing unnoticed -- four tests/test_loot_build.py cases
      # did exactly that after data-followups-9 (fc65ac2d) changed vendor/
      # raid/quest source shapes without this gate ever running. No
      # FOREVER_ENGINE_PATH here (a wowsims-forever checkout is not
      # available in this job): tests/test_genproto.py, test_loot_
      # classicdb.py, test_simdb_build.py and test_simdb_fork_parity.py all
      # `pytest.skip` cleanly when it is unset rather than failing.
      - run: uv run pytest -q --no-cov
      # sim/specs/specs.go and web/src/lib/sim/specs.ts are generated from
      # curated/specs.json and committed. `specs` is not a per-build emitter,
      # so the fetch job never runs it; this is the gate that catches an edit
      # to either generated file, or to the curated list, that was never
      # regenerated.
      - run: uv run python -m pipeline specs --check
      # phases, like specs, is not a per-build emitter, so the fetch job
      # never runs it. This is the gate that web/src/data/phases.json was
      # re-emitted after curated/phases.json moved -- and that nobody
      # edited the generated copy by hand.
      - run: uv run python -m pipeline phases --check
      # addon-data.json and addon/ForeverSixty/Data.lua are generated from the
      # build directory and curated/stat-weights.json and committed, so the
      # addon is installable from a checkout with no build step. The nightly
      # bis.yml and, on a push to main, the `addon-data` job below own them:
      # nobody regenerates them by hand (a local regen collided with the
      # nightly's rebase on 2026-09-29). So a push is never failed for drift
      # (rounds 3 and 4 of the sim audit edited curated rotations and left main
      # red until the next nightly); the push job regenerates and commits
      # instead. A pull request, which no bot regenerates, keeps the strict
      # check below.
      # The gates check the ACTIVE build, read from active-build.json the way the
      # Makefile does, so a build move (tools/activate-build.sh) needs no edit here.
      - name: the active build
        id: active
        run: |
          build=$(sed -n 's/.*"build"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' ../web/src/data/active-build.json)
          test -n "$build" || { echo "web/src/data/active-build.json names no build"; exit 1; }
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - run: uv run python -m pipeline weights --build "${{ steps.active.outputs.build }}" --check
      - if: github.event_name == 'pull_request'
        run: uv run python -m pipeline addon-data --build "${{ steps.active.outputs.build }}" --check
      - run: uv run python -m pipeline coach-rules --build "${{ steps.active.outputs.build }}" --check
      # test_addondata.py gates the generated Data.lua on a real `load()`, so the
      # suite needs an interpreter; ubuntu-latest ships none and the test skips
      # itself without one. A plain apt install rather than a third-party action:
      # one binary is not worth a new supply-chain dependency.
      - name: Install Lua for the Data.lua load gate
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: uv run pytest
  addon-data:
    # The push-time owner of addon-data.json and Data.lua (see the `test` job's
    # note): regenerate them from what main now holds and commit them when they
    # moved. A push made with the workflow's own token starts no new run, so
    # the bot's commit never loops back here.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: data } }
    permissions: { contents: write }
    concurrency: { group: addon-data-regen, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - name: the active build
        id: active
        run: |
          build=$(sed -n 's/.*"build"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' ../web/src/data/active-build.json)
          test -n "$build" || { echo "web/src/data/active-build.json names no build"; exit 1; }
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - name: regenerate and commit the addon data when it moved
        env: { BUILD: '${{ steps.active.outputs.build }}' }
        run: |
          if uv run python -m pipeline addon-data --build "$BUILD" --check; then
            echo "addon data is in step with its inputs"; exit 0
          fi
          uv run python -m pipeline addon-data --build "$BUILD"
          git config user.name "forever-data-bot"
          git config user.email "bot@foreversixty.gg"
          git add "builds/$BUILD/addon-data.json" ../addon/ForeverSixty/Data.lua
          git commit -q -m "chore(addon): addon data for $BUILD after ${GITHUB_SHA::9}"
          # main moves under a push (bis.yml's own retry loop has the history):
          # rebase the one commit and retry. On a conflict in the two generated
          # files, regenerate them on top of the newer main instead of picking a side.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --quiet origin main; then
              git push --quiet && exit 0
            else
              git rebase --abort || true
              git reset -q --hard origin/main
              uv run python -m pipeline addon-data --build "$BUILD" --check && exit 0
              uv run python -m pipeline addon-data --build "$BUILD"
              git add "builds/$BUILD/addon-data.json" ../addon/ForeverSixty/Data.lua
              git commit -q -m "chore(addon): addon data for $BUILD after ${GITHUB_SHA::9}"
            fi
            echo "push attempt $attempt failed; retrying"
            sleep 20
          done
          exit 1
  fetch:
    # A dispatch or a call from client.yml names a product; a push or pull request never does.
    if: inputs.product != ''
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: data } }
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      # `fetch` downloads the shipped tables and then layers the server's hotfix
      # push for the build into every spell-side, talent and skill table
      # (pipeline/hotfix_push.py): round 6 found Ice Barrier, Frigid Power and
      # Touch of the Grave among the pushed rows no generator read. A push it
      # cannot read fails this step rather than leaving the build shipped-only.
      - name: Fetch build
        env:
          PRODUCT: ${{ inputs.product }}
          BUILD_IN: ${{ inputs.build }}
          ALLOW_SHRINK: ${{ inputs.allow_shrink }}
        run: |
          # A deliberate re-baseline (dropping rows on purpose) passes --allow-shrink
          # to every gated stage below; the default keeps the no-shrink gates armed.
          if [ "$ALLOW_SHRINK" = "true" ]; then echo "SHRINK=--allow-shrink" >> "$GITHUB_ENV"; else echo "SHRINK=" >> "$GITHUB_ENV"; fi
          ARGS=(--product "$PRODUCT")
          [ -n "$BUILD_IN" ] && ARGS+=(--build "$BUILD_IN")
          BUILD=$(uv run python -m pipeline fetch "${ARGS[@]}" | tail -1)
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "PRODUCT=$PRODUCT" >> "$GITHUB_ENV"
      # A build directory that has never been built starts with none of the
      # nightly fill-in caches (bis.yml's quest-levels, item-sources and
      # loot-merge commit them under raw/ over many nights) nor the hotfix
      # dump `pipeline hotfixes` writes from a play session's DBCache. normalize
      # reads the classic-db supplement and the hotfix dump, loot's curated
      # overlays name sources only the item-sources cache supplies (the first
      # 1.60.1.70291 fetches, 2026-10-08, lost 2,388 items and failed on
      # `vendor:15192`). Item and quest ids are stable across builds, so a new
      # build is seeded from the newest other build's files, each only where it
      # has none. A seeded hotfix dump is marked SEEDED_FROM, and
      # pipeline.hotfix_merge then only ADDS the ids the new client lacks: a
      # hotfix the new client baked in with a different value is never rolled
      # back to the old dump.
      # wowhead/items.json is wowhead's gear-planner item records carried
      # forward (pipeline.wowhead_items.carry_forward): the live feed lost 292
      # of the ~700 items only it carries between 70658 and 70685 (2026-10-29),
      # and a build with no seed fell back to 1.12 stats. It is seeded here,
      # BEFORE fetch-wowhead, which merges the live feed over it.
      - name: Seed the fill-in caches and the hotfix dump from the previous build
        run: |
          PREV=$(ls builds | grep -E '^[0-9]+(\.[0-9]+)+$' | grep -vx "$BUILD" | sort -V | tail -1)
          [ -n "$PREV" ] || exit 0
          for rel in quests/quest-levels.json items/item-sources.json classicdb/*.json hotfixes/*.csv wowhead/items.json; do
            for src in builds/"$PREV"/raw/$rel; do
              [ -e "$src" ] || continue
              dst="builds/$BUILD/raw/${src#builds/$PREV/raw/}"
              [ -e "$dst" ] && continue
              mkdir -p "$(dirname "$dst")" && cp "$src" "$dst" && echo "seeded $dst from $PREV"
              case "$dst" in */raw/hotfixes/*) echo "$PREV" > "builds/$BUILD/raw/hotfixes/SEEDED_FROM";; esac
            done
          done
      # Wowhead's Forever gear planner carries the items Blizzard ships as hotfixes,
      # which never reach the client files wago exports (4,712 of 11,239 items on
      # 2026-09-27). fetch-wowhead merges the live feed over the seeded
      # raw/wowhead/items.json and refuses a feed listing under 90% of the seeded
      # supplement (allow_shrink accepts it and still carries the rest); normalize,
      # icons and simdb read the merged file.
      - run: uv run python -m pipeline fetch-wowhead --build "$BUILD" $SHRINK
      # The hotfix dump above is one old play session's DBCache, seeded forward
      # add-only, so every later push was missing (sim-accuracy round 5: Fiery
      # War Axe 2.9 s against 3.6 s, Blade of Hanna's five dropped stats, 201
      # rows on 70707). wago.tools records the pushes per build; this layers
      # them newest-first into raw/wago-hotfixes/, which the hotfix merge reads.
      - run: uv run python -m pipeline fetch-wago-hotfixes --build "$BUILD" --product "$PRODUCT"
      # The classic-db extracts are re-read from the pinned dump (one ~13 MB download),
      # so a column the reader gained since the seed was written reaches this build:
      # Wave 3 F12, 2026-10-31, item_template.bonding is the Binds line of every item
      # the client's ItemSparse lacks. Same pinned commit, so every other field is
      # unchanged (checked against 70658's committed extracts).
      - run: uv run python -m pipeline fetch-classic-sources --build "$BUILD"
      # Blizzard ships most Forever talent-tree changes as hotfixes, which the DB2 tables
      # above never carry. Wowhead's talent payload is read off the live game: normalize
      # takes the talent trees from it when raw/wowhead-talents.json exists, and falls
      # back to the trait tables when it does not.
      - run: uv run python -m pipeline fetch-wowhead-talents --build "$BUILD"
      - name: Restore the icon cache
        uses: actions/cache@v4
        with:
          path: data/.icon-cache
          key: icon-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: icon-cache-${{ runner.os }}-
      # loot.json, enchants.json and suffixes.json come out of the engine
      # fork's own item database, which is not in this repository: nothing
      # in a DB2 export says which boss drops an item. The fork is cloned
      # at the PINNED sha, the way sim.yml's `rotations` job does it
      # (actions/checkout treats a short sha as a branch name and fails to
      # fetch it), so the committed files name one engine build.
      - name: the pinned engine sha
        id: pin
        working-directory: .
        run: |
          sha=$(sed -n 's/.*Version = "\(.*\)"/\1/p' sim/enginever/version.go)
          test -n "$sha" || { echo "sim/enginever/version.go has no Version"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: the engine fork at the pin
        working-directory: .
        run: |
          git clone --quiet --filter=blob:none https://github.com/jhunthrop/wowsims-forever .engine
          git -C .engine checkout --quiet "${{ steps.pin.outputs.sha }}"
      # classicdb-fidelity, 2026-09-30: normalize reads the fork's item database for the
      # icon names of classic-db-only rows, so the fork checkout moves ahead of it.
      - run: uv run python -m pipeline normalize --build "$BUILD" --engine ../.engine $SHRINK
      # simconst (spellconst/ from the raw spell tables) and levels (levels.json
      # and spellranks.json) come straight after normalize: icons writes the
      # rotation spell icons from spellranks.json and addon-data renders the
      # rotations from both, so on a build directory that has never been
      # built before (2026-10-08, the first 1.60.1.70291 fetch) icons fails
      # with "missing spellranks.json" if they run later. levels needs the raw
      # wowhead payload fetch-wowhead wrote above; a build with no wowhead
      # payload still gets spellranks.json.
      - run: uv run python -m pipeline simconst --build "$BUILD"
      # trainables reads the raw SkillLineAbility and Spell* tables fetch wrote, so it
      # runs here while they are on disk; the engine fork's conformance fixtures are
      # copied from its output (sim/conformance/trainables.go).
      - run: uv run python -m pipeline trainables --build "$BUILD"
      - run: uv run python -m pipeline levels --build "$BUILD"
      - run: uv run python -m pipeline icons --build "$BUILD"
      - run: uv run python -m pipeline tree-art --build "$BUILD"
      # Re-run the offline normalize so manifest.json also covers the icons and tree art
      # the steps above just wrote.
      - run: uv run python -m pipeline normalize --build "$BUILD" --engine ../.engine $SHRINK
      # The fetched build's copy of the curated stat weights, and the addon's
      # data. Without these a new build lands with neither file. They read only
      # classes.json, talents/ and curated/, so they run straight after
      # normalize; the later stages' manifest refreshes then list both files.
      #
      # `addon-data` also renders addon/ForeverSixty/Data.lua, and that render
      # is DELIBERATELY NOT COMMITTED here (the commit step adds builds/ and
      # diffs/ only). Data.lua is a single unversioned file that tracks the
      # ACTIVE build, and pipeline/addonlua.py stamps whichever build the CLI
      # was given into it -- but what activates a build is a human editing
      # web/src/data/active-build.json, which this bot does not touch. Commit
      # it here and the addon ships a build the site is not serving, and the
      # `test` job's `addon-data --build 1.60.1.70374 --check` gate reports it
      # as drift and fails on the bot's own push. Letting the runner discard
      # the render is the correct outcome. Do not add `git add ../addon`.
      - run: uv run python -m pipeline weights --build "$BUILD"
      - run: uv run python -m pipeline addon-data --build "$BUILD"
      # Before simdb: it writes items.json's `suffixes` and
      # `faction_restriction`, which pipeline/simdb/items.py reads into
      # SimItem. Both refresh the same manifest, and the diff step at the
      # end sees the finished directory either way.
      - run: uv run python -m pipeline loot --build "$BUILD" --engine ../.engine $SHRINK
      # simdb reads the same raw inputs normalize does and refreshes
      # manifest.json, so it runs after the normalize that covers icons and
      # tree art rather than before it; simconst and levels ran before icons
      # (above) because icons and addon-data read what they write.
      # gametables before simdb: simdb's rating factors read
      # gametables/combatratings.txt (the fifth 1.60.1.70291 fetch failed there).
      - run: uv run python -m pipeline gametables --build "$BUILD"
      - run: uv run python -m pipeline simdb --build "$BUILD"
      - run: |
          PREV=$(ls builds | grep -E '^[0-9]+(\.[0-9]+)+$' | grep -vx "$BUILD" | sort -V | tail -1)
          if [ -n "$PREV" ]; then uv run python -m pipeline diff --from "$PREV" --to "$BUILD"; fi
      # A new build that lost more than 2% of the previous build's items is a
      # missing input, not a smaller client (2026-10-08: 2,388 of 25,518 gone
      # before the seed step above existed). A deliberate re-baseline passes
      # --allow-shrink, which sets SHRINK.
      - name: No silent catalogue shrink against the previous build
        run: |
          PREV=$(ls builds | grep -E '^[0-9]+(\.[0-9]+)+$' | grep -vx "$BUILD" | sort -V | tail -1)
          [ -n "$PREV" ] || exit 0
          [ -n "$SHRINK" ] && { echo "allow-shrink set; skipping"; exit 0; }
          uv run python - "$PREV" "$BUILD" <<'PY'
          import json, sys
          prev, build = sys.argv[1:3]
          d = json.load(open(f"diffs/{prev}__{build}.json"))["entities"]["items"]
          before = len(json.load(open(f"builds/{prev}/items.json")))
          removed = len(d["removed"])
          print(f"items: {before} in {prev}, {removed} removed, {len(d['added'])} added")
          if removed > 0.02 * before:
              sys.exit(f"{removed} items removed is more than 2% of {before}; a missing input, or pass allow_shrink")
          PY
      - run: |
          git config user.name "forever-data-bot"
          git config user.email "bot@foreversixty.gg"
          git add builds
          git add diffs
          if ! git commit -m "data: build $BUILD ($PRODUCT)"; then
            echo "nothing to commit"; exit 0
          fi
          # main moves while this job runs (the client watcher's 2026-10-16 fetch
          # lost its push to a commit that landed mid-job): rebase the one build
          # commit onto whatever main is now and retry, as bis.yml does.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash --quiet origin main && git push --quiet; then
              exit 0
            fi
            echo "push attempt $attempt failed; retrying"
            sleep 20
          done
          exit 1
