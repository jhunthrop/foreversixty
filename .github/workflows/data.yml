# .github/workflows/data.yml
name: data
on:
  push:
    branches: [main]
    paths: ['data/**', 'sim/specs/**', 'sim/enginever/version.go', 'sim/request/IDS.md', 'web/src/lib/sim/specs.ts', 'web/src/data/phases.json', '.github/workflows/data.yml']
  pull_request:
    paths: ['data/**', 'sim/specs/**', 'sim/enginever/version.go', 'sim/request/IDS.md', 'web/src/lib/sim/specs.ts', 'web/src/data/phases.json', '.github/workflows/data.yml']
  workflow_dispatch:
    inputs:
      product: { description: 'wago.tools product key', required: true, default: 'wow_classic_era' }
      build: { description: 'build string (blank = latest)', required: false }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: data } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run ruff check .
      # sim/specs/specs.go and web/src/lib/sim/specs.ts are generated from
      # curated/specs.json and committed. `specs` is not a per-build emitter,
      # so the fetch job never runs it; this is the gate that catches an edit
      # to either generated file, or to the curated list, that was never
      # regenerated.
      - run: uv run python -m pipeline specs --check
      # phases, like specs, is not a per-build emitter, so the fetch job
      # never runs it. This is the gate that web/src/data/phases.json was
      # re-emitted after curated/phases.json moved -- and that nobody
      # edited the generated copy by hand.
      - run: uv run python -m pipeline phases --check
      - run: uv run pytest
  fetch:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: data } }
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - name: Fetch build
        env:
          PRODUCT: ${{ inputs.product }}
          BUILD_IN: ${{ inputs.build }}
        run: |
          ARGS=(--product "$PRODUCT")
          [ -n "$BUILD_IN" ] && ARGS+=(--build "$BUILD_IN")
          BUILD=$(uv run python -m pipeline fetch "${ARGS[@]}" | tail -1)
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "PRODUCT=$PRODUCT" >> "$GITHUB_ENV"
      - name: Restore the icon cache
        uses: actions/cache@v4
        with:
          path: data/.icon-cache
          key: icon-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: icon-cache-${{ runner.os }}-
      - run: uv run python -m pipeline normalize --build "$BUILD"
      - run: uv run python -m pipeline icons --build "$BUILD"
      - run: uv run python -m pipeline tree-art --build "$BUILD"
      # Re-run the offline normalize so manifest.json also covers the icons and tree art
      # the steps above just wrote.
      - run: uv run python -m pipeline normalize --build "$BUILD"
      # loot.json, enchants.json and suffixes.json come out of the engine
      # fork's own item database, which is not in this repository: nothing
      # in a DB2 export says which boss drops an item. The fork is cloned
      # at the PINNED sha, the way sim.yml's `rotations` job does it
      # (actions/checkout treats a short sha as a branch name and fails to
      # fetch it), so the committed files name one engine build.
      - name: the pinned engine sha
        id: pin
        working-directory: .
        run: |
          sha=$(sed -n 's/.*Version = "\(.*\)"/\1/p' sim/enginever/version.go)
          test -n "$sha" || { echo "sim/enginever/version.go has no Version"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: the engine fork at the pin
        working-directory: .
        run: |
          git clone --quiet --filter=blob:none https://github.com/jhunthrop/wowsims-forever .engine
          git -C .engine checkout --quiet "${{ steps.pin.outputs.sha }}"
      # Before simdb: it writes items.json's `suffixes` and
      # `faction_restriction`, which pipeline/simdb/items.py reads into
      # SimItem. Both refresh the same manifest, and the diff step at the
      # end sees the finished directory either way.
      - run: uv run python -m pipeline loot --build "$BUILD" --engine ../.engine
      # The simulator's outputs. All three read the same raw inputs normalize
      # does and all three refresh manifest.json, so they run after the
      # normalize that covers icons and tree art rather than before it.
      - run: uv run python -m pipeline simdb --build "$BUILD"
      - run: uv run python -m pipeline simconst --build "$BUILD"
      - run: uv run python -m pipeline gametables --build "$BUILD"
      - run: |
          PREV=$(ls builds | grep -vx "$BUILD" | sort -V | tail -1)
          if [ -n "$PREV" ]; then uv run python -m pipeline diff --from "$PREV" --to "$BUILD"; fi
      - run: |
          git config user.name "forever-data-bot"
          git config user.email "bot@foreversixty.gg"
          git add builds
          git add diffs
          git commit -m "data: build $BUILD ($PRODUCT)" || echo "nothing to commit"
          git push
