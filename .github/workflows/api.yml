name: api
on:
  push:
    branches: [main]
    paths: ['api/**', 'logs/**', 'sim/**', 'data/builds/**', 'data/curated/**', 'web/src/content/guides/**', 'web/src/data/active-build.json', 'docs/contracts/**', 'docs/superpowers/specs/2026-10-27-log-coach-design.md', 'design/specs/2026-10-28-log-coach.md', '.github/workflows/api.yml']
  pull_request:
    paths: ['api/**', 'logs/**', 'sim/**', 'data/builds/**', 'data/curated/**', 'web/src/content/guides/**', 'web/src/data/active-build.json', 'docs/contracts/**', 'docs/superpowers/specs/2026-10-27-log-coach-design.md', 'design/specs/2026-10-28-log-coach.md', '.github/workflows/api.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # ci-minutes lane, 2026-10-15: two pushes in quick succession used to run
    # both test and image jobs to completion for each. Only the newest push's
    # result matters, so the check jobs cancel their superseded twin. The
    # group is per job, not per workflow, so a deploy already in flight is
    # never cancelled (web.yml lost a deploy that way on 2026-10-02).
    concurrency:
      group: api-test-${{ github.ref }}
      cancel-in-progress: true
    defaults: { run: { working-directory: api } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: forever, POSTGRES_PASSWORD: forever, POSTGRES_DB: forever_test }
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U forever" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://forever:forever@localhost:5433/forever_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: api/go.mod, cache-dependency-path: api/go.sum }
      # The workspace lists ./sim, whose development replace points at a
      # laptop path; pin it to the fork at the recorded sha as sim.yml does,
      # or go vet/test cannot resolve the module graph at all.
      - uses: ./.github/actions/pin-engine
      - run: go vet ./...
        # -p 1: the database-backed packages share one Postgres and each
        # truncates the tables it uses, so they cannot run at once.
      - run: go test -race -cover -p 1 ./...
        # sim/runner is this lane's package in the sim module. Only the
        # engine-free packages are run here: sim/adapter and sim/request
        # import the engine, which the engine lane's own workflow builds.
        # GOWORK=off keeps the workspace (and its engine replace, which
        # points at a local clone) out of it - verified: with GOWORK=off
        # an engine-free package of the module builds, vets and tests
        # with no engine checkout at all.
      - name: Embed the active build's item and enchant tables
        working-directory: .
        run: make simdb
      - name: Test the sim module's engine-free packages
        working-directory: sim
        env: { GOWORK: off }
        run: go test -race -cover ./runner/ ./talents/ ./api/
  # BuildKit reads api/Dockerfile.dockerignore in preference to the
  # repository root's .dockerignore - a per-Dockerfile ignore file
  # that excludes something the engine stage needs breaks only under
  # BuildKit, and the deploy job (below) is the only place that ever
  # ran `docker build` before this job existed, only on push to main.
  # This job builds the same image on every push and PR that can
  # change it, with the same --build-args the deploy job uses, so a
  # broken image is caught before it reaches deploy.
  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: api-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: api/go.mod, cache-dependency-path: api/go.sum }
      # ci-minutes lane, 2026-10-15: the image is built through buildx with
      # its layer cache in the Actions cache, so a push that changes only Go
      # source reuses the module-download and engine layers instead of
      # rebuilding the whole image from scratch every time. The pin check
      # below is what makes a cached layer safe: a stale engine layer fails
      # the job rather than shipping.
      - uses: docker/setup-buildx-action@v3
        # Read once, here, from the same two files the engine stage
        # itself trusts: the active build (so this builds with
        # ENGINE_SIMDB_SOURCE=engine-source-active, exactly like
        # deploy, instead of engine-source-all's every-build copy) and
        # the pin (so the next step can fail this job if the image's
        # binary ever answers with anything else).
      - name: Read the active build and the engine pin
        run: |
          active=$(sed -n 's/.*"build"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' web/src/data/active-build.json)
          test -n "$active" || { echo "web/src/data/active-build.json names no build"; exit 1; }
          pin=$(grep 'const Version' sim/enginever/version.go | cut -d'"' -f2)
          test -n "$pin" || { echo "sim/enginever/version.go has no Version"; exit 1; }
          echo "ACTIVE_BUILD=$active" >> "$GITHUB_ENV"
          echo "ENGINE_PIN=$pin" >> "$GITHUB_ENV"
      - name: Build the image with BuildKit
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          load: true
          tags: forever-api-image-check
          build-args: |
            VERSION=${{ github.sha }}
            ENGINE_SIMDB_SOURCE=engine-source-active
            ACTIVE_BUILD=${{ env.ACTIVE_BUILD }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        # Not just that the binary runs: that it is the pinned engine.
        # A stale build-cache layer could serve an old sim/ tree at the
        # right paths with the wrong sha baked into its ldflags, and a
        # bare `docker run ... -version` with no comparison would pass
        # that just as happily as a correct image.
      - name: The image carries the pinned engine
        run: |
          got=$(docker run --rm --entrypoint /engine/forever-sim forever-api-image-check -version)
          echo "pin=$ENGINE_PIN got=$got"
          test "$got" = "$ENGINE_PIN" || {
            echo "the image's engine binary reports '$got', not the pinned '$ENGINE_PIN'"; exit 1; }
        # api/internal/sims/image_test.go's TestTheEngineBinaryReportsThePin
        # looks for the engine at runner.DefaultBinary, a hardcoded
        # absolute path (/engine/forever-sim) - not an env var - and
        # skips cleanly whenever nothing is there, which is every
        # environment except one built from this image. Putting the
        # extracted binary at that exact path is what turns the skip
        # into a real assertion against the image's own binary.
      - name: Extract the engine binary to where the runner looks for it
        run: |
          sudo mkdir -p /engine
          cid=$(docker create --entrypoint /engine/forever-sim forever-api-image-check)
          sudo docker cp "$cid:/engine/forever-sim" /engine/forever-sim
          docker rm "$cid" >/dev/null
          sudo chmod 0755 /engine/forever-sim
        # GOWORK=off for the same reason the sim-module step in the
        # test job above needs it: sim/go.mod's development replace for
        # github.com/wowsims/classic points at a developer's local
        # clone, and go.work (at the repository root, auto-detected
        # above this job's api/ working directory) would otherwise pull
        # that unresolvable path into the whole workspace's build list.
        # api/go.mod's own replaces resolve everything this package
        # needs without it - verified: the import boundary (Step 3 of
        # the lane's final review) never reaches wowsims/classic.
      - name: The image tests, against the real engine
        working-directory: api
        env: { GOWORK: off }
        run: go test ./internal/sims/ -run 'Image|Pin' -v
  deploy:
    needs: [test, image]
    # Deploys only once the Google Cloud variables from api/README.md "First-time setup" exist.
    # A dispatch deploys too: a push made with GITHUB_TOKEN (the data bot's build
    # commit, the client watcher's activation) triggers no workflow, so
    # tools/activate-build.sh dispatches this one to carry the new build's
    # simdb into the service image.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: { contents: read, id-token: write }
    env:
      IMAGE: us-east1-docker.pkg.dev/foreversixty/api/api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker us-east1-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
        # Read once, here, from the same two files the engine stage
        # itself trusts: the active build (so the engine stage copies
        # one build's simdb.bin instead of every build's ~83MB - see
        # api/Dockerfile's ENGINE_SIMDB_SOURCE) and the pin (so the
        # next step can fail the deploy if the image's binary ever
        # answers with anything else).
      - name: Read the active build and the engine pin
        run: |
          active=$(sed -n 's/.*"build"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' web/src/data/active-build.json)
          test -n "$active" || { echo "web/src/data/active-build.json names no build"; exit 1; }
          pin=$(grep 'const Version' sim/enginever/version.go | cut -d'"' -f2)
          test -n "$pin" || { echo "sim/enginever/version.go has no Version"; exit 1; }
          echo "ACTIVE_BUILD=$active" >> "$GITHUB_ENV"
          echo "ENGINE_PIN=$pin" >> "$GITHUB_ENV"
        # The same buildx build as the image job, reading the layer cache it
        # just wrote (cache-from only: the image job is the writer), so the
        # deploy's build is mostly cache hits. Loaded locally for the pin
        # check, then pushed by the step after it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            VERSION=${{ github.sha }}
            ENGINE_SIMDB_SOURCE=engine-source-active
            ACTIVE_BUILD=${{ env.ACTIVE_BUILD }}
          cache-from: type=gha
        # Not just that the binary runs: that it is the pinned engine.
        # A stale build-cache layer could serve an old sim/ tree at the
        # right paths with the wrong sha baked into its ldflags, and a
        # bare `docker run ... -version` with no comparison would pass
        # that just as happily as a correct image.
      - name: The image carries the pinned engine
        run: |
          got=$(docker run --rm --entrypoint /engine/forever-sim $IMAGE -version)
          echo "pin=$ENGINE_PIN got=$got"
          test "$got" = "$ENGINE_PIN" || {
            echo "the image's engine binary reports '$got', not the pinned '$ENGINE_PIN'"; exit 1; }
      - run: docker push $IMAGE
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: api
          region: us-east1
          image: ${{ env.IMAGE }}
          # The service container runs the planner (forever-sim -plan) whose
          # answer nears 22 MB at the server cap; 256Mi at concurrency 80
          # is not enough headroom. Conservative; api/README.md says so.
          # 1Gi: the 2026-10-15 rollout (3dc79d26) failed its startup probe at 520 MiB on
          # 512Mi; the boot-time tree load and the guild membership sweep peak near the old
          # limit, and a revision that cannot start never takes traffic.
          flags: --memory=1Gi
        # Every job is the same image run with different arguments, so
        # each has to move with the service. The jobs are created once
        # by hand (see api/README.md); until one exists this step says
        # so rather than failing the deploy.
      - name: Point the jobs at the new image
        run: |
          for job in parse-report sim-run sim-validate stripe-reconcile billing-daily raid-posts rating-backfill rating-rerate-flagged data-addon bnet-refresh rating-rebuild-preparation coach-review coach-simref coach-samples; do
            if gcloud run jobs describe "$job" --region us-east1 >/dev/null 2>&1; then
              gcloud run jobs update "$job" --region us-east1 --image "$IMAGE"
            else
              echo "the $job job does not exist yet; skipping"
            fi
          done
