# .github/workflows/web.yml
#
# Job graph (see the ci-web-fast lane's change, 2026-09-30):
#
#   build --+--> build-real (real-data build + its postbuild checks, off the critical path)
#           +--> parity (the mock parity specs, launch mode included; tools/land.sh waits on it)
#           +--> e2e (matrix: shard 1-4/4)
#           +--> lhci (matrix: shard 1-3/3, 2-3 of the 7 budgeted URLs each) --> lhci-alert
#           +--> real-engine (the real sim.wasm + the four real-engine specs) --+
#           |      ^-- real-engine-scope (on a pull request: can the change     |
#           |          reach the wasm? push and dispatch always run it)          |
#           +-------------------------------------------------------------------+--> deploy
#                                                                    (main push/dispatch only)
#
# deploy needs build and real-engine: a failed real-engine blocks it, and so does a
# real-engine skipped for any reason but real-engine-scope's run=false. build-real, e2e and
# lhci do not gate it (BUILD MODE, below).
#
# `build` runs once (install, check, lint, format, unit tests, the FOREVER_DATA=fixture
# build) and uploads web/dist so `e2e` and `lhci` each start from the same bytes instead of
# rebuilding. `build-real` repeats the pre-split real-data `npm run build` and its postbuild
# checks (check-island-size.mjs, check-no-removed-routes.mjs, check-sim-engine-artifact.mjs)
# in its own job: it still gates `deploy` the same as before, but no longer sits in front of
# `e2e`/`lhci` on the critical path, since neither needs anything it produces. `e2e` shards
# the Playwright suite four ways (1216 tests as of 2026-09-30: `npx playwright test --list`)
# so it runs in parallel instead of one long serial pass; it also re-runs `sync:duckdb` (a
# local file copy out of node_modules, not a rebuild) because the two DuckDB engine modules
# it stages under web/build/ live outside dist/ and are not in the web-dist artifact --
# tests/e2e/support/duckdb-runtime.ts reads them straight off that path.
# `lhci` audits only the URLs needed to exercise every distinct budget rule in
# lighthouserc.json's assertMatrix on every push/PR, sharded three ways (LHCI_PUSH_SHARD,
# lighthouserc.push.cjs's PUSH_GROUPS) so they run in parallel instead of one job auditing
# all 7; the full 16-URL list still runs, unchanged, in `lhci-nightly` (schedule trigger
# only) -- same config, same assertions, just less often. Nothing here drops a test, skips
# an assertion, or relaxes a budget: see web/lighthouserc.push.cjs and web/README.md's
# FOREVER_DATA section for the detail.
#
# LAUNCH MODE (vars.LAUNCH_MODE == 'true', docs/runbooks/landing.md "Launch mode"): `build`
# runs check, lint, format, the guide prose test and the fixture build, and `parity` runs; e2e, real-engine
# (real-engine-scope answers run=false), lhci and lhci-alert skip; deploy is unchanged, and
# smoke.yml checks production after it.
name: web
on:
  push:
    branches: [main, 'land/**']
    paths:
      - web/**
      - design/mocks/web/**
      - design/mocks/app/**
      - design/mocks/ws_*.py
      - design/mocks/mocklib.py
      - design/mocks/app_*.mjs
      - design/tokens/**
      - sim/**
      - data/builds/**
      - Makefile
      - tools/wasm-compress.sh
      - tools/slop/**
      - apps/shared/copy/**
      - .github/actions/pin-engine/**
      - .github/workflows/web.yml
  pull_request:
    paths:
      - web/**
      - design/mocks/web/**
      - design/mocks/app/**
      - design/mocks/ws_*.py
      - design/mocks/mocklib.py
      - design/mocks/app_*.mjs
      - design/tokens/**
      - sim/**
      - data/builds/**
      - Makefile
      - tools/wasm-compress.sh
      - tools/slop/**
      - apps/shared/copy/**
      - .github/actions/pin-engine/**
      - .github/workflows/web.yml
  workflow_dispatch:
    inputs:
      full:
        description: Run the unit tests and the e2e suite even in launch mode (lanes use this instead of running the suites on a laptop)
        type: boolean
        default: false
  # The full 16-URL Lighthouse audit (web/lighthouserc.json, unchanged): same budgets, same
  # numberOfRuns, just off the push/PR critical path. Runs after data.yml's nightly regen
  # (addon-data-release.yml at 05:00 UTC, bis.yml at 06:23 UTC) so it audits the day's data.
  schedule:
    - cron: '15 7 * * *'
permissions:
  contents: read
env:
  PUBLIC_API_BASE_URL: https://api.foreversixty.gg
# The scheduled lhci-nightly run must never cancel a push deploy on the same ref (it did on
# 2026-10-02: the 07:15 UTC schedule fired while a push's deploy was mid-flight and the
# deploy was cancelled, leaving main undeployed), so the group carries the event name.
concurrency:
  group: web-${{ github.event_name }}-${{ startsWith(github.ref, 'refs/heads/land/') && github.sha || github.ref }}
  # A newer push cancels a branch or pull request run; main's runs always finish, or a
  # quick second push leaves production undeployed (2026-11-02: two hours).
  # A land/** run (tools/land.sh) is grouped by its sha and is never cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/land/') }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: { run: { working-directory: web } }
    steps:
      # The trees no job here reads stay out of the checkout, and data/builds comes from the
      # cache (docs/runbooks/landing.md, "Checkout"). The unit tests hold the mobile codegen's
      # drift checks, so this job keeps apps/ios and apps/android.
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/builds/
            !/data/diffs/
            !/design/reviews/
            !/design/mocks/
            /design/mocks/ws_lib.py
            !/docs/superpowers/reviews/
      - uses: ./.github/actions/data-builds
      - uses: actions/setup-node@v4
        with:
          {
            node-version-file: web/.node-version,
            cache: npm,
            cache-dependency-path: web/package-lock.json,
          }
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      # `pretest` sets FOREVER_DATA=fixture, so the unit tests see the checked-in fixture
      # rather than whatever the data pipeline last emitted.
      - if: vars.LAUNCH_MODE != 'true' || inputs.full
        run: npm test
      # tokens.css and both apps' token files against design/tokens/tokens.json (node:test).
      - name: the generated design tokens
        run: node --test ../design/tokens/tokens.test.mjs
      # LAUNCH MODE (docs/runbooks/landing.md, "Launch mode"): the guide prose test alone.
      - name: the guide prose test (launch mode)
        if: vars.LAUNCH_MODE == 'true'
        run: npm test -- src/content/guides/_prose.test.ts
      # The fixture build: this is the dist/ that both `e2e` and `lhci` need. Previously
      # Playwright's own webServer (`playwright.config.ts`) rebuilt this implicitly, on the
      # fixture, right before the e2e suite ran, and lhci then audited whatever that left
      # behind. Building it once here, explicitly, with the same command and env, means e2e
      # and lhci can download it and skip rebuilding -- see E2E_SKIP_BUILD below.
      # PUBLIC_API_BASE_URL overrides the workflow's production URL with a dead port
      # (web/tests/hermetic.ts's DEAD_API_BASE; src/e2e-hermetic.test.ts pins the
      # two equal): e2e and lhci serve this dist, and no test may ever call the production API.
      # Only deploy's real-data build carries the production URL to a served site.
      - name: build the fixture dist e2e and lhci audit
        run: npm run build
        env:
          FOREVER_DATA: fixture
          PUBLIC_API_BASE_URL: http://127.0.0.1:9
      # e2e and lhci download it, and `parity` does in launch mode too.
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1
      # The island budgets on the REAL data, the way deploy's `CF_PAGES=1 npm run build` measures
      # them, on land/** only (so tools/land.sh sees it) and after the fixture dist is uploaded.
      # The fixture build above passes budgets the real build fails: on 2026-11-04 two land
      # branches green here put planner-island.js 59 bytes over on main, and deploy failed. Only
      # the real-data sync, the four island bundles and the size check run; no Astro build, no deploy.
      - name: the island budgets on the real data (land branches)
        if: startsWith(github.ref, 'refs/heads/land/')
        run: npm run sync && npm run build:island && node scripts/check-island-size.mjs
  # The mock parity gate (design/parity.md): every built page that has committed mocks against
  # them, region by region (web/tests/e2e/parity-*.spec.ts). It runs on every push and PR, launch
  # mode included, so a land/** branch never lands a page region its mock does not have:
  # tools/land.sh waits for this job like every other and stops on its failure. It is the parity
  # specs alone (seconds against the fixture dist `build` uploaded), not the four-shard suite:
  # that stays in `e2e`, which launch mode skips (about 17 minutes a shard).
  parity:
    needs: build
    # SHIP_FAST (owner, 2026-11-09, during the redesign): parity runs only on a full dispatch.
    if: github.event_name != 'schedule' && (vars.SHIP_FAST != 'true' || inputs.full)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: web } }
    steps:
      # As e2e's checkout (the committed mocks and their generators, design/mocks/*.py and
      # *.mjs, included), without data/builds: the BiS spec and the served dist read none. The
      # specs render their mocks at test time (tests/e2e/support/parity-mocks.ts) with the
      # runner's own python3 (standard library only); the simulator's are drawn from data files
      # the spec also serves to the fixture build, so the next step adds just those files.
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/builds/
            !/data/diffs/
            !/design/reviews/
            !/design/mocks/
            /design/mocks/web/
            /design/mocks/app/
            /design/mocks/*.py
            /design/mocks/*.mjs
            /design/mocks/data/chrome/
            /design/mocks/data/fonts/
            !/docs/superpowers/reviews/
            !/apps/ios/
            !/apps/android/
      # tests/e2e/support/sim-parity.ts serves these to the build (the mocks are drawn from them).
      - name: the mocks' data files
        working-directory: ${{ github.workspace }}
        run: node web/tests/e2e/support/parity-data-paths.mjs | xargs git sparse-checkout add
      - uses: actions/setup-node@v4
        with:
          {
            node-version-file: web/.node-version,
            cache: npm,
            cache-dependency-path: web/package-lock.json,
          }
      - run: npm ci
      - name: read the pinned Playwright version
        id: playwright-version
        run: |
          echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: npx playwright test tests/e2e/parity-*.spec.ts --project=desktop
        env:
          FOREVER_DATA: fixture
          E2E_SKIP_BUILD: '1'
      # The native parity reference (design/parity.md "Native"): the app mocks rebuilt from their
      # sources and every region file checked against a fresh render (the repo's fonts, so the
      # render is the same here and on a lane's Mac). A mock change without its region files fails
      # here, naming each file and the command.
      # On a failure the step writes the files this runner renders and uploads them as
      # app-regions: commit those (a Mac's Chromium lays some mocks out differently).
      - name: the app mocks' region files are current
        if: success() || failure()
        working-directory: ${{ github.workspace }}
        run: |
          python3 design/mocks/ws_app.py
          node design/mocks/app_regions.mjs --check || { node design/mocks/app_regions.mjs; exit 1; }
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-regions
          path: design/mocks/app/regions/
          retention-days: 7
      # The committed reference mocks against the ones the specs just rendered: a warning and the
      # regen commands in the job summary, never a red job (design/parity.md, "The reference
      # mocks"): the gate above compared against the test-time mocks, so a data refresh lands
      # without a hand regen.
      - name: the reference mocks against the build (a report, not a gate)
        if: success() || failure()
        # Report only: the warning and the regen commands go to the job summary; `|| true` keeps the job free of a red mark.
        run: node scripts/check-parity-mocks.mjs || true
      # The mock | build side-by-sides, red or green: the review starts from them.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-side-by-side
          path: web/test-results/
          retention-days: 7
  # BUILD MODE (owner, 2026-10-04): until the page pass is done, a push to main deploys on the
  # `build` job (check, lint, format, unit tests, fixture build) and, since round 9
  # (2026-11-02), `real-engine`. build-real still runs on schedule / workflow_dispatch only,
  # and none of build-real, e2e or lhci gate deploy. lhci
  # runs on every push as well (2026-11-02): skipped on push, /planner sat under its 0.90
  # budget for weeks and lhci-nightly was red every night from 10-18 to 11-01 unseen;
  # `lhci-alert` below now keeps one open issue while either is red. e2e runs
  # on every push as well (2026-10-31): skipped on push it sat red on dispatch and schedule from
  # 10-29 to 10-31 while every push read green. Four shards of ~12 min of tests (~17 min a
  # shard with setup, in parallel beside deploy) on a public repository's free runners, so a
  # push's commit status is red the moment the suite is. To re-enable gating: add build-real,
  # e2e and lhci to deploy's `needs:` with a `needs.<job>.result == 'success'` clause each,
  # and drop build-real's `if:`.
  build-real:
    needs: build
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version-file: web/.node-version,
            cache: npm,
            cache-dependency-path: web/package-lock.json,
          }
      - run: npm ci
      # The real-data build (FOREVER_DATA unset, `real` is the default): this is the only
      # place a PR exercises the real build's `postbuild` checks (check-island-size.mjs,
      # check-no-removed-routes.mjs, check-sim-engine-artifact.mjs, which no-ops here since
      # PUBLIC_SIM_ENGINE is unset) before `deploy`'s own real build runs them again on main
      # after merge. `needs: build` so a broken `check`/`lint`/`test` fails fast without
      # wasting this build's time; otherwise independent of `build`'s own output, which is
      # why it runs beside `e2e`/`lhci` instead of blocking them the way it did pre-split.
      - run: npm run build
  e2e:
    needs: build
    if: vars.LAUNCH_MODE != 'true' || inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: { run: { working-directory: web } }
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # As `build`'s checkout, less the two native apps, which nothing past the unit tests reads.
      - uses: actions/checkout@v4
        with: &checkout
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/builds/
            !/data/diffs/
            !/design/reviews/
            !/design/mocks/
            /design/mocks/web/
            /design/mocks/*.py
            /design/mocks/*.mjs
            /design/mocks/data/chrome/
            /design/mocks/data/fonts/
            !/docs/superpowers/reviews/
            !/apps/ios/
            !/apps/android/
      - uses: ./.github/actions/data-builds
      - uses: actions/setup-node@v4
        with:
          {
            node-version-file: web/.node-version,
            cache: npm,
            cache-dependency-path: web/package-lock.json,
          }
      - run: npm ci
      # Cache the browser binaries by the exact @playwright/test version pinned in the
      # lockfile: a version bump gets a fresh cache key automatically rather than an install
      # silently reusing a stale binary. `playwright install` is idempotent -- it skips the
      # download when the cached version already matches, but still runs the (fast, cache-
      # independent) apt step `--with-deps` needs on every runner, so it is not skipped on a
      # cache hit, only shortened.
      - name: read the pinned Playwright version
        id: playwright-version
        run: |
          echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - run: npx playwright install --with-deps chromium
      # web/build/duckdb-runtime/<version>/*.wasm lives outside dist/ (too large for a
      # Cloudflare static asset -- see scripts/sync-duckdb.mjs) and is not part of the
      # web-dist artifact. tests/e2e/support/duckdb-runtime.ts reads the two engine modules
      # straight off that path to stub the route `astro preview` cannot serve itself. This
      # is a local copy out of node_modules (0.3s; confirmed no network access), not a
      # rebuild: it does not touch dist/, so it does not race or duplicate the `build` job's
      # own fixture build.
      - run: npm run sync:duckdb
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          # The report, rankings, character and guild fixture pages only exist under
          # FOREVER_DATA=fixture, and playwright.config.ts's webServer already defaults to
          # it. This makes the dependency explicit for anyone reading the workflow.
          FOREVER_DATA: fixture
          # Tells playwright.config.ts's webServer to run `npm run preview` alone instead of
          # `npm run build && npm run preview`: the downloaded web-dist artifact above IS
          # that build, already produced once by the `build` job on the same command and env.
          E2E_SKIP_BUILD: '1'
      # A failed e2e run is only diagnosable from the page snapshot and trace Playwright
      # writes under test-results/; without this they die with the runner. Each shard needs
      # its own artifact name -- upload-artifact refuses to merge same-named uploads.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-shard-${{ matrix.shard }}
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
  # The four real-engine Playwright specs (web/package.json's test:e2e:real-engine: the /sim
  # smoke run, Top Gear, weights and talents) against the real sim.wasm, built the way
  # `deploy` builds it. Every other e2e serves the checked-in fake engine, and these four
  # skip without a published wasm, so before this job nothing ran them and three went stale
  # unseen (round 6, design/reviews/2026-11-02-sim-audit-round6/page.md P3). Here a missing
  # wasm, or any skipped spec, FAILS the job. `real-engine-scope` limits a pull request to
  # changes that can move the wasm, its loader or these specs; push, dispatch always run.
  # real-engine gates `deploy` (see deploy's `if:`).
  real-engine-scope:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # A cold checkout of the repository can take minutes when many jobs start at once (a
    # land/** smoke run, 2026-11-03: 5 minutes, which timed this job out at 5 and skipped
    # real-engine). Push and dispatch need no checkout to answer `run=true`.
    timeout-minutes: 20
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          LAUNCH_MODE: ${{ vars.LAUNCH_MODE }}
        run: |
          # LAUNCH MODE skips real-engine the one way deploy's gate already lets through.
          if [ "$LAUNCH_MODE" = true ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "launch mode: real-engine is skipped (docs/runbooks/landing.md)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$EVENT" != pull_request ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch -q --depth=1 origin "$BASE"
          changed=$(git diff --name-only "$BASE" HEAD)
          if printf '%s\n' "$changed" | grep -qE '^(sim/|logs/|Makefile$|tools/wasm-compress\.sh$|data/builds/[^/]+/(simdb\.bin|enchants\.json|spellranks\.json)$|web/src/data/active-build\.json$|web/src/lib/sim/|web/tests/e2e/(sim-[a-z-]*real-engine\.spec\.ts|support/real-engine\.ts)$|web/playwright\.config\.ts$|web/package(-lock)?\.json$|\.github/actions/pin-engine/|\.github/workflows/web\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no change reaches the wasm, its loader or the real-engine specs" >> "$GITHUB_STEP_SUMMARY"
          fi
  real-engine:
    needs: [build, real-engine-scope]
    if: needs.real-engine-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
        with: *checkout
      - uses: ./.github/actions/data-builds
      # The wasm's inputs, exactly: the engine pin, the sim/ and logs/ trees (sim/go.mod's
      # `go` line picks the toolchain, so it is in the sim tree), the Makefile and
      # tools/wasm-compress.sh (which writes the cached sim.wasm.gz and .br), and the active build's
      # three embedded files. git's own tree and blob ids, so the key moves
      # only when a byte that is compiled in does.
      - name: the wasm's cache key
        id: wasm-key
        working-directory: .
        run: |
          pin=$(sed -n 's/.*Version = "\(.*\)"/\1/p' sim/enginever/version.go)
          test -n "$pin" || { echo "sim/enginever/version.go has no Version"; exit 1; }
          build=$(sed -n 's/.*"build"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' web/src/data/active-build.json)
          test -n "$build" || { echo "web/src/data/active-build.json has no build"; exit 1; }
          inputs=$(git rev-parse HEAD:sim HEAD:logs HEAD:Makefile HEAD:tools/wasm-compress.sh \
            "HEAD:data/builds/$build/simdb.bin" "HEAD:data/builds/$build/enchants.json" "HEAD:data/builds/$build/spellranks.json")
          echo "key=sim-wasm-v1-$pin-$(printf '%s\n' "$inputs" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - id: wasm-cache
        uses: actions/cache@v4
        with:
          path: |
            artifacts/ARTIFACT_ID
            web/public/_sim/
          key: ${{ steps.wasm-key.outputs.key }}
      # A miss builds the wasm exactly as `deploy` does: setup-go on sim/go.mod's version,
      # the pinned engine, make simdb, make publish-wasm (which runs make artifacts and its
      # 4.5 MB gzipped budget). setup-go's own cache is off: its key is sim/go.sum alone,
      # shared with sim.yml's native test jobs, so it would restore a cache with no js/wasm
      # objects in it. This one holds the wasm build's objects and modules.
      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with: { go-version-file: sim/go.mod, cache: false }
      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-wasm-${{ runner.os }}-${{ hashFiles('sim/go.mod', 'sim/go.sum', 'sim/enginever/version.go') }}
          restore-keys: go-wasm-${{ runner.os }}-
      - if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/pin-engine
      - name: build and publish sim.wasm.gz and sim.js
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          make simdb
          make publish-wasm
      - name: the published wasm is there
        working-directory: .
        run: |
          id=$(cat artifacts/ARTIFACT_ID)
          pin=$(sed -n 's/.*Version = "\(.*\)"/\1/p' sim/enginever/version.go)
          case "$id" in "$pin-"*) ;; *) echo "artifact '$id' does not belong to engine $pin"; exit 1;; esac
          dir="web/public/_sim/$id"
          test -f "$dir/sim.wasm.gz" || { echo "missing $dir/sim.wasm.gz"; exit 1; }
          test -f "$dir/sim.wasm.br" || { echo "missing $dir/sim.wasm.br"; exit 1; }
          test -f "$dir/sim.js" || { echo "missing $dir/sim.js"; exit 1; }
          bytes=$(wc -c < "$dir/sim.wasm.gz" | tr -d ' ')
          br_bytes=$(wc -c < "$dir/sim.wasm.br" | tr -d ' ')
          echo "sim.wasm.gz: $bytes bytes, sim.wasm.br: $br_bytes bytes ($id, cache hit: ${{ steps.wasm-cache.outputs.cache-hit == 'true' }})" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "PUBLIC_SIM_ARTIFACT=$id" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          {
            node-version-file: web/.node-version,
            cache: npm,
            cache-dependency-path: web/package-lock.json,
          }
      - run: npm ci
      - name: read the pinned Playwright version
        id: playwright-version
        run: |
          echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - run: npx playwright install --with-deps chromium
      # The real-data build with the real engine, as `deploy`'s, but on the dead API port
      # (tests/hermetic.ts) like every e2e dist. Its postbuild check-sim-engine-artifact.mjs
      # fails if dist/_sim/ lacks the pair.
      - name: build the real-data dist with the real engine
        run: npm run build
        env:
          FOREVER_DATA: real
          PUBLIC_SIM_ENGINE: wasm
          PUBLIC_API_BASE_URL: http://127.0.0.1:9
      # A skipped spec is a failure here: each spec skips itself when the wasm or its
      # exports are missing, which in this job means the build above went wrong.
      - name: the four real-engine specs, none skipped
        run: |
          npm run test:e2e:real-engine -- --reporter=list,json
          node -e '
            const { stats } = JSON.parse(require("fs").readFileSync(process.env.PLAYWRIGHT_JSON_OUTPUT_NAME, "utf8"));
            console.log("passed " + stats.expected + ", failed " + stats.unexpected + ", flaky " + stats.flaky + ", skipped " + stats.skipped);
            if (stats.skipped > 0 || stats.expected === 0) {
              console.error("a real-engine spec skipped: the wasm or one of its exports is missing");
              process.exit(1);
            }'
        env:
          E2E_SKIP_BUILD: '1'
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/real-engine-results.json
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-real-engine
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
  lhci:
    needs: build
    if: github.event_name != 'schedule' && vars.LAUNCH_MODE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: { run: { working-directory: web } }
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with: *checkout
      - uses: ./.github/actions/data-builds
      - uses: actions/setup-node@v4
        with:
          {
            node-version-file: web/.node-version,
            cache: npm,
            cache-dependency-path: web/package-lock.json,
          }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      # lighthouserc.json's staticDistDir mode serves dist/ itself -- no build or preview
      # server needed here, same as before the job split. Push/PR audits the 7 URLs that
      # between them hit every distinct assertMatrix pattern (see lighthouserc.push.cjs's
      # comment), 2-3 per shard so the three run in parallel instead of one job auditing all
      # 7; LHCI_PUSH_SHARD picks which of lighthouserc.push.cjs's PUSH_GROUPS this shard
      # gets, same numberOfRuns and assertions either way. The full 16-URL list still runs,
      # unchanged, in `lhci-nightly` below.
      - run: npm run lhci:push
        env:
          FOREVER_DATA: fixture
          LHCI_PUSH_SHARD: ${{ matrix.shard }}
  lhci-nightly:
    needs: build
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version-file: web/.node-version,
            cache: npm,
            cache-dependency-path: web/package-lock.json,
          }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      # The full, unnarrowed 16-URL audit web/lighthouserc.json always had -- same budgets,
      # same numberOfRuns as lhci-push, just nightly instead of on every push/PR.
      - run: npm run lhci
        env:
          FOREVER_DATA: fixture
  # A red budget on main that nobody reads is no budget: lhci-nightly failed every night from
  # 2026-10-18 to 11-01 with no one the wiser. This keeps ONE open issue while main's push
  # pass (`lhci`) or the nightly full pass (`lhci-nightly`) is red, adds a comment per further
  # red run, and closes it on the next green one. Pull requests are left to their own checks.
  lhci-alert:
    needs: [lhci, lhci-nightly]
    if: >-
      always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      (needs.lhci.result != 'skipped' || needs.lhci-nightly.result != 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, issues: write }
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: 'Lighthouse budget is red on main'
      RED: ${{ contains(fromJSON('["failure","cancelled"]'), needs.lhci.result) || contains(fromJSON('["failure","cancelled"]'), needs.lhci-nightly.result) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      EVENT: ${{ github.event_name }}
      SHA: ${{ github.sha }}
    steps:
      - name: open, update or close the Lighthouse issue
        run: |
          open=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq ".[] | select(.title == env.TITLE) | .number" | head -n 1)
          body="The $EVENT run on $SHA failed a web/lighthouserc.json budget: $RUN_URL -- its log names each URL, assertion and value. Reproduce on a quiet machine (load average under 4) with \`npm run lhci:push\` in web/."
          if [ "$RED" = true ]; then
            if [ -n "$open" ]; then gh issue comment "$open" --body "$body"
            else gh issue create --title "$TITLE" --body "$body"; fi
            echo "::error title=Lighthouse budget red::$RUN_URL"
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Green again on $SHA ($EVENT): $RUN_URL"
          fi
  # always() lets a skipped real-engine through; the clauses after it put every other gate
  # back: build green, real-engine green or skipped because real-engine-scope found nothing
  # that reaches the wasm (a failed scope also skips it, and that blocks), main only.
  # web/src/ci-deploy-gate.test.ts evaluates this over every result the jobs can report.
  deploy:
    needs: [build, real-engine-scope, real-engine]
    if: >-
      always() && !cancelled() && needs.build.result == 'success' &&
      (needs.real-engine.result == 'success' ||
        (needs.real-engine.result == 'skipped' && needs.real-engine-scope.outputs.run == 'false')) &&
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The chrome snapshot step commits to main and dispatches the api deploy.
    permissions: { contents: write, actions: write }
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version-file: web/.node-version,
            cache: npm,
            cache-dependency-path: web/package-lock.json,
          }
      - run: npm ci
      # The simulator's browser artifact (web/public/_sim/README.md's contract). setup-go
      # before the pin, so `go mod tidy` runs on the version sim/go.mod declares rather than
      # on whatever the runner image happens to ship -- same ordering as sim.yml's own jobs.
      - uses: actions/setup-go@v5
        with: { go-version-file: sim/go.mod, cache-dependency-path: sim/go.sum }
      - uses: ./.github/actions/pin-engine
      # These three run from the repository root, not web/ (this job's defaults.run), the
      # same way sim.yml's "the active build's item database" step does.
      - name: the active build's item database
        working-directory: .
        run: make simdb
      # publish-wasm runs `make artifacts` itself (the build, sim.js, forever-sim and the
      # budget-gated sim.wasm.gz and sim.wasm.br), so a separate `make artifacts` step only did it twice.
      - name: build and publish the browser pair under web/public/_sim/<engine sha>-<wasm hash>/
        working-directory: .
        run: |
          make publish-wasm
          echo "PUBLIC_SIM_ARTIFACT=$(cat artifacts/ARTIFACT_ID)" >> "$GITHUB_ENV"
      # web/public/_sim/README.md's contract is that the published directory's name is the
      # engine sha plus a hash of the wasm's bytes (PUBLIC_SIM_ARTIFACT, set by the publish
      # step), and that sha must be the one web/src/lib/sim/version.ts's ENGINE_VERSION
      # literal names -- version.test.ts asserts the same equality against
      # sim/enginever/version.go, but that test runs the CHECKED-IN fake build in `build`
      # above, not this job, so the equality is asserted again here against what was just
      # published, and a missing file (not merely a wrong sha) fails loudly rather than
      # shipping a page whose engine.ts points at nothing.
      - name: sim engine artifacts match the pinned version
        working-directory: .
        run: |
          pin=$(sed -n 's/.*Version = "\(.*\)"/\1/p' sim/enginever/version.go)
          test -n "$pin" || { echo "sim/enginever/version.go has no Version"; exit 1; }
          web_version=$(sed -n "s/.*ENGINE_VERSION = '\([^']*\)'.*/\1/p" web/src/lib/sim/version.ts)
          test -n "$web_version" || { echo "web/src/lib/sim/version.ts has no ENGINE_VERSION literal"; exit 1; }
          if [ "$pin" != "$web_version" ]; then
            echo "engine version mismatch: sim/enginever/version.go pins '$pin' but web/src/lib/sim/version.ts carries '$web_version'"
            exit 1
          fi
          case "$PUBLIC_SIM_ARTIFACT" in "$pin-"*) ;; *) echo "PUBLIC_SIM_ARTIFACT '$PUBLIC_SIM_ARTIFACT' does not belong to engine $pin"; exit 1;; esac
          test -f "web/public/_sim/$PUBLIC_SIM_ARTIFACT/sim.wasm.gz" || { echo "missing web/public/_sim/$PUBLIC_SIM_ARTIFACT/sim.wasm.gz"; exit 1; }
          test -f "web/public/_sim/$PUBLIC_SIM_ARTIFACT/sim.wasm.br" || { echo "missing web/public/_sim/$PUBLIC_SIM_ARTIFACT/sim.wasm.br"; exit 1; }
          test -f "web/public/_sim/$PUBLIC_SIM_ARTIFACT/sim.js"   || { echo "missing web/public/_sim/$PUBLIC_SIM_ARTIFACT/sim.js"; exit 1; }
          echo "engine $pin: sim.wasm.gz, sim.wasm.br and sim.js published as $PUBLIC_SIM_ARTIFACT for the production build"
      # CF_PAGES makes the build fail if src/data/links.json still holds a PLACEHOLDER link.
      # FOREVER_DATA is unset here on purpose: a real build prerenders no fixture report,
      # rankings, character or guild page and publishes no public/logs-data/.
      # PUBLIC_SIM_ENGINE=wasm is set ONLY here, for the production build: `build`, `build-real`,
      # `e2e` and `lhci` all keep building and auditing the checked-in fake engine, unchanged,
      # because none of the fixture pages those jobs even reach exercise the real wasm.
      - run: CF_PAGES=1 npm run build
        env:
          PUBLIC_SIM_ENGINE: wasm
      # The two DuckDB engine modules are over Cloudflare's 25 MiB static-asset cap, so
      # they are served from the foreversixty-logs bucket by src/worker.ts instead of from
      # dist/ (web/README.md, "Deep queries"). `npm run build` staged them; putting them in
      # the bucket needs an R2 write token, which is user-owned setup. Until that secret
      # exists this says so rather than failing the deploy: every page but the Queries view
      # works without it, and the upload is idempotent once per version.
      - name: Upload the DuckDB runtime to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_R2_TOKEN is not set; skipping the DuckDB runtime upload"
          else
            npm run upload:duckdb
          fi
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy
      # The API's /b pages wear the site's header and footer from api/internal/site/chrome.html,
      # a snapshot of this build's chrome (component audit 2026-11-10, cluster 20). It is
      # regenerated here from the build just deployed, never by hand: when the chrome changed,
      # the bot commits the snapshot and the /b parity fixtures built on it and dispatches the
      # api deploy (a push made with GITHUB_TOKEN starts no workflow of its own), with the data
      # bots' rebase and retry. Island uids are numbered, so an unchanged chrome commits nothing.
      - uses: actions/setup-go@v5
        with: { go-version-file: api/go.mod, cache-dependency-path: api/go.sum }
      - name: Regenerate the API's chrome snapshot from this build
        working-directory: api
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go test ./internal/site -run TestChromeSnapshotMatchesTheBuiltSite -update
          snapshot=(internal/site/chrome.html internal/site/testdata/chrome.html ../web/tests/e2e/fixtures/shared-build)
          if git diff --quiet -- "${snapshot[@]}"; then
            echo "the chrome snapshot is current"
            exit 0
          fi
          # The /b parity fixtures are the API page with that chrome in it (TestSharedBuildParityFixtures).
          go test ./internal/site -run TestSharedBuildParityFixtures -update
          go test ./internal/site
          git config user.name "forever-data-bot"
          git config user.email "bot@foreversixty.gg"
          git add "${snapshot[@]}"
          git commit -m "chore(site): regenerate the chrome snapshot from $GITHUB_SHA"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash --quiet origin main && git push --quiet origin HEAD:main; then
              gh workflow run api.yml --ref main
              exit 0
            fi
            echo "push attempt $attempt failed; retrying"
            sleep 20
          done
          exit 1
