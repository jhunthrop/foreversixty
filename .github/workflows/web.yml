# .github/workflows/web.yml
name: web
on:
  push:
    branches: [main]
    paths: ['web/**', 'data/builds/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'data/builds/**', '.github/workflows/web.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  PUBLIC_API_BASE_URL: https://api.foreversixty.gg
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: web/.node-version, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      # `pretest` and playwright.config.ts's webServer both set FOREVER_DATA=fixture, so the
      # unit tests and the browser suite see the checked-in fixture rather than whatever the
      # data pipeline last emitted. No env var is needed here. `npm run build` below is the
      # real-data build, unset FOREVER_DATA defaulting to real; `npm run test:e2e` then
      # rebuilds dist/ on the fixture, which is the build `npm run lhci` audits.
      # tests/e2e/real-data.spec.ts skips here: it is the pre-deploy smoke, npm run test:e2e:real.
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          # The report, rankings, character and guild fixture pages only exist under
          # FOREVER_DATA=fixture, and playwright.config.ts's webServer already defaults to
          # it. This makes the dependency explicit for anyone reading the workflow.
          FOREVER_DATA: fixture
      # A failed e2e run is only diagnosable from the page snapshot and trace Playwright
      # writes under test-results/; without this they die with the runner.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run lhci
        env:
          # lhci audits whatever dist/ holds, which is the fixture build test:e2e left
          # behind -- including dist/reports/fixture2abcd.html, which is the only report
          # page that exists without an API.
          FOREVER_DATA: fixture
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: web/.node-version, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      # The simulator's browser artifact (web/public/_sim/README.md's contract). setup-go
      # before the pin, so `go mod tidy` runs on the version sim/go.mod declares rather than
      # on whatever the runner image happens to ship -- same ordering as sim.yml's own jobs.
      - uses: actions/setup-go@v5
        with: { go-version-file: sim/go.mod, cache-dependency-path: sim/go.sum }
      - uses: ./.github/actions/pin-engine
      # These three run from the repository root, not web/ (this job's defaults.run), the
      # same way sim.yml's "the active build's item database" step does.
      - name: the active build's item database
        working-directory: .
        run: make simdb
      - name: build sim.wasm, sim.js and forever-sim
        working-directory: .
        run: make artifacts
      - name: publish the browser pair under web/public/_sim/<engine sha>/
        working-directory: .
        run: make publish-wasm
      # web/public/_sim/README.md's contract is that the published directory's name IS the
      # engine sha, and that sha must be the one web/src/lib/sim/version.ts's ENGINE_VERSION
      # literal names -- version.test.ts asserts the same equality against
      # sim/enginever/version.go, but that test runs the CHECKED-IN fake build in `verify`
      # above, not this job, so the equality is asserted again here against what was just
      # published, and a missing file (not merely a wrong sha) fails loudly rather than
      # shipping a page whose engine.ts points at nothing.
      - name: sim engine artifacts match the pinned version
        working-directory: .
        run: |
          pin=$(sed -n 's/.*Version = "\(.*\)"/\1/p' sim/enginever/version.go)
          test -n "$pin" || { echo "sim/enginever/version.go has no Version"; exit 1; }
          web_version=$(sed -n "s/.*ENGINE_VERSION = '\([^']*\)'.*/\1/p" web/src/lib/sim/version.ts)
          test -n "$web_version" || { echo "web/src/lib/sim/version.ts has no ENGINE_VERSION literal"; exit 1; }
          if [ "$pin" != "$web_version" ]; then
            echo "engine version mismatch: sim/enginever/version.go pins '$pin' but web/src/lib/sim/version.ts carries '$web_version'"
            exit 1
          fi
          test -f "web/public/_sim/$pin/sim.wasm" || { echo "missing web/public/_sim/$pin/sim.wasm"; exit 1; }
          test -f "web/public/_sim/$pin/sim.js"   || { echo "missing web/public/_sim/$pin/sim.js"; exit 1; }
          echo "engine $pin: sim.wasm and sim.js published for the production build"
      # CF_PAGES makes the build fail if src/data/links.json still holds a PLACEHOLDER link.
      # FOREVER_DATA is unset here on purpose: a real build prerenders no fixture report,
      # rankings, character or guild page and publishes no public/logs-data/.
      # PUBLIC_SIM_ENGINE=wasm is set ONLY here, for the production build: `verify` above (the
      # test job and its Lighthouse run) keeps building and auditing the checked-in fake
      # engine, unchanged, because none of the fixture pages this job's build even reaches
      # exercise the real wasm.
      - run: CF_PAGES=1 npm run build
        env:
          PUBLIC_SIM_ENGINE: wasm
      # The two DuckDB engine modules are over Cloudflare's 25 MiB static-asset cap, so
      # they are served from the foreversixty-logs bucket by src/worker.ts instead of from
      # dist/ (web/README.md, "Deep queries"). `npm run build` staged them; putting them in
      # the bucket needs an R2 write token, which is user-owned setup. Until that secret
      # exists this says so rather than failing the deploy: every page but the Queries view
      # works without it, and the upload is idempotent once per version.
      - name: Upload the DuckDB runtime to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_R2_TOKEN is not set; skipping the DuckDB runtime upload"
          else
            npm run upload:duckdb
          fi
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy
