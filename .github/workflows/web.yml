# .github/workflows/web.yml
name: web
on:
  push:
    branches: [main]
    paths: ['web/**', 'data/builds/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'data/builds/**', '.github/workflows/web.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  PUBLIC_API_BASE_URL: https://api.foreversixty.gg
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: web/.node-version, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      # `pretest` and playwright.config.ts's webServer both set FOREVER_DATA=fixture, so the
      # unit tests and the browser suite see the checked-in fixture rather than whatever the
      # data pipeline last emitted. No env var is needed here. `npm run build` below is the
      # real-data build, unset FOREVER_DATA defaulting to real; `npm run test:e2e` then
      # rebuilds dist/ on the fixture, which is the build `npm run lhci` audits.
      # tests/e2e/real-data.spec.ts skips here: it is the pre-deploy smoke, npm run test:e2e:real.
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          # The report, rankings, character and guild fixture pages only exist under
          # FOREVER_DATA=fixture, and playwright.config.ts's webServer already defaults to
          # it. This makes the dependency explicit for anyone reading the workflow.
          FOREVER_DATA: fixture
      - run: npm run lhci
        env:
          # lhci audits whatever dist/ holds, which is the fixture build test:e2e left
          # behind -- including dist/reports/fixture2abcd.html, which is the only report
          # page that exists without an API.
          FOREVER_DATA: fixture
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: web/.node-version, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      # CF_PAGES makes the build fail if src/data/links.json still holds a PLACEHOLDER link.
      # FOREVER_DATA is unset here on purpose: a real build prerenders no fixture report,
      # rankings, character or guild page and publishes no public/logs-data/.
      - run: CF_PAGES=1 npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy
